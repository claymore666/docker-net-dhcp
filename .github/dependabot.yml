# Weekly grouped dependency updates (#127). PRs target the 2.x
# integration branch, which is where development happens until v2.0.0
# ships — nothing lands on main except via release PRs.
# Grouping keeps the noise at one PR per ecosystem per week.
#
# THIS IS THE ONE PLACE THAT SPELLS THE BRANCH OUT. The branch is named
# after the milestone it works toward and is renamed at each milestone
# boundary (D27); the workflow triggers follow it through the `2.*`
# pattern, but `target-branch` takes a branch NAME and no pattern, so a
# rename must edit the four values below. Dependabot does not fail on an
# unknown branch — it falls back to the default branch — so a stale value
# here is silent.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: "2.0.0"
    schedule:
      interval: weekly
      day: sunday
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: "2.0.0"
    schedule:
      interval: weekly
      day: sunday
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Hold actions/download-artifact at v7 until actions/upload-artifact
      # ships a v8. download-artifact v8 defaults a download digest
      # mismatch to a hard failure, and pairing upload v7 (its current
      # latest) with download v8 mixes majors on the release artifacts.
      # Remove this once upload-artifact v8 exists so both bump together.
      - dependency-name: "actions/download-artifact"
        versions: [">= 8"]

  # Keep the SHA-pinned base-image digests fresh (#159). One entry per
  # Dockerfile directory: the plugin build at the root and the CI
  # runner image under ci/runner-image.
  - package-ecosystem: docker
    directories:
      - /
      - /ci/runner-image
    target-branch: "2.0.0"
    schedule:
      interval: weekly
      day: sunday
    groups:
      docker:
        patterns:
          - "*"

  # The documentation site's hash-pinned build deps (#511). Without this
  # entry the file gets no scheduled updates at all — only Dependabot
  # *security* PRs, which ignore target-branch and open against the
  # default branch. A weekly ecosystem producing zero PRs is
  # indistinguishable from one with nothing to update.
  - package-ecosystem: pip
    directory: /docs
    target-branch: "2.0.0"
    schedule:
      interval: weekly
      day: sunday
    groups:
      docs-deps:
        patterns:
          - "*"
