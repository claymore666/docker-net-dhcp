name: Bug report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for filing a bug. **Do not use this form for security
        vulnerabilities.** Follow the private process in
        [SECURITY.md](https://github.com/claymore666/docker-net-dhcp/blob/main/SECURITY.md).
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From `docker plugin ls` (e.g. v2.0.0-rc1).
      placeholder: v2.0.0-rc1
    validations:
      required: true
  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: "Output of `docker version --format '{{.Server.Version}}'`."
      placeholder: "29.7.2"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Network mode
      description: The `mode` driver option of the affected network.
      options:
        - bridge
        - macvlan
        - ipvlan
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >-
        Include the `docker network create` line and any `docker run` /
        compose snippet needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Plugin logs
      description: >-
        Docker has no `plugin logs` subcommand. Read the log with
        `sudo cat /var/lib/docker/plugins/*/rootfs/var/log/net-dhcp.log`,
        or from the daemon log where dockerd captured it. Both recipes are
        under [Plugin log](https://claymore666.github.io/docker-net-dhcp/reference/#plugin-log).
        Automatically rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false
