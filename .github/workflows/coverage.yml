name: Coverage

# Integration coverage harvesting. Builds a cover-instrumented plugin
# (`go build -cover -coverpkg=./...`), runs the full integration suite
# against it, then flushes counter files via `docker plugin disable`
# and reports per-package coverage + uploads an HTML report.
#
# Triggers: manual (`workflow_dispatch`) for on-demand numbers, plus
# pull_request into main so release PRs are gated by the coverage
# ratchet (scripts/coverage-ratchet.sh vs .github/coverage-baseline.txt).
# Coverage runs cost ~3-5 min on top of the integration suite (cover
# plugin build + flush + report); the per-PR production gate stays
# `integration.yml`.
#
# Same ephemeral `dhcp-ci` runners as integration.yml, same security
# posture: a forked PR into main would trigger this (the pull_request
# trigger below, added in #127), so the outside-collaborator approval
# requirement is what keeps untrusted code off the privileged runners.
on:
  workflow_dispatch:
  # Release PRs (dev → main) run coverage as a required check: the
  # ratchet below guarantees no release ships with regressed coverage.
  # Feature PRs into dev stay on-demand via workflow_dispatch — the
  # ~15-20 min cost is a release gate, not a per-PR tax (#127).
  #
  # THAT GAP IS ACCEPTED, AND IT IS NOT UNWATCHED (#735). Measuring
  # coverage on every dev PR would put a third and fourth self-hosted
  # job on a pool of eight, where two concurrent integration runs
  # already saturate it. What was actually dangerous about the gap was
  # narrower than the measurement: a floor could be LOWERED on the way
  # into dev, seen by no coverage run at all, and the release PR would
  # then ratchet against the already-lowered number. That half needs no
  # counters — it is two git blobs — so it runs on every pull request
  # as `scripts/check-coverage-floor.sh` in test.yaml. The expensive
  # half stays here.
  pull_request:
    branches:
      - main

# Per-ref, matching integration.yml (#390) — see there for the full
# rationale.
#
# Moving in step with integration.yml is the point rather than a
# side effect. Under the old global group this workflow was the one
# that lost work: a coverage run on the release PR shares a queue with
# every integration run in the repo, so a routine merge into dev would
# silently cancel it and leave the release PR waiting on a required
# check that was never going to arrive (#365). Different refs, different
# groups — a dev push can no longer displace a release PR's coverage.
#
# What is left, and why it is left: this run still shares a group with
# the release PR's own integration run, because they are the same ref.
# So the two serialize, and coverage starts once integration finishes.
# That is deliberate, but NOT for the reason first written here.
#
# The original argument was that splitting "would put three privileged
# jobs on the host at once, which is the dose #296 saw flake". That has
# been overtaken: #375 split the suites and #381/#468 sharded main, so
# every PR run already puts four privileged jobs on the pool. Three is
# not an untested dose; it is Tuesday.
#
# The reason it stays is arithmetic (measured 2026-08-02, #430). After
# #356 the integration gate is ~4m36 and coverage is 22-34 min, so on a
# release PR the split saves ~5 minutes of a ~30 minute wall clock,
# once per release — and it does so by adding a fifth privileged job to
# a pool of eight that already queues at six. Queue time is ~2s across
# every recent run except the one where two runs overlapped, which cost
# a suite job 2m10.
#
# So the binding constraint is pool capacity, not contention, and the
# same runners buy far more elsewhere: #468 took 25% off the gate that
# runs all day, for one matrix entry. #430 is closed on those numbers;
# reopen the question with a bigger pool, not with this comment.
#
# The residual cancellation window is narrow but real: GitHub keeps one
# running plus one pending run per group, so pushing a new commit to the
# release PR while coverage is still pending cancels it. Same symptom as
# #365 — a required check with no run, indistinguishable from pending.
# It recurred on the v1.5.0 release PR (#504), which is why it is no
# longer left to the reader: coverage-presence.yml watches the head and
# goes red, naming the evicted run and the command that recovers it. A
# job here could not do that — concurrency is per run, so it would be
# evicted alongside the thing it is meant to report on. The release
# runbook carries the manual form; see "release PR blocked on a check
# that has no run".
concurrency:
  # Branch pushes key on the COMMIT (#617): a merge burst into dev used to
  # evict the queued run, leaving a commit nothing ever tested. PR events
  # stay per-ref so a superseded PR head is replaced instead of holding
  # pool slots next to its successor.
  group: selfhosted-privileged-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage:
    runs-on: [self-hosted, dhcp-ci]
    # 35 = main + failure-injection suites against the instrumented
    # plugin (#128) + cover build + margin.
    timeout-minutes: 35
    env:
      COVER_PLUGIN_REF: ghcr.io/claymore666/docker-net-dhcp:golang-cover
      COVER_DIR: /var/lib/dh-cover
      # See integration.yml — step-level `if:` cannot read the secrets
      # context, so the presence check is materialized here.
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ratchet reads the baseline from the merge base, not from
          # this branch (#735); a shallow clone cannot resolve it.
          fetch-depth: 0

      # Same reasoning as integration.yml's login (#562): the cover
      # build pulls the same two Hub base images, from the same pool,
      # against the same shared per-address anonymous quota.
      #
      # This job is the one that can least afford it. It runs on the
      # release PR and carries the coverage ratchet — the one gate the
      # project does not wave through — so a 429 here blocks a release
      # for a reason unconnected to the code.
      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Note that Docker Hub pulls are anonymous
        if: env.HAS_HUB_CREDS != 'true'
        run: |
          echo "::warning title=Anonymous Docker Hub pulls::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not available to this job, so base-image pulls share the per-address anonymous quota and may hit a 429 (#562)."

      # Coverage uses `-coverpkg=./...` for the unit-test step, which
      # forces go test to recompile stdlib's internal/coverage runtime
      # support. The runner's pre-installed Go (used unmodified by
      # integration.yml) had `compile` and `pkg/tool` versions diverge
      # at one point, so stdlib recompiles failed with the
      # 'compile: version "go1.25.9" does not match go tool version
      # "go1.25.0"' error. setup-go gives us a known-clean toolchain
      # at the cost of ~30s — fine for a workflow that runs only on
      # release PRs and manual dispatch, not per feature PR.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      # The ref is passed explicitly because this lane's plugin is
      # COVER_PLUGIN_REF, not the :integration tag the other lanes use.
      # cleanup-orphans re-enables a plugin a panicked recovery test may
      # have left disabled, and it can only do that for the tag it is
      # told about (#742).
      - name: Cleanup orphans from previous runs
        env:
          INTEGRATION_PLUGIN_REF: ${{ env.COVER_PLUGIN_REF }}
        run: bash test/integration/cleanup-orphans.sh

      # Wipe any counter/meta files from a previous coverage run so
      # `go tool covdata` only sees data from this invocation. The
      # mkdir is idempotent — first ever run creates it, subsequent
      # runs no-op.
      - name: Prepare coverage dir
        run: |
          mkdir -p "${COVER_DIR}"
          rm -f "${COVER_DIR}"/cov*

      # Build the instrumented plugin from the current checkout. We
      # rebuild every run rather than caching the image: cover builds
      # are PR-specific (the instrumented binary changes whenever any
      # tracked .go file does), so a cache here would be a footgun.
      - name: Build + install cover plugin
        run: |
          make plugin-cover
          docker plugin rm -f "${COVER_PLUGIN_REF}" 2>/dev/null || true
          # Every bind source must pre-exist or `docker plugin enable`
          # fails the mount (#440). Derive them from the manifest we are
          # about to install rather than naming one: config-cover.json
          # carries sources config.json does not (dh-cover, dh-capture),
          # and a hardcoded list here silently rots when one is added
          # (#660, #666). /var/lib only — /var/run/docker.sock is a
          # socket, and mkdir -p would replace it with a directory.
          jq -r '.mounts[]? | select(.type=="bind") | .source
                 | select(startswith("/var/lib/"))' \
              plugin-cover/config.json | xargs -r mkdir -p
          docker plugin create "${COVER_PLUGIN_REF}" plugin-cover
          # Same test-only cadence as integration.yml (#278) — this job
          # runs the failure suite too, so it pays the same waits.
          docker plugin set "${COVER_PLUGIN_REF}" LOG_LEVEL=trace \
            OUTAGE_TICK=2s OUTAGE_GRACE=10s
          docker plugin enable "${COVER_PLUGIN_REF}"

      # The harness routes everything through INTEGRATION_PLUGIN_REF
      # (default :golang). Pointing it at :golang-cover makes the
      # whole suite drive the instrumented plugin.
      - name: Run integration tests against cover plugin
        env:
          INTEGRATION_PLUGIN_REF: ${{ env.COVER_PLUGIN_REF }}
        run: make integration-test

      # The failure-injection suite (#128) exercises paths the main
      # suite can't reach (NAK handling, post-expiry retry loop) — the
      # ratchet counts both runs' coverage, so both must drive the
      # instrumented plugin.
      #
      # if: always() for the same reason as the other lanes (#742), and
      # with an extra one here: a red main suite would otherwise skip
      # this step, the counters flushed below would hold data from one
      # suite instead of two, and the ratchet at the end of this job
      # would compare a partial measurement against a full baseline.
      # Found by scripts/check-lane-hygiene.sh, not by #742, which
      # listed only the two non-gating lanes.
      - name: Run failure-injection tests against cover plugin
        if: always()
        env:
          INTEGRATION_PLUGIN_REF: ${{ env.COVER_PLUGIN_REF }}
        run: make integration-test-failure

      # Flush counter files. Go's binary coverage runtime only writes
      # `covcounters.*` on graceful exit, which `docker plugin disable`
      # triggers (SIGTERM → plugin shuts down → runtime flushes).
      # Always-run so even a failing test gets partial coverage.
      - name: Flush coverage counters
        if: always()
        run: |
          docker plugin disable "${COVER_PLUGIN_REF}" || true
          ls -la "${COVER_DIR}"

      # Run the unit test suite with coverage so the workflow summary
      # can report unit + integration + merged numbers (I-14 in the
      # 2026-05-05 review). go test's `-cover -test.gocoverdir` writes
      # the same binary-coverage format covdata understands, which
      # lets us merge directly without converting through textfmt.
      - name: Run unit tests with coverage
        if: always()
        run: |
          mkdir -p coverage-unit
          # `go test` syntax: [flags] [packages] [-args test-args].
          # Packages MUST come before `-args`: anything after `-args`
          # is passed to the compiled test binary, so the previous form
          # made go test see no packages and fall back to '.', failing
          # with "no Go files in <repo>".
          go test -count=1 -coverpkg=./... ./pkg/... ./cmd/... \
              -args -test.gocoverdir="$PWD/coverage-unit"

      - name: Coverage summary
        if: always()
        run: |
          if ! ls "${COVER_DIR}"/covcounters.* >/dev/null 2>&1; then
            echo "No coverage counter files found — plugin may have crashed before flush."
            exit 1
          fi
          {
              echo "## Coverage by package"
              echo
              echo "### Integration only"
              echo '```'
              go tool covdata percent -i="${COVER_DIR}"
              echo '```'
              if ls coverage-unit/covcounters.* >/dev/null 2>&1; then
                  echo "### Unit only"
                  echo '```'
                  go tool covdata percent -i=coverage-unit
                  echo '```'
                  echo "### Merged (unit + integration)"
                  echo '```'
                  go tool covdata percent -i="${COVER_DIR}",coverage-unit
                  echo '```'
              fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The ratchet: merged per-package coverage must hold the floors
      # in .github/coverage-baseline.txt. No `if: always()` on purpose —
      # a failed suite produces partial counters and would false-alarm;
      # the ratchet only judges complete runs (#127).
      #
      # THE FLOORS COME FROM THE MERGE BASE, NOT FROM THIS BRANCH (#735).
      # Passing the PR's own copy meant a branch that lowered a floor was
      # measured against the number it had just lowered — the comparison
      # was with itself, and it always passed. The only control was a
      # sentence in the script's header, and a sentence is not a check.
      # On a push or a dispatch there is no merge base, so the working
      # copy is the honest answer and is used as-is.
      - name: Coverage ratchet
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if ls coverage-unit/covcounters.* >/dev/null 2>&1; then
            go tool covdata percent -i="${COVER_DIR}",coverage-unit > /tmp/covdata-percent.txt
          else
            echo "No unit counters found — ratcheting on integration coverage alone would false-alarm."
            exit 1
          fi
          cat /tmp/covdata-percent.txt

          # The resolution lives in a script, not here, because this
          # workflow triggers only on pull requests into main: inline,
          # its first execution would be the release PR, with a defect
          # failing a required check while the release is in flight.
          # scripts/test-coverage-baseline-at.sh runs on every PR.
          baseline=.github/coverage-baseline.txt
          if [ -n "${BASE_REF:-}" ]; then
            bash scripts/coverage-baseline-at.sh "$BASE_REF" /tmp/coverage-baseline-base.txt
            baseline=/tmp/coverage-baseline-base.txt
          else
            echo "No pull_request context — ratcheting against the working copy's baseline."
          fi
          bash scripts/coverage-ratchet.sh /tmp/covdata-percent.txt "$baseline"

      - name: Generate coverage reports
        if: always()
        run: |
          if ! ls "${COVER_DIR}"/covcounters.* >/dev/null 2>&1; then
            echo "Skipping report generation — no counter files."
            exit 0
          fi
          # Per-source profiles: integration-only (back-compat), and
          # merged when unit counters are present.
          go tool covdata textfmt -i="${COVER_DIR}" -o coverage.out
          if ls coverage-unit/covcounters.* >/dev/null 2>&1; then
              go tool covdata textfmt -i="${COVER_DIR}",coverage-unit -o coverage-merged.out
              go tool cover -html=coverage-merged.out -o coverage-merged.html
          fi
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            coverage.html
            coverage-merged.out
            coverage-merged.html
          if-no-files-found: warn
          retention-days: 30

      # Tear down the cover plugin so a follow-up integration.yml run
      # on the same runner doesn't trip over a stale :golang-cover
      # reference. The production :golang plugin is untouched.
      - name: Tear down cover plugin
        if: always()
        run: |
          docker plugin disable "${COVER_PLUGIN_REF}" 2>/dev/null || true
          docker plugin rm -f "${COVER_PLUGIN_REF}" 2>/dev/null || true
          rm -f "${COVER_DIR}"/cov*
