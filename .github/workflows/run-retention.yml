# Delete workflow runs older than a window, keeping the last N complete CI
# groups and every run that is build provenance for a published artifact.
#
# WHY A SCHEDULE AND NOT A ONE-OFF. This repository produces roughly 325
# runs a day. A manual purge of several thousand runs is undone in about
# ten days, so a cleanup that is not scheduled is not a fix — it is a
# chore that comes back. The policy lives in scripts/purge-workflow-runs.sh
# and is exercised by scripts/test-purge-workflow-runs.sh; this file is
# only the trigger and the credentials.
#
# THIS FILE IS LIVE AND IT DELETES. It reached `main` with the v1.9.0
# release, `main` is the default branch, and the scheduled lane passes
# DRY_RUN=0 -- so the daily 04:17 UTC run removes runs for real, against
# several hundred of them. A manual dispatch still defaults to a dry run.
#
# WHY THE DEFAULT BRANCH IS WHAT DECIDES (#846). GitHub runs `schedule`
# only from the default branch, and the same is true of workflow_dispatch.
# Merged to `dev` a workflow is inert on BOTH triggers and is not in the
# workflows API at all -- measured 2026-08-27, while this file was still
# dev-only: `gh workflow list --all` did not return it, and 100 of the 100
# most recent schedule-triggered runs in this repo fired on `main`. That is
# the normal state of a new workflow here for one release cycle;
# .github/dispatch-pending.txt is where one still waiting on the default
# branch is declared, and this file's entry went when it shipped.
#
# WHY THE DEFAULT IS A DRY RUN EVERYWHERE BUT THE SCHEDULE. A destructive
# job that deletes by default is one typo in an input away from erasing
# the history it is meant to prune. The scheduled lane passes DRY_RUN=0
# explicitly; every manual dispatch has to ask for it.
name: Run retention

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose: GitHub's scheduler queues
    # heavily at :00 and a delayed run here is invisible until the count
    # creeps back up.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Keep runs newer than this many days'
        required: false
        default: '7'
      keep_groups:
        description: 'Keep this many most-recent complete CI groups regardless of age'
        required: false
        default: '10'
      dry_run:
        description: 'Report only (1) or actually delete (0)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  # Two purges racing would both list, both compute a delete set from a
  # tree the other is mutating, and each would try to delete runs the
  # other already removed. Serialise; never cancel a run mid-delete.
  group: run-retention
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Hoisted to the JOB so the before/after detector steps can read the
      # same value the purge acted on. The schedule is the only trigger
      # that deletes; a dispatch must ask for it.
      DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (github.event.inputs.dry_run || '1') }}
    permissions:
      contents: read
      actions: write   # the only job that deletes runs; nothing else needs it
      # Keep rule 4 lists the open pull requests to learn which head SHAs
      # must never be purged (#740). Without this the token is refused on
      # repos/*/pulls and the purge exits 2 on every scheduled run — a
      # fail-closed dependency added by #874 and not visible in this file's
      # `run:` line, which is why it is named here.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE PURGE'S OWN OPINION IS NOT EVIDENCE THAT IT DID THE RIGHT THING.
      # It excludes the keep sets it built itself, so asking it again would
      # be checking the code against itself. check-missing-runs.sh is the
      # independent consumer -- it is the gate that went red on #221 after
      # the purge's first real outing -- so this job asks IT, before and
      # after, and fails on the transition.
      #
      # BEFORE, so a pre-existing red cannot be attributed to this purge.
      # A run that starts red can only report "already red"; only green ->
      # red is this job's fault, and that is the only case that fails here.
      - name: Detector state BEFORE the purge
        if: ${{ env.DRY_RUN == '0' }}
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_REPO: ${{ github.repository }}
        run: |
          rc=0
          bash scripts/check-missing-runs.sh || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "detector before the purge: rc=$rc"

      - name: Purge old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
          KEEP_GROUPS: ${{ github.event.inputs.keep_groups || '10' }}
        run: bash scripts/purge-workflow-runs.sh

      # AFTER. `!cancelled()` and not `success()`: the purge exits 1 when
      # some deletions failed, which means deletions still HAPPENED, and a
      # refusal (exit 2) deleted nothing but still has to be reported
      # against a known before-state rather than skipped silently.
      - name: Verify the purge left the detector's evidence intact
        if: ${{ !cancelled() && env.DRY_RUN == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_REPO: ${{ github.repository }}
          BEFORE_RC: ${{ steps.before.outputs.rc }}
        run: |
          rc=0
          bash scripts/check-missing-runs.sh || rc=$?
          echo "detector after the purge: rc=$rc (before: ${BEFORE_RC:-unknown})"
          if [ "${BEFORE_RC:-}" != "0" ]; then
              echo "::warning title=Detector was not green before this purge::the" \
                   "missing-run detector exited ${BEFORE_RC:-unknown} BEFORE this job" \
                   "deleted anything, so this run cannot attribute its state to the" \
                   "purge. Not failing on a red this job did not cause."
              exit 0
          fi
          if [ "$rc" != "0" ]; then
              echo "::error title=The purge destroyed evidence the detector demands::the" \
                   "missing-run detector was green before this job ran and exits $rc after" \
                   "it. Keep rule 4 or 5 did not cover a head that check-missing-runs.sh" \
                   "reconciles -- the #740/#837 collision, recurring (#874)." >&2
              exit 1
          fi
          echo "the detector is still green after the purge"
