name: Integration

# Live integration tests against the plugin. Run on the self-hosted
# `dhcp-ci` runners: they need privileges (CAP_NET_ADMIN, mount/netns
# ops, bind UDP/67) and a real DHCP server (dnsmasq). Those work on a
# GitHub-hosted VM too (full root via sudo) — the reason this lane is
# self-hosted is control and parity: a purpose-built image pinning the
# toolchain and Docker Engine >=28, pooled for parallelism, gives a
# stable per-PR gate. A stock hosted runner is exercised separately and
# non-gating by integration-hosted.yml (#238) as a portability check.
#
# The `dhcp-ci` runners are ephemeral: one container = one job, each
# with its own nested Docker daemon (image ghcr.io/claymore666/
# dhcp-ci-runner, Docker Engine >= 28). An orchestrator pools them
# (names dhcp-ci-<n>); 16 of them, dhcp-ci-1..16 — MEASURED 2026-08-28
# from the runners API. This line said 8, and so did every other
# capacity comment in this file and in coverage.yml, until #878
# re-measured them — which is why each of them now carries its operand
# and the date it was measured. How long they had been wrong is not
# known and is not claimed: nothing recorded when the pool grew, which
# is the whole reason a comment is the wrong place to keep a count.
# Read it from the API, not from a comment.
#
# JOB TOPOLOGY (#375, D41). The two suites used to run as sequential
# steps in one job — ~10:38 then ~8:45, a ~20:20 gate. Nothing couples
# them: they are separate `go test` invocations, each standing up its own
# fixture in its own TestMain. They run as concurrent jobs on their own
# runners, so the gate is max() over them rather than the sum.
#
#   gate               decide once whether the suites are needed at all
#   build              build the plugin ONCE and publish it as an
#                      artifact; hosted, no pool slot
#   main-1..9-suite \   one `go test` each, own runner, INSTALLING the
#   failure-1..2    /   artifact rather than building its own copy
#   integration        aggregator — the required check
#
# THE BUILD IS ONE JOB NOW (#396, D41). Every suite job used to run
# `make plugin` itself: MEASURED 2026-09-06 in run 34064155841, 82-90s
# per job, six times, for six byte-identical images. It bought nothing —
# the jobs do not share a Docker daemon, so the duplication was not even
# a cache miss, it was six cold builds of one tree — and it cost six
# Docker Hub pulls of the same two base images against a per-address
# quota the whole pool shares (#562). The build now happens once, on a
# hosted runner, and the suite jobs install what it published.
#
# WHAT THAT MOVES AND WHAT IT DOES NOT. It does not move the critical
# path by itself: the build leaves each suite job and reappears in front
# of them, and hosted builds it in about half the time the pool did. What
# it buys is BUDGET — ~85s of every suite job's wall clock — which is
# what makes a shard count that clears five minutes affordable at all.
#
# Suite jobs no longer build, so nothing in them can produce a DIFFERENT
# plugin from the one the run is about. That is asserted rather than
# assumed: the build job derives the commit ONCE, exports it as a job
# output, and every suite job requires the RUNNING plugin to report that
# commit before a test executes.
#
# The main suite is split nine ways and the failure suite two (#381,
# #468, #877, D41); the counts live in the matrix below, next to the
# measurement that justifies them.
#
# The aggregator is named `integration` ON PURPOSE. That is the literal
# required-status context on both `dev` and `main`, so this topology
# needs NO branch-protection edit, and reverting to the single job needs
# none either. Do not rename it, and do not let a matrix generate the
# required name (`integration (1)` etc.) — that would silently gate on
# nothing or block every merge.
#
# SECURITY: the suite jobs run as root inside the runner container.
# Repo Settings → Actions → General → "Fork pull request workflows
# from outside collaborators" is set to "Require approval for all
# outside collaborators" so external PRs sit in pending until manually
# approved.
#
# Since #562 the suite jobs also hold a Docker Hub credential, which is
# why the paragraph above matters more than it did. Two things keep it
# contained, and both are load-bearing:
#
#   - `pull_request` from a fork is not given repository secrets at all,
#     so approving an external PR to run does NOT hand it this token.
#     The login step skips and the job pulls anonymously.
#   - The token is pull/push for this project's own Hub repository, not
#     an account-wide credential, and the suite jobs never push.
#
# Anything that would let fork code see the secret — moving this
# workflow to `pull_request_target`, or checking out a PR head in a job
# that has the credential — reverses that and must not be done here.
#
# `workflow_dispatch` IS such a route, and this note did not say so
# until #593. A fork's PR head is fetchable from the base repository
# (`refs/pull/<N>/head`, no `repository:` argument needed), a dispatch
# context DOES carry repository secrets, and the `ref` input below went
# straight to actions/checkout. Passing `-f ref=refs/pull/<N>/head` —
# or the head's bare SHA, which no ref pattern can see — reached the
# outcome this paragraph forbids, by a route it had not named.
#
# That is now enforced rather than described. The `dispatch-ref` job
# rejects any ref not reachable from a branch or tag of this repository
# before anything checks it out, every consumer of `inputs.ref` sits
# behind it, and scripts/check-dispatch-ref-guard.sh fails the build if
# a future job takes the input without that dependency. Prose was what
# failed here; do not replace the check with more of it.
on:
  push:
    branches:
      - main
      - dev
      - '2.*'
  pull_request:
    branches:
      - main
      - dev
      - '2.*'
  # On-demand runs against a tree that has not changed (#419).
  #
  # "Three consecutive green runs" is this project's bar for trusting a
  # change of this class, and it is what a release cut is meant to
  # clear. Without this the only ways to re-run an unchanged tree were
  # an empty commit to dev (pollutes history, bypasses the PR rule) or
  # `gh run rerun` on the originating PR run, which depends on that run
  # still existing and on remembering which one matches the tree.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA OF THIS REPOSITORY to run the suite against. Blank = the default branch. A pull-request ref is rejected (#593)."
        required: false
        type: string

# Serializes privileged self-hosted WORKFLOW RUNS (shared with
# coverage.yml, #296) — one PR's integration run cannot overlap
# another's.
#
# Note what this does NOT do, because #375 turns on it: a concurrency
# group serializes runs, not the jobs within a run. The suite jobs below
# therefore run concurrently, deliberately, and are not covered by this
# guard. That is a re-test of #296 rather than a route around it: of the
# two tests that flaked under the old bare-metal parallelism, one was
# misdiagnosed (#307 reproduced it running solo — a 5s probe budget
# undersized against dhcpcd's retransmit timing, now 8s and stable since)
# and the other left the suite with the #219 revert.
#
# This paragraph used to end "the dose is also smaller: #296 saw three
# privileged jobs overlap, this is two". That stopped being true when
# #468 made it four, #877 made it six, and D41 makes it ELEVEN. The dose
# argument is retired rather than renumbered, because it was never the
# load-bearing one: what makes concurrent privileged jobs safe here is
# that #296's three shared one bare-metal host and these eleven share
# nothing — one job per ephemeral container, each with its own nested
# Docker daemon and its own fixture. That property does not degrade with
# the count. What does degrade is pool capacity, and capacity shows up as
# queueing, not as flaking.
#
# Coverage shares this group deliberately. coverage.yml is not
# manual-only — it also runs on `pull_request` into main, i.e. on the
# release PR, and it shares this group. Keeping it here means the
# release PR's coverage run queues behind this one instead of putting a
# second privileged workload on the pool beside it.
#
# The cost is one INTEGRATION GATE of extra wall clock, once per release
# — that is the operand, not the coverage run: serialising costs the
# shorter of the two, and the gate is the shorter. MEASURED 2026-09-06
# from the jobs API on the last run before D41 (34064155841, six jobs,
# each building its own plugin): gate = max over a run's suite jobs =
# 568s (9m28). D41 rebuilds that operand — see the matrix below for what
# it becomes and how it was derived. This line read "~12 minutes" and
# named no operand until #878. Either way it is still the cheaper side of
# the trade against flaking the one gate that cannot be waved through
# (#365).
#
# EXIT CONDITION, if you are here because CI got flaky: any
# contention-signature failure — `context deadline exceeded` on the
# Docker API, probe timeouts, lease-timing overruns — means revert to
# the single sequential job and record the evidence on #375. That
# reaffirms #296 with better data than it has now. Reverting is one
# commit and leaves the required check name untouched.
#
# Scoped PER REF (#390), not globally. A ref cannot race itself — two
# pushes 30s apart still queue, which is the property worth keeping —
# but different PRs now overlap instead of serializing.
#
# The global group this replaces was costing more than #375 saved:
# every PR's run queued behind every other PR's regardless of branch,
# observed at 7 idle runners with a run pending. It also lost work,
# because GitHub keeps at most one *pending* run per group and that
# depth is not configurable — a third run silently cancelled the queued
# one. Per-ref removes that failure mode rather than mitigating it,
# since nothing shares a queue to be displaced from.
#
# What made this safe to widen is topology, not optimism: #296's
# ci-pool-exempt: #296's historical dose, not a claim about today's pool
# contention was three privileged jobs on shared bare metal. The pool is
# now ephemeral, one job per container, each with its own nested Docker
# daemon, so the isolation the group provided by hand is provided by the
# pool. The limit becomes capacity — privileged runners against the
# eleven jobs a run now asks for (D41) — which is the correct thing to
# ci-pool: integration-pool-jobs=11
# queue on. The pool is 16 (dhcp-ci-1..16, MEASURED 2026-09-08 from the
# ci-pool: pool-runners=16
# runners API) against those eleven, so ONE run fits and the next queues.
# That is a real change from #877's two: D41 spends throughput to buy
# latency, deliberately, because the maintainer's bar is on the gate a
# single PR waits for.
#
# What keeps the trade honest is that the thing being queued for got
# shorter at the same time. A job queued behind a full pool waits for a
# running suite to release its runner, and that wait is now bounded by
# the suite's own wall clock — which D41 takes from ~9m30 to under five
# minutes. The watchdog's 600s queue budget cleared the old number and
# clears the new one with more room, not less. It also names a shortage
# as a shortage (#513) rather than letting it read as a suite failure.
concurrency:
  # Branch pushes key on the COMMIT (#617): a merge burst into dev used to
  # evict the queued run, leaving a commit nothing ever tested. PR events
  # stay per-ref so a superseded PR head is replaced instead of holding
  # pool slots next to its successor.
  group: selfhosted-privileged-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # actions:read — the gate job lists this workflow's own past runs to
  # dedupe identical trees (#312).
  actions: read

jobs:
  # Validate the dispatch ref BEFORE anything checks it out (#593).
  #
  # Deliberately NOT conditioned on `github.event_name`. A skipped job
  # skips everything in its `needs:` chain, so an `if:` here would skip
  # the gate and the suites on every push and pull_request — and the
  # aggregator would read that as a failure. Instead the job always
  # runs and the script passes trivially on a blank ref, which is what
  # every non-dispatch event supplies.
  #
  # It checks out WITHOUT `ref:` on purpose: this job must never
  # materialize the untrusted tree it is judging. What it runs is the
  # workflow's own ref, which required write access to dispatch.
  dispatch-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. The check answers "is this commit reachable
          # from one of our branches or tags", and `--contains` on a
          # truncated graph answers that wrong in the direction that
          # rejects legitimate refs. The script refuses to run on a
          # shallow clone rather than guess.
          fetch-depth: 0

      - name: Fetch every branch and tag
        # Explicit rather than inferred from fetch-depth, for the same
        # reason release-backmerge.yml fetches its two tips by hand:
        # checkout leaves us on ONE ref, and this check can only see
        # what is in the object store. The input's own description
        # advertises a tag as valid, so a missing refs/tags would reject
        # `v1.6.0` as "not ours" — failing closed, but confusingly, at
        # the moment somebody is trying to test a release tag.
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin

      # The ref reaches the shell through env, never expanded into the
      # script text (#737). Worth naming what makes this instance
      # different from the other four: THIS IS THE GUARD JOB. `${{ }}`
      # is substituted before bash parses the line, so the one job whose
      # entire purpose is to refuse an untrusted ref could be subverted
      # through the very input it validates — and it runs FIRST, so
      # everything gated behind it inherits the outcome. A guard that
      # can be walked through by its own argument is a different class
      # of finding from an ordinary injection site, and this comment
      # exists so that is not re-discovered from scratch.
      - name: Reject a dispatch ref that is not ours
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: bash scripts/check-dispatch-ref.sh "${INPUT_REF}"

  # Decide ONCE whether this event needs the suites at all: docs-only PR
  # diffs (#311) and post-merge pushes whose tree already passed (#312)
  # exit in seconds instead of holding a privileged pool slot for ~20
  # minutes.
  #
  # Its own job rather than a step in each suite (#375): suite jobs
  # evaluating the same gate independently could disagree — the #312
  # dedupe looks at past runs of this workflow, and the first suite to
  # finish changes what the second one would see.
  #
  # Deliberately not a workflow-level paths filter: `integration` is a
  # required check, and a workflow that never triggers leaves PRs stuck
  # on "Expected". The script fails open (any API error → run); its
  # meta-test runs in test.yaml's gate-script step.
  #
  # ubuntu-latest, not the dhcp-ci pool: this is an API call and a
  # git rev-parse, and it must not consume a privileged runner slot.
  gate:
    needs: dispatch-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      # No `ref:` — this job runs scripts/integration-run-gate.sh, and
      # it must run OUR copy of it (#593). Checking out `inputs.ref`
      # here executed an attacker-chosen script with the default
      # branch's Actions cache scope, which is the open CodeQL
      # `actions/cache-poisoning/poisonable-step` alert: four setup-go
      # call sites across codeql.yml and test.yaml restore that cache on
      # the default branch.
      #
      # Nothing is lost by dropping it. The gate decides repo policy,
      # not PR content: on a dispatch its answer is the hardcoded "run"
      # (#419), and on push/pull_request the input is blank, so this
      # checkout is the event's own tree either way — which is exactly
      # what the push-mode tree comparison needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Suite-needed gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              decision=$(bash scripts/integration-run-gate.sh pr "${{ github.event.pull_request.number }}") || decision=run
              ;;
            workflow_dispatch)
              # Never skippable. A dispatch is a request for fresh
              # evidence about a tree that has not changed, so the
              # duplicate-tree skip would answer the wrong question —
              # and answer it green in thirteen seconds (#419).
              decision=$(bash scripts/integration-run-gate.sh dispatch) || decision=run
              ;;
            *)
              decision=$(bash scripts/integration-run-gate.sh push "$(git rev-parse 'HEAD^{tree}')") || decision=run
              ;;
          esac
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          echo "gate decision: ${decision}"

  # Build the plugin ONCE per run and publish it (#396, D41).
  #
  # Every suite job used to run `make plugin` itself, and the note beside
  # that step said the duplication "costs aggregate CPU, not wall clock".
  # That was true of the wall clock of the BUILD; it was not true of the
  # budget. MEASURED 2026-09-06 in run 34064155841: 82-90s per job, six
  # jobs, six byte-identical images. Against a five-minute gate that is
  # a third of the budget spent six times over on one artifact.
  #
  # ubuntu-latest, not the dhcp-ci pool, for two reasons and the second
  # is the load-bearing one:
  #
  #   - it costs no privileged runner slot, and the run already asks for
  #     eleven of them;
  #   - it is FASTER. MEASURED: the same `make plugin` plus install took
  #     35s on ubuntu-latest (run 34105560953, integration-hosted.yml's
  #     build step) against 82-90s on the pool. The pool's runners are
  #     ephemeral containers with their own nested Docker daemon, so
  #     every build there is cold no matter how often it runs; the
  #     hosted image's advantage is the CPU underneath it.
  #
  # It does NOT enable the plugin — enabling needs the netns and mount
  # privileges the suite jobs have and this one does not, and there is
  # nothing here for it to serve. It builds the directory `docker plugin
  # create` consumes and hands it on.
  #
  # THE COMMIT IS DERIVED HERE AND ONLY HERE (O-4). It is threaded into
  # the binary through the Dockerfile's build-arg -> ldflags and exported
  # as this job's output, so every consumer reads one derivation. A suite
  # job that re-derived it from its own checkout would be comparing a
  # derivation with itself, and the looser of the two would decide.
  build:
    needs: gate
    if: needs.gate.outputs.decision == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    env:
      # Same shape and same reason as the suite job's copy below: a
      # step-level `if:` cannot read the `secrets` context directly.
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on every event except workflow_dispatch, where
          # checkout falls back to the triggering ref (#419). Validated
          # by dispatch-ref, which gate depends on and this job descends
          # from (#593).
          ref: ${{ inputs.ref }}

      # The two Hub base images are pulled ONCE per run now instead of
      # once per suite job, which is the other half of #562 the login
      # step could only mitigate.
      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Note that Docker Hub pulls are anonymous
        if: env.HAS_HUB_CREDS != 'true'
        run: |
          echo "::warning title=Anonymous Docker Hub pulls::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not available to this job, so base-image pulls share the per-address anonymous quota and may hit a 429 (#562). Expected on pull requests from forks, which are never given secrets. On an internal branch it means the secrets are missing or expired."

      - name: Build the plugin the suite jobs will install
        id: build
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          make PLUGIN_NAME=ghcr.io/claymore666/docker-net-dhcp PLUGIN_TAG=integration COMMIT="${COMMIT}" plugin
          # TAR FIRST, then upload. actions/upload-artifact does not
          # preserve file modes, and a plugin rootfs that arrives with
          # its executables unexecutable fails at `docker plugin enable`
          # with an error about the entrypoint rather than about the
          # transport that broke it.
          #
          # --numeric-owner --owner=0 --group=0: this job runs as an
          # unprivileged user, so `docker export | tar x` gave every file
          # that user's ownership, while the suite jobs run as root. The
          # archive is normalised here so the bytes the suite jobs
          # install do not depend on which kind of runner built them.
          tar --numeric-owner --owner=0 --group=0 -czf integration-plugin.tar.gz -C plugin .
          ls -l integration-plugin.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-plugin
          path: integration-plugin.tar.gz
          # One day: this exists to travel between jobs of one run, and
          # a copy that outlives the run is a copy somebody can install
          # by hand believing it is current.
          retention-days: 1
          # An upload that found nothing must not report success: the
          # suite jobs would then fail on the download with a message
          # about a missing artifact rather than about the build that
          # produced none.
          if-no-files-found: error

  # Queue watchdog (#392). Runs alongside the suites on a hosted runner,
  # so it is never queued behind the shortage it exists to report.
  #
  # timeout-minutes does not apply to a job no runner has picked up, so
  # a pool shortage otherwise shows as a run that looks busy forever:
  # the required `integration` context sits on Expected, the PR blocks,
  # and the selfhosted-privileged concurrency group stays held. That
  # happened on 2026-07-31 and was caught only by somebody looking.
  #
  # Deliberately NOT part of the `integration` aggregator's needs: this
  # reports on a run that is failing to progress, and gating the
  # aggregator on it would make the aggregator wait for the very thing
  # that is stuck.
  #
  # That independence is also why the watchdog had no say in whether a
  # PR could merge — it is not a required context, and the required
  # aggregator does not read it. Since #477 it does not need one: it
  # CANCELS the stuck run, and the cancellation reaches the aggregator
  # through the suite rollup it already reads. The verdict travels by
  # changing the run's state rather than by being asked for.
  #
  # Making `watchdog` a required context instead would not work: it is
  # conditional on the gate's decision, so on a gate-skipped PR it never
  # reports at all. The one always-present aggregator stays the single
  # name branch protection knows.
  watchdog:
    needs: gate
    if: needs.gate.outputs.decision == 'run'
    runs-on: ubuntu-latest
    # actions:write is what lets the watchdog CANCEL the run it condemns
    # rather than only reporting it (#477). Reporting alone left the run
    # holding the selfhosted-privileged concurrency group for hours after
    # the check went red. Job-scoped rather than raised at the top level:
    # this is the only job that needs to write, and the top-level block
    # stays read-only for the other five (Scorecard #160).
    permissions:
      contents: read
      actions: write
    # Comfortably longer than the stuck budget below, so the watchdog
    # gets to report rather than being killed mid-verdict.
    timeout-minutes: 20
    steps:
      # No `ref:`, same reason as the gate (#593): this job runs
      # scripts/ci-queue-watchdog.sh, which reports on the RUN — how
      # long its jobs have been unassigned and why — and has no
      # interest in the tree under test. Nothing it reads comes from
      # the dispatched ref, so there is no reason to materialize it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # It also classifies WHY nothing picked the job up and says so in
      # an annotation, a step summary and the `starved` output (#513) —
      # a capacity red and a suite failure looked identical in the
      # checks UI, and the third concurrent run's red was routinely read
      # as a broken dependency bump. `actions: write` above already
      # covers the read of other in-flight runs the classifier needs.
      - name: Fail if a suite job never gets a runner
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
        # 10 minutes, and the budget is a QUEUE budget: it bounds how
        # long a job may sit with no runner, not how long one may run.
        # The floor it has to clear is therefore one suite generation —
        # a job queued behind a full pool waits for a running suite to
        # release its runner. MEASURED 2026-09-06 in run 34064155841, the
        # last run before D41: the longest suite job was 568s (9m28). D41
        # takes that under 300s, so the floor this budget has to clear
        # HALVES.
        #
        # Deliberately NOT tightened alongside D41's shorter suites, and
        # the reason is the same one #877 gave. Firing this watchdog
        # CANCELS the run, and D41 also takes the per-run privileged job
        # ci-pool: integration-pool-jobs=11 ci-pool: pool-runners=16
        # count from six to eleven against a pool of 16 — so where two
        # runs used to fit, one does, and the SECOND run's jobs now
        # genuinely queue rather than starting immediately. Tightening a
        # destructive timeout at the moment the demand on the pool rises
        # is how a capacity wobble becomes a cancelled run. 600s against
        # a ~300s suite generation leaves a full generation of headroom;
        # retune it against a measured pool, not against this change.
        run: bash scripts/ci-queue-watchdog.sh "${{ github.run_id }}" 600 30

  # The suites. Identical except for the make target and log name, so a
  # matrix rather than near-duplicate job bodies — the previous single
  # job had already drifted into per-step `if:` conditions repeated six
  # times. Eleven entries today: nine main shards plus two failure shards
  # (#877, D41).
  #
  # fail-fast: false is deliberate and is a BEHAVIOUR CHANGE. In the old
  # sequential form a failing main suite skipped the failure suite
  # entirely (ordinary step semantics), so a change breaking both looked
  # like a change breaking one. Both runners are already allocated and
  # the gate's wall clock is max() either way, so letting both finish
  # costs no PR time and says whether one suite broke or two.
  suite:
    needs: [gate, build]
    if: needs.gate.outputs.decision == 'run'
    name: ${{ matrix.suite }}-suite
    runs-on: [self-hosted, dhcp-ci]
    # 25 per suite, unchanged. MEASURED 2026-09-06 in run 34064155841:
    # the longest main shard ran 568s (9m28) and the failure suite 382s
    # (6m22), both inclusive of ~120s of build, install, compile and
    # teardown; D41's partition takes the predicted longest job under
    # 300s. This timeout exists to bound a HANG, not to police a slow
    # run, so it is deliberately left at several times the job:
    # shortening it would convert a slow runner into a red check, which
    # is not what it is for.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # THE SHARD COUNTS (#381, three in #468, five in #877, nine
        # plus two in D41).
        #
        # RE-DERIVED 2026-09-08 (D41). The #877 reasoning that stopped at
        # five was correct against the corpus it measured — 70 tests at
        # 879.2s, with the failure suite unsharded at 126.2s of test time
        # — and that corpus no longer exists. The suite is now 95 tests
        # at 2028.4s, and the failure suite alone carries 272.3s of it.
        # The old table is not reproduced here on purpose; it described a
        # tree that is gone, and a stale derivation left in place is read
        # as a current one.
        #
        # THE MEASUREMENT. Per-test medians over the three consecutive
        # successful runs of the tree this branch starts from —
        # 34059724566, 34060966627, 34064155841 — in
        # test/integration/testdata/suite-durations.tsv, whose header
        # carries the method and names its population (top-level test
        # functions, parents only; a subtest's seconds are inside its
        # parent's figure). Every one of the 95 rows is measured; the
        # edition this replaces carried four inferred rows and fourteen
        # recovered from the 1.9.0 corpus.
        #
        #   main suite      1739.87s over 91 tests, longest single test
        #                   TestDHCPv6_NoAddressModes_StartTheEndpoint
        #                   at 80.63s
        #   failure suite    272.31s over 4 tests, longest single test
        #                   TestFailure_LeaseExpiry at 154.61s
        #
        # THE BUDGET (D41). Everything on the way into this branch
        # finishes well under five minutes, measured from the suite jobs'
        # first start to the aggregate's verdict. The aggregate costs 8s
        # (MEASURED, 34064155841: last suite ended 22:39:18, aggregate
        # answered 22:39:25), so the budget for one suite job is ~290s,
        # of which the job spends a FIXED cost before and after its
        # tests. MEASURED at the base: 13s of job setup, checkout,
        # verification and post-steps; 82-90s of `make plugin`; 28s of
        # `go test` compilation plus the harness package. The build term
        # is what D41 removes from every suite job — it happens once, in
        # `build` — and an artifact download and a plugin install replace
        # it.
        #
        # PACKED with the same greedy longest-first packer
        # scripts/integration-shard.sh uses, per suite, over those
        # medians:
        #
        #   main    OF=5   349.9s   (what shipped before D41)
        #           OF=7   250.3s
        #           OF=8   219.9s
        #           OF=9   196.3s   <-
        #           OF=10  177.9s
        #           OF=12  146.8s
        #   failure OF=1   272.3s   (what shipped before D41)
        #           OF=2   154.6s   <-
        #           OF=3   154.6s   (no better: one test is the floor)
        #
        # Nine and two. Nine is where the main suite's longest shard
        # first lands far enough under the budget that the fixed cost and
        # an ephemeral pool's job-to-job variance both fit inside it.
        # Two is the failure suite's own floor and nothing past it helps:
        # TestFailure_LeaseExpiry is 154.61s of a real 20s Kea lease
        # lapsing and then the library's real REBOOTING/backoff, and
        # shortening either of those is the one thing this work is not
        # allowed to do.
        #
        # WHAT ELEVEN JOBS COST. A whole privileged runner slot each,
        # ci-pool: pool-runners=16 -- and ci-pool: integration-pool-jobs=11
        # against a pool of 16 (dhcp-ci-1..16, MEASURED 2026-09-08 from
        # the runners API). One run now fits where two did. Past nine
        # each extra main shard buys ~20s for a whole slot, and at OF=12
        # the failure suite's 154.6s floor becomes the critical path and
        # further main shards buy nothing at all. That is the ceiling
        # this partition is up against, and it is a property of one test,
        # not of the count.
        include:
          - suite: main-1
            target: integration-test-shard SHARD=1 OF=9 SUITE=main
          - suite: main-2
            target: integration-test-shard SHARD=2 OF=9 SUITE=main
          - suite: main-3
            target: integration-test-shard SHARD=3 OF=9 SUITE=main
          - suite: main-4
            target: integration-test-shard SHARD=4 OF=9 SUITE=main
          - suite: main-5
            target: integration-test-shard SHARD=5 OF=9 SUITE=main
          - suite: main-6
            target: integration-test-shard SHARD=6 OF=9 SUITE=main
          - suite: main-7
            target: integration-test-shard SHARD=7 OF=9 SUITE=main
          - suite: main-8
            target: integration-test-shard SHARD=8 OF=9 SUITE=main
          - suite: main-9
            target: integration-test-shard SHARD=9 OF=9 SUITE=main
          - suite: failure-1
            target: integration-test-shard SHARD=1 OF=2 SUITE=failure
          - suite: failure-2
            target: integration-test-shard SHARD=2 OF=2 SUITE=failure
    env:
      INTEGRATION_PLUGIN_REF: ghcr.io/claymore666/docker-net-dhcp:integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on every event except workflow_dispatch, where
          # checkout falls back to the triggering ref (#419).
          ref: ${{ inputs.ref }}

      # The Docker Hub login moved to the `build` job with the build
      # itself (#562, D41). These jobs no longer pull a base image: the
      # only thing they install is the artifact `build` published, and
      # `docker plugin create` reads it off local disk. The credential is
      # therefore not in this job at all any more, which is a smaller
      # exposure than the note at the top of this file describes and not
      # a larger one.

      # The Go toolchain (go.mod's version) is baked into the dhcp-ci
      # runner image, so actions/setup-go is skipped. Fail loudly if
      # it's ever missing — that means the runner image drifted from
      # go.mod and needs a rebuild (ci/runner-image/).
      - name: Verify Go toolchain
        run: |
          if ! command -v go >/dev/null; then
            echo "go not in PATH — dhcp-ci runner image is stale vs go.mod; rebuild ci/runner-image/"
            exit 1
          fi
          go version

      # The same staleness check for the fixtures' own dependencies.
      #
      # Publishing a new runner image does NOT put it on the runners:
      # the orchestrator and the runner host are separate machines, and
      # a host that already has a `:latest` will keep using it until
      # something pulls. So "the Dockerfile installs it" and "the
      # runners have it" are different claims, and only the second one
      # matters here.
      #
      # Without this step a stale image surfaces ~2 minutes into the
      # suite as a fixture readiness timeout with the real cause —
      # `exec of "…/kea-dhcp4" failed: No such file or directory` —
      # buried in a captured server log. That cost a full CI round trip
      # on #449. Fail in five seconds and name the fix instead.
      - name: Verify fixture dependencies
        run: |
          missing=""
          for tool in dnsmasq kea-dhcp4 ip iptables; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::dhcp-ci runner image is missing:$missing"
            echo "The integration fixtures need these (see ci/runner-image/Dockerfile)."
            echo "The image is published by the runner-image workflow, but the runner"
            echo "host caches it — pull ghcr.io/claymore666/dhcp-ci-runner:latest there."
            exit 1
          fi
          echo "fixture deps present: dnsmasq $(dnsmasq --version 2>/dev/null | head -1 | awk '{print $3}'), kea $(kea-dhcp4 -v 2>/dev/null)"

      # The replayed request fixtures (#644) are a recording of ONE
      # engine. This is the only host that knows which engine the suite
      # actually talks to, so it is the only place the recording can be
      # checked against reality — everywhere else the comparison would
      # be against an unrelated daemon.
      #
      # Without it the fixtures decay into an assumption that agrees
      # with itself forever, with a green test next to it. That is worse
      # than the hand-built structs they replaced, because it looks like
      # evidence.
      - name: Fixture engine drift
        run: bash scripts/check-fixture-engine-drift.sh

      # Best-effort: clean any orphans from a previous run that
      # panicked mid-setup. Safe to run even on a clean state.
      - name: Cleanup orphans from previous runs
        run: bash test/integration/cleanup-orphans.sh

      # Install the plugin THIS RUN built (D41), tagged `:integration` so
      # it coexists with `:golang` (production) and `:golang-cover`
      # (coverage workflow). It is built from this PR's source tree by
      # the `build` job — replacing the pre-v0.9.0 behaviour of testing
      # against a manually-installed `:golang`, which silently skipped
      # validation for any PR that modified plugin code (new driver-opts,
      # RPC shape changes, etc.), since the production plugin pre-dated
      # the change.
      #
      # The tag is identical in every suite job, which is safe because
      # the dhcp-ci runners are ephemeral and one-job-per-container —
      # each has its own nested Docker daemon, so there is no shared
      # plugin namespace to collide in.
      - name: Download the plugin this run built
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: integration-plugin

      - name: Install the plugin this run built
        shell: bash
        run: |
          set -euo pipefail
          # The checkout carries no plugin/ directory, but a re-run on a
          # runner that somehow did would install the wrong bytes and
          # nothing downstream could tell. Named absolutely so this can
          # only ever remove the one path meant.
          rm -rf "${GITHUB_WORKSPACE}/plugin"
          mkdir -p "${GITHUB_WORKSPACE}/plugin"
          tar -xzf integration-plugin.tar.gz -C "${GITHUB_WORKSPACE}/plugin"
          docker plugin rm -f "${INTEGRATION_PLUGIN_REF}" 2>/dev/null || true
          # STATE_DIR is bind-mounted from the host since #440, and the
          # daemon does NOT create a missing bind source — `plugin enable`
          # fails with "failed to fulfil mount request". Every place that
          # installs the plugin has to make it first.
          mkdir -p /var/lib/net-dhcp
          # `plugin`, not the absolute path: scripts/check-plugin-bind-sources.sh
          # maps this argument to the manifest the Makefile copies into
          # it, and the map is keyed on the build directory's NAME. The
          # job's working directory is the workspace, so the two spell
          # the same place.
          docker plugin create "${INTEGRATION_PLUGIN_REF}" plugin
          # Trace logging is test-only; released images ship
          # config.json's defaults.
          docker plugin set "${INTEGRATION_PLUGIN_REF}" LOG_LEVEL=trace
          docker plugin enable "${INTEGRATION_PLUGIN_REF}"

      # The bytes just installed carry their own module record, and it
      # is the only statement about the DHCP library that no declaration
      # can talk out of the truth (D34). The `library` label, the
      # Makefile and the health cell below all derive from
      # `go list -m`, which reports the REQUIRED version and is blind to
      # a `replace`; this reads what the linker wrote. Run per shard,
      # against the exact binary this shard is about to exercise.
      - name: The library in the installed plugin is the module go.mod pins
        run: bash scripts/check-library-pin.sh --binary "${GITHUB_WORKSPACE}/plugin/rootfs/usr/sbin/net-dhcp"

      # THE PLUGIN NOW RUNNING IS THE COMMIT THIS RUN BUILT (O-4, D41).
      #
      # While every job built its own image, "the plugin under test is
      # this tree" was true by construction. It is not any more: the
      # bytes arrive over a transport, and a stale artifact, a re-run
      # against an old upload, or a `plugin/` left on disk would each
      # produce a green suite that measured a plugin nobody changed.
      # Construction is replaced by a check, and the check runs BEFORE
      # any test, in EVERY shard — the one place the previous
      # arrangement was weakest, since the health cell that reads this
      # value back lives in exactly one shard of nine.
      #
      # The expected value is the build job's OUTPUT, not a second
      # `git rev-parse` here: one fact derived twice gives two answers
      # and the looser one decides.
      #
      # An absent, empty or unreadable answer is as fatal as a wrong
      # one. A check that treats "I could not tell" as a pass is the
      # failure this whole file keeps finding in other shapes.
      - name: The running plugin is the commit this run built
        shell: bash
        env:
          EXPECT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECT_COMMIT}" ]; then
            echo "::error title=The build job published no commit::there is nothing to compare the running plugin against, so this check cannot be made." >&2
            exit 1
          fi
          id="$(docker plugin inspect "${INTEGRATION_PLUGIN_REF}" --format '{{.Id}}')"
          sock="/run/docker/plugins/${id}/net-dhcp.sock"
          for _ in $(seq 1 50); do
            [ -S "${sock}" ] && break
            sleep 0.2
          done
          if [ ! -S "${sock}" ]; then
            echo "::error title=The plugin socket never appeared::${sock} is not a socket 10s after enable." >&2
            exit 1
          fi
          doc="$(curl -sS --max-time 10 --unix-socket "${sock}" -X POST http://plugin/Plugin.Health)"
          got="$(printf '%s' "${doc}" | jq -r '.commit // empty')"
          if [ -z "${got}" ]; then
            echo "::error title=The plugin reports no commit::Plugin.Health carried no commit field, so the installed image cannot be identified." >&2
            printf '%s\n' "${doc}" >&2
            exit 1
          fi
          if [ "${got}" != "${EXPECT_COMMIT}" ]; then
            echo "::error title=The installed plugin is not the commit this run built::the running plugin reports ${got} and this run built ${EXPECT_COMMIT}. The suite would be measuring a different tree." >&2
            exit 1
          fi
          echo "the running plugin reports commit ${got}, which is what this run built"
          # The health cell reads this back too, on both surfaces it is
          # published on (TestHealthDocument_BuildInfoIsWhatTheLaneBuilt).
          # It lives in one shard; this step is in all of them.
          echo "NET_DHCP_EXPECT_COMMIT=${EXPECT_COMMIT}" >> "$GITHUB_ENV"

      # tee the verbose output so the timing-summary step below can
      # report where the wall-clock went. `shell: bash` is LOAD-BEARING:
      # only the explicit form runs `bash -eo pipefail`; the implicit
      # default is `bash -e` WITHOUT pipefail, which let tee's exit 0
      # swallow go-test failures and pass the gate green (#297).
      - name: Run ${{ matrix.suite }} suite
        shell: bash
        run: make ${{ matrix.target }} 2>&1 | tee /tmp/itest-${{ matrix.suite }}.log

      # Surface the slowest tests + phase totals in the job log and step
      # summary, so speedup work can target the biggest waits without
      # digging through verbose output. Informational, always-run: it
      # owns no pass/fail and tolerates a missing log.
      #
      # Per-job now rather than one combined call: each job only has its
      # own suite's log. Both still land in the run's summary page,
      # under their own job headings.
      - name: Test timing summary
        if: always()
        run: scripts/integration-timing.sh /tmp/itest-${{ matrix.suite }}.log

      # Tear down so a follow-up workflow on the same runner doesn't
      # find a stale `:integration` plugin pinned to the previous
      # PR's source. Always-run; failure of the test step shouldn't
      # leave global state behind.
      - name: Tear down integration plugin
        if: always()
        run: |
          docker plugin disable "${INTEGRATION_PLUGIN_REF}" 2>/dev/null || true
          docker plugin rm -f "${INTEGRATION_PLUGIN_REF}" 2>/dev/null || true

  # The required check. Collapses the whole suite matrix into the single
  # context branch protection knows about (see the topology note at the
  # top — this name is load-bearing).
  #
  # ubuntu-latest: it decides, it does not test, and it must not hold a
  # privileged slot while doing so.
  integration:
    needs: [gate, build, suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A skip and a failure must never be conflated (#375). `suite` is
      # a matrix job, so needs.suite.result is already the rollup:
      # success only if every leg succeeded, failure if any failed,
      # skipped only if the whole matrix was skipped.
      - name: Combined suite result
        env:
          GATE: ${{ needs.gate.result }}
          DECISION: ${{ needs.gate.outputs.decision }}
          BUILD: ${{ needs.build.result }}
          SUITES: ${{ needs.suite.result }}
        run: |
          echo "gate job:       $GATE"
          echo "gate decision:  $DECISION"
          echo "build job:      $BUILD"
          echo "suite rollup:   $SUITES"

          if [ "$GATE" != "success" ]; then
            echo "FAIL: the gate job did not succeed, so nothing decided whether the suites were needed."
            exit 1
          fi

          if [ "$DECISION" != "run" ]; then
            if [ "$BUILD" = "skipped" ] && [ "$SUITES" = "skipped" ]; then
              echo "PASS: gate decided the suites were not needed for this event; the build and every suite job were skipped."
              exit 0
            fi
            echo "FAIL: gate said '$DECISION' but the build is '$BUILD' and the suite rollup is '$SUITES' — expected both 'skipped'."
            exit 1
          fi

          # A FAILED BUILD SKIPS THE SUITES, AND A SKIP IS NOT A PASS
          # (D41). `suite` needs `build`, so a red build leaves the
          # matrix skipped — which is the same rollup a gate-skipped
          # event produces. Without this arm the aggregate would take
          # the branch below, see 'skipped', and have to guess which of
          # the two happened. It is judged here, before the rollup, so
          # the verdict names the build rather than the suites it
          # prevented.
          if [ "$BUILD" != "success" ]; then
            echo "FAIL: the gate asked for a run and the build job is '$BUILD' — no suite job could install a plugin, so nothing was tested."
            exit 1
          fi

          case "$SUITES" in
            success)
              echo "PASS: every suite job passed."
              ;;
            skipped)
              # Would mean the suites were skipped while the gate asked
              # for them: a green here would report "tested" for a run
              # that tested nothing.
              echo "FAIL: gate asked for a run but every suite job was skipped."
              exit 1
              ;;
            *)
              echo "FAIL: suite rollup is '$SUITES' — at least one suite failed or was cancelled."
              exit 1
              ;;
          esac
