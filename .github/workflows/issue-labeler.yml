name: Issue labeler

# Rule pass only (#393): the conventional-commit prefix in the title picks
# the label from .github/issue-labeler.yml. A title no rule matches stays
# unlabelled for the maintainer. The model fallback was removed in #748:
# its three steps were skipped in all 65 retained runs (2026-09-30 to
# 2026-10-05). Labels are only ever added; manual labels always win.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rule pass
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
          include-title: 1
          include-body: 0
          sync-labels: 0
          repo-token: ${{ github.token }}
