name: Runner image

# Build + publish the ephemeral CI runner image (ci/runner-image/).
# Runs on the GitHub-hosted pool — this is a plain docker build, none
# of the privileged self-hosted requirements apply. The image is
# consumed by the runner orchestrator, not by workflows in this repo.
on:
  push:
    branches:
      - dev
      - '2.*'
    paths:
      - ci/runner-image/**
      - .github/workflows/runner-image.yml
  workflow_dispatch:
    inputs:
      promote_latest:
        description: >-
          Move the CI pool's :latest to this build. Leave off unless you
          are deliberately repointing every self-hosted runner at this
          branch's image. The :<sha7> and per-arch tags publish either
          way, so a branch image stays testable by digest without this.
        type: boolean
        default: false

# Top-level is read-only; the write scope GHCR push needs is granted
# only on the build job below (least privilege — Scorecard #160).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/claymore666/dhcp-ci-runner

jobs:
  build:
    # Both architectures build NATIVELY. GitHub's arm64 hosted runners are
    # free for public repositories, and the alternative -- qemu -- would land
    # on the one step that hurts most: baking the Go compile cache. Measured
    # elsewhere in this project at roughly 11x under emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin-by-resolution: always build with the current runner agent
      # release. Outdated agents refuse jobs after GitHub's grace
      # window, so "latest at build time" + rebuild-on-dispatch is the
      # right freshness model for an agent we ship inside an image.
      - name: Resolve runner agent version
        id: agent
        run: |
          ver=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name[1:]')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Building with actions/runner v${ver}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          # Read out of a third-party API response one step above, so it
          # is external data and reaches the shell through env (#737).
          RUNNER_VERSION: ${{ steps.agent.outputs.version }}
        run: |
          docker build -f ci/runner-image/Dockerfile \
            --build-arg RUNNER_VERSION="${RUNNER_VERSION}" \
            -t "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}" \
            .

      # Guard against a silently mis-built image: the Dockerfile derives two
      # downloads from TARGETARCH, and an empty TARGETARCH (classic builder)
      # or a wrong one would produce an image that runs but is the wrong
      # architecture. Assert it rather than trust it.
      - name: Assert architecture
        run: |
          got=$(docker run --rm --entrypoint uname "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}" -m)
          case "${{ matrix.arch }}" in
            amd64) want=x86_64 ;;
            arm64) want=aarch64 ;;
          esac
          echo "built=${got} expected=${want}"
          [ "${got}" = "${want}" ] || { echo "architecture mismatch" >&2; exit 1; }

      # The selftest needs --privileged, which GitHub-hosted runners
      # allow for containers started by the job itself. It runs on each
      # architecture natively, so it is a real check on both.
      - name: Selftest
        run: docker run --rm --privileged "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}" selftest

      # Proxy wiring (#181): a bogus proxy is never contacted — selftest
      # does no network pulls — so this hermetically proves setup_proxy
      # writes the docker CLI `proxies` config (the only consumer that
      # doesn't inherit the proxy automatically) and keeps the fixture
      # subnets in NO_PROXY.
      - name: Selftest (proxy mode)
        run: |
          docker run --rm --privileged \
            -e HTTPS_PROXY=http://proxy.invalid:3128 \
            -e NO_PROXY=example.com \
            "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}" selftest

      - name: Push per-arch tag
        run: docker push "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}"

  # The per-arch tags above are what the manifest list points at. Unlike a
  # Docker *plugin* -- where a manifest list is uninstallable and per-arch tags
  # are the only shipping shape (#507) -- this is an ordinary image pulled by
  # `docker run`, so a manifest list is both correct and what the orchestrator
  # wants: one name, right architecture per host.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # This job runs scripts/runner-image-tags.sh, so it needs the repo.
      # It had no checkout before #812 because it only ever shelled out to
      # buildx.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Which tags this publishes is decided by scripts/runner-image-tags.sh,
      # not by an `if:` here — see that file's header (#812). `latest` is
      # emitted last and only when asked for, so a dispatch from a branch
      # cannot repoint the pool as a side effect of dispatching at all.
      - name: Create and push manifest list
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          SHA7="${GITHUB_SHA::7}"
          export SHA7
          # Command substitution, not `mapfile < <(...)`: a process
          # substitution's exit status is not checked, so a failing script
          # would yield an empty tag list and this job would go green
          # having published nothing at all.
          tags_out="$(bash scripts/runner-image-tags.sh)"
          if [ -z "$tags_out" ]; then
            echo "::error title=No tags::runner-image-tags.sh produced nothing." >&2
            exit 1
          fi
          mapfile -t tags <<< "$tags_out"
          printf 'Publishing: %s\n' "${tags[*]}"
          for tag in "${tags[@]}"; do
            docker buildx imagetools create -t "${IMAGE}:${tag}" \
              "${IMAGE}:${SHA7}-amd64" \
              "${IMAGE}:${SHA7}-arm64"
          done
          # Inspect what this run actually published. Inspecting :latest
          # unconditionally would report a tag this run may not have
          # touched, which reads as confirmation and is not one.
          for tag in "${tags[@]}"; do
            echo "== ${IMAGE}:${tag}"
            docker buildx imagetools inspect "${IMAGE}:${tag}"
          done
