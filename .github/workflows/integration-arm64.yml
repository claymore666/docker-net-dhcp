# Native arm64 integration lane (#531).
#
# Runs the same suites as integration.yml, but on the bare-metal arm64
# runner (a netbooted Raspberry Pi 4) instead of the amd64 pool. The Pi
# exists to prove the plugin on a real arm64 kernel — qemu-user cannot
# run dhcpcd at all (#507), so emulation proves nothing here.
#
# Differences from the amd64 lane, all deliberate:
#
#   - One unsharded job instead of the amd64 lane's 11-job matrix (nine
#     main shards plus two failure shards, #877, D41). There is one Pi,
#     so a matrix would run serially at best. It no longer deadlocks — the
#     runner is standing rather than single-use (#632) — but sharding
#     across one machine buys nothing, so this stays unsharded until
#     there is a second arm64 host.
#   - Not a required check. This lane runs at release-candidate time,
#     not per PR — the tag is what spends the arm64 host, not a push.
#   - The runner registers itself at boot and reconnects unattended
#     (`register` mode, #632), so a queued job here means the host is
#     powered off or its boot server is down — not that someone forgot
#     to launch a container, and not a CI outage. Either way it is
#     something a human must fix before the rc can be called green,
#     which is what `lane-present` exists to say out loud.
#
# The rc tag is the human gate of a release; what an rc proves must
# follow from that tag alone. So this fires on `v*-rc*` and nothing
# else: never on a PR, never on a dev push, never on a schedule, and
# never on the real `vX.Y.Z` tag. Dispatch stays for re-running a lane
# against a tag that has already been cut.
#
name: integration-arm64

on:
  push:
    tags:
      # Release candidates only. `v*-rc*` cannot match a bare release
      # tag, so the pool the admins lend us for the rc window is the
      # only thing this ever spends.
      - 'v*-rc*'
  workflow_dispatch:

# One tag push has started this workflow twice (#1007: v2.2.0-rc2, two
# push-event runs one second apart, both publishing to the registries).
# The group is the tag ref, so a second run for the same tag replaces the
# first: the newest run's images, signatures and release page agree with
# each other. A dispatch against a tag joins the same group on purpose.
concurrency:
  group: integration-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Turns "no arm64 runner was online" from a job that quietly waits into
  # a red check. Hosted, so it reports even when the self-hosted side is
  # the thing that is missing; see scripts/check-arm64-lane.sh for why
  # queued-looks-like-running is the failure worth spending a job on.
  lane-present:
    name: arm64-lane-present
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # The gate's own wait is 25 minutes; this is that plus margin, so the
    # job never dies before the gate can speak.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for the arm64 suite to start
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/check-arm64-lane.sh "$RUN_ID" 25

  suite:
    name: arm64-suite
    runs-on: [self-hosted, Linux, ARM64, dhcp-ci-arm64]
    # A bound on a hang, not an estimate of a run. Run 35125808546
    # (2026-09-16, v2.1.1-rc1) took 47m20s end to end on the Pi 4, and
    # the whole 138-test suite projects to 52.5 minutes here (derivation
    # beside the main suite's ceiling below). The two suites hanging to
    # their ceilings is 80 + 20 = 100 minutes, plus 1m53s of setup and 8s
    # of teardown measured on that run: 103 minutes of worst-case wall
    # time, rounded up. 120 holds it with 17 minutes over and is
    # unchanged.
    #
    # check-one-process-itest-budget.sh only asks for ceilings + 1, which
    # is 101 here: it cannot know this lane's setup time and will not
    # guess. Everything above 101 is this lane's measured surround and
    # spare, and nothing checks it.
    timeout-minutes: 120
    env:
      INTEGRATION_PLUGIN_REF: ghcr.io/claymore666/docker-net-dhcp:integration
      # Same shape and reasoning as integration.yml (#562): resolves to
      # the literal "true"/"false" because a step-level `if:` cannot
      # read the secrets context directly.
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticate before anything pulls from Docker Hub (#562). Forks
      # never see secrets, so this skips there — expected, not degraded.
      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Note that Docker Hub pulls are anonymous
        if: env.HAS_HUB_CREDS != 'true'
        run: |
          echo "::warning title=Anonymous Docker Hub pulls::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not available to this job (#562)."

      # The toolchain and fixture deps are baked into the runner image;
      # fail loudly if the image on the Pi drifted (same as amd64).
      - name: Verify Go toolchain
        run: |
          if ! command -v go >/dev/null; then
            echo "go not in PATH — dhcp-ci runner image is stale vs go.mod; rebuild ci/runner-image/ for arm64"
            exit 1
          fi
          go version
          [ "$(uname -m)" = "aarch64" ] || { echo "::error::expected aarch64, got $(uname -m)"; exit 1; }

      - name: Verify fixture dependencies
        run: |
          missing=""
          for tool in dnsmasq kea-dhcp4 ip iptables; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::dhcp-ci runner image is missing:$missing — rebuild ci/runner-image/ for arm64"
            exit 1
          fi

      # The host's own recovery path, checked on the host rather than in
      # the tree that provisions it (#677). The netbooted root is an
      # image: a baseline older than #661 restores an nfs-watchdog that
      # refuses to start on this 15s device, and the board then runs
      # unwatched while every provisioning file still reads correctly.
      # This lane is the only thing that executes on that host, so it is
      # the only place the live state can be asserted at all.
      #
      # Not fatal on exit 2. The arming verdict comes from sysfs and is
      # never lost; 2 means only that the kernel ring buffer has aged
      # past this boot, so the daemon's identity could not be confirmed —
      # a consequence of uptime, not a defect, and not worth reddening a
      # release candidate. It is annotated so it cannot pass unseen.
      - name: Verify the host's NFS-outage watchdog
        run: |
          set +e
          bash scripts/check-host-watchdog.sh
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=Host watchdog only partly verified::The board is armed and being petted, but the kernel ring buffer no longer reaches this boot, so nfs-watchdog could not be confirmed as the holder (#677)."
            exit 0
          fi
          exit "$rc"

      - name: Cleanup orphans from previous runs
        run: bash test/integration/cleanup-orphans.sh

      - name: Build + install integration plugin
        run: |
          make PLUGIN_NAME=ghcr.io/claymore666/docker-net-dhcp PLUGIN_TAG=integration plugin
          docker plugin rm -f "${INTEGRATION_PLUGIN_REF}" 2>/dev/null || true
          # The daemon does not create a missing bind source (#440).
          mkdir -p /var/lib/net-dhcp
          docker plugin create "${INTEGRATION_PLUGIN_REF}" plugin
          docker plugin set "${INTEGRATION_PLUGIN_REF}" LOG_LEVEL=trace
          docker plugin enable "${INTEGRATION_PLUGIN_REF}"

      # shell: bash is LOAD-BEARING for pipefail, exactly as in
      # integration.yml (#297).
      # ITEST_TIMEOUT, not the Makefile's 20m default. THIS LANE RUNS THE
      # WHOLE MAIN SUITE IN ONE go test BINARY, as coverage.yml and
      # integration-hosted.yml do; the amd64 lane splits the same suite
      # across nine shards, so the 20m ceiling that leaves every shard
      # idle is the whole budget here. At v2.0.0-rc2 it fired: run
      # 34368481103 panicked with "test timed out after 20m0s" having
      # completed 56 of the 93 main tests. The 45m that replaced it then
      # died the same way on the coverage lane on 2026-09-17: run
      # 35182131651 panicked at 45m0s with 111 of 138 main tests done.
      #
      # DERIVED FROM FOUR RUNS, not from the durations table. The table is
      # a shard-balancing artefact with inferred rows in it -- the
      # coverage lane ran its 111 at 0.8919 of their table time -- so it
      # is used below for two tests only.
      #
      #   this lane, run 35125808546 (v2.1.1-rc1): 116 main tests,
      #     2262.91s, 37m59s of step wall -- 84.4 percent of 45m
      #   coverage, run 35182131651: 111 tests, 2649.76s
      #   coverage, run 35114134537: 116 tests, 2283.63s
      #   hosted, run 35141207596: 119 tests, 2332.56s
      #
      # Lane-to-lane factors on the tests two lanes both ran: this board
      # runs at 0.9698 of the coverage lane over the 91 they share, and
      # the hosted lane at 0.9948 of this board over 116. The 22 tests
      # this lane has never run are filled from the coverage lane through
      # 0.9698 where it ran them (20 of the 22, 731.62s there against
      # 1072.58s in the table), and from the table through 0.8919 for the
      # two tests no lane has ever completed. The whole 138-test main
      # suite projects to 3152.4s here, 52.5 minutes. That is the sum of
      # the per-test timers. The binary charges more than they do: on run
      # 35125808546 the step wall reads 2279s against 2262.91s summed, so
      # 16.1s of fixture and package setup sits outside them. Carried in
      # the headroom below, not in the projection.
      #
      # 80 / 52.5 = 1.52x of headroom over this lane's own projection,
      # 27.5 minutes of slack. coverage.yml is the binding lane at 54.2
      # minutes, where the same 80m is 1.48x. The slack is sized on
      # growth: rc1 passed the old 20m with 0.3 percent of margin and rc2
      # was the next commit, and 45m was at 84.4 percent here while the
      # suite went from 116 tests to 138 in one release.
      #
      # It fits the job. Measured on run 35125808546: 1m53s before this
      # step, 7m20s for the failure suite after it, 8s for the rest.
      # Both suites hanging to their ceilings is 80 + 20 + 3 = 103
      # minutes, inside timeout-minutes: 120 above.
      #
      # The failure suite keeps the 20m default: it measured 7m20s here.
      - name: Run main suite
        shell: bash
        env:
          ITEST_TIMEOUT: 80m
        run: make integration-test 2>&1 | tee /tmp/itest-arm64-main.log

      # if: always() for the same reason as integration-hosted.yml (#742):
      # a red main suite must not take the failure suite with it. On this
      # lane it also keeps the timing summary below honest, which reads
      # both logs and would otherwise report on a file that was never
      # written.
      - name: Run failure suite
        if: always()
        shell: bash
        run: make integration-test-failure 2>&1 | tee /tmp/itest-arm64-failure.log

      - name: Test timing summary
        if: always()
        run: |
          scripts/integration-timing.sh /tmp/itest-arm64-main.log
          scripts/integration-timing.sh /tmp/itest-arm64-failure.log

      # THE ONLY STANDING RUNNER WAS THE ONLY LANE WITH NO TEARDOWN
      # (#742). Every other lane runs on an ephemeral one-job runner,
      # where leaving `:integration` enabled costs nothing because the
      # machine is discarded. This board is a standing registration, so
      # the plugin stayed enabled between release candidates and
      # /var/lib/net-dhcp — bind-mounted precisely so it SURVIVES
      # `plugin rm` (#440) — accumulated across every run the board has
      # ever done.
      #
      # The `docker plugin rm -f` earlier in the build step is a
      # PRE-install cleanup, not a teardown: it runs before the plugin
      # this job installs exists. Same block as integration.yml:560-564,
      # for the same reason and with more force behind it here.
      - name: Tear down integration plugin
        if: always()
        run: |
          docker plugin disable "${INTEGRATION_PLUGIN_REF}" 2>/dev/null || true
          docker plugin rm -f "${INTEGRATION_PLUGIN_REF}" 2>/dev/null || true
