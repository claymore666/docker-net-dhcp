name: APK pin drift

# Weekly check that every apk version pin in the Dockerfile (today:
# iproute2) is still the newest version the pinned Alpine base's index
# offers. A newer version fails the run, which is the notification: the
# pin is bumped by hand after a build and an integration run.
#
# Runs on a Sunday-morning UTC schedule, plus on-demand via the
# Actions tab.
#
# --strict IS WHAT MAKES THIS A SIGNAL AT ALL (#742). Without it the
# script prints its report and exits 0, and GitHub sends no notification
# for a SUCCESSFUL scheduled run — so the drift report landed in a run
# log nobody had any reason to open. Seventeen of seventeen runs green,
# each 12-20s, while the script's own header claimed the signal "lands
# on the maintainer's desk without anyone having to remember to look".
# It required exactly that: remembering to look.
#
# A red weekly run stays red until the pin is bumped, which is the
# intended behaviour and not noise. This workflow gates nothing and is
# not a required context, so a standing red here blocks no PR; it only
# ensures the drift is visible without a ritual.

on:
  schedule:
    - cron: '7 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check apk pins
        run: bash scripts/check-apk-pins.sh --strict
