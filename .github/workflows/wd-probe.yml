name: Watchdog probe (temporary)

# TEMPORARY. Delete before this PR merges.
#
# #477's load-bearing claim is that cancelling a stuck run turns the
# REQUIRED `integration` context red, so the watchdog's verdict reaches
# branch protection without becoming a required context itself. That
# claim rests on `if: always()` semantics for a cancelled run, which is
# exactly the kind of thing that is easy to reason confidently and
# wrongly about.
#
# So it is measured instead. This reproduces the shape of
# integration.yml — a job no runner can take, a watchdog, and an
# always() aggregator — on hosted runners only, so it costs the
# self-hosted pool nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Stands in for `suite`. The label does not exist, so nothing will
  # ever pick this up — the same state a pool outage produces, without
  # needing a pool outage.
  stuck:
    runs-on: [self-hosted, dhcp-ci-no-such-label]
    steps:
      - run: echo "unreachable"

  # Stands in for `watchdog`, with the real script and a short budget.
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if a job never gets a runner
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
        run: bash scripts/ci-queue-watchdog.sh "${{ github.run_id }}" 60 15

  # Stands in for `integration`, the required context. The question this
  # whole probe exists to answer: does this job run at all once the run
  # is cancelled, and what does it conclude?
  aggregate:
    needs: [stuck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the rollup
        env:
          STUCK: ${{ needs.stuck.result }}
        run: |
          echo "stuck rollup: $STUCK"
          case "$STUCK" in
            success) echo "PASS" ;;
            *) echo "FAIL: rollup is '$STUCK'"; exit 1 ;;
          esac
