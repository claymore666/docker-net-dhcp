name: Issue state labels

# Make an issue with merged work in `dev` distinguishable from an
# untouched one (#482). Both read as plain OPEN today, and the milestone
# counts them the same, because GitHub only builds its "Development"
# link for PRs targeting the *default* branch — and every PR here
# targets `dev`.
#
# scripts/sync-issue-state-labels.sh carries the reasoning and the
# reference-parsing rules. This file is only about when it runs and with
# what permissions.
#
# RECONCILER, NOT A TRANSITION HANDLER. Every run recomputes the desired
# state of every open issue and adds *and removes* to match. That is why
# a missed event costs nothing, why the backfill needs no separate
# tooling, and why cancelling a run mid-apply is harmless.
#
# Security, because this is a public repository:
#
#   - `pull_request_target` is used WITHOUT a PR checkout. Nothing
#     authored in a pull request is fetched, built, or executed; the
#     checkout is the base branch, which is what that trigger already
#     gives us. The PR-derived inputs are the title and the BODY, and
#     the script reduces both to digits that must already match an open
#     issue number.
#
#     The body was added by #548 and is the more attacker-controlled of
#     the two only in length, not in kind: it is never executed, never
#     checked out, and never written anywhere. It is matched for closing
#     keywords and issue numbers and discarded. A body is arbitrary
#     multi-line text, which is why it travels as JSON rather than in
#     any hand-rolled delimited form — framing arbitrary input by hand
#     is a parser bug waiting to happen.
#   - The worst an attacker can do is cause an issue to gain or lose one
#     of two state labels. No other label is touched, no content is
#     written, and the token cannot do more (issues: write only).

on:
  push:
    branches: [dev]
  pull_request_target:
    types: [opened, reopened, edited, closed]
  # Backstop. Events are the fast path, but a reconciler that also runs
  # on a clock cannot be left permanently wrong by a missed webhook, an
  # API blip, or a run cancelled at the wrong moment.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

# ONE GROUP PER PR, NOT ONE FOR THE REPOSITORY (#600).
#
# A cancelled job renders as a FAILED check on the PR that triggered it.
# Under a single repo-wide group, any two PR events close together made
# one PR cancel another's run: three Dependabot PRs opened within five
# minutes on 2026-08-17 left #594 sitting on a red `sync` it had nothing
# to do with. Nothing had failed — every step succeeded except `Sync`,
# which was cancelled — and a re-run passed in 8 seconds.
#
# That red is not cosmetic. Nothing here merges on a red check, required
# or not, so a check that goes red for structural reasons unrelated to
# the PR teaches people to wave reds through, and the one eventually
# waved through will be real.
#
# Keying the group by PR number keeps the ONE cancellation that is
# wanted — a new push to a PR superseding that same PR's in-flight run,
# which is why cancel-in-progress stays true — while making it
# impossible for one PR to cancel another's. push and schedule runs fall
# back to github.ref, so they get their own keys and do not collide with
# any PR.
#
# Queueing instead was the obvious alternative and does not actually
# work: GitHub keeps only one PENDING run per group, so with one run in
# progress and one pending, a third event cancels the pending one. A
# burst of three — exactly the shape that caused this — would still go
# red.
#
# WHAT THIS TRADES. Runs for different PRs can now overlap, so two can
# interleave label writes on the same issue. That is safe for the reason
# the header already gives: every run recomputes the desired state of
# every open issue and adds and removes to match, so two concurrent runs
# are computing the same answer and converge on it. A disagreement
# requires an issue to change between their reads, and the next run —
# event-driven or the hourly cron — corrects it. This is the same
# property that makes a cancelled run harmless to the labels.
concurrency:
  group: issue-state-labels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # Forks have neither the issues nor a writable token; running there
    # would fail every scheduled tick on a fork with nothing to fix.
    if: github.repository == 'claymore666/docker-net-dhcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned, and NOT redundant (#490). Without a ref, the script
          # that runs is whichever branch the trigger points at: dev on a
          # push, `main` on a schedule (cron only ever runs from the
          # default branch), and the base branch on pull_request_target
          # — `main` for a release PR. Every run is a full reconciler
          # that also REMOVES labels, so two triggers running two
          # versions of the parser undo each other on a loop for the
          # whole window between a change merging to dev and shipping.
          #
          # The labels describe "merged into dev, not yet on main", so
          # dev is the branch whose script should describe it.
          #
          # Safe under pull_request_target: `dev` is protected and
          # maintainer-only, the same trust the `push: [dev]` trigger
          # already grants this workflow with issues: write. Nothing
          # authored in a pull request is checked out either way.
          ref: dev
          fetch-depth: 0

      # fetch-depth: 0 gets the full history of the checked-out ref only.
      # The script needs both branch tips to ask what is in dev and not
      # yet on main, and it fails loudly rather than treating a missing
      # ref as "nothing merged" — which would strip in-dev off every
      # issue at once.
      - name: Fetch both branch tips
        run: git fetch --no-tags origin main dev

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sync-issue-state-labels.sh
