name: Release

# Build and publish the plugin image on a vX.Y.Z tag push. Pushes to
# GHCR (always — built-in token) and Docker Hub (when the credentials
# secrets are configured). Dual-pushing keeps every release reachable
# from both registries; the README points operators at GHCR but Docker
# Hub is where most plugin discovery still happens.
#
# Trigger shapes:
#   - `git tag v0.8.0 && git push --tags` → automatic
#   - `git tag v1.0.0-rc1 && git push --tags` → automatic, pre-release
#     mode: the full chain runs, including the promote-latest job, but
#     it aims at `:latest-rc` / `:latest-rc-arm64` — so `:latest` is NOT
#     moved and the dry-run still exercises every step (#736). This is
#     the zero-impact end-to-end rehearsal to do before every real tag.
#   - GitHub UI → "Run workflow" → enter tag → manual re-run of an
#     existing tag (NOTE: a bare vX.Y.Z here rebuilds and re-points
#     that tag AND `:latest` — prefer the rc-tag dry-run)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   - DOCKERHUB_USERNAME — Docker Hub login (e.g. `claymore666`)
#   - DOCKERHUB_TOKEN    — Docker Hub access token (NOT password)
# If absent, the Hub step skips with a warning instead of failing.
#
# Maintainer post-release checklist (this workflow does not handle it):
#   1. Fast-forward dev to main so the release commit lands on dev too:
#        git checkout dev && git merge --ff-only main && git push origin dev
#      Otherwise the next feature branched from dev starts at the
#      previous version's README/docs and the next release PR has to
#      re-bump them. Forgotten once after v0.9.0.
#   2. Verify GHCR (and Docker Hub, if configured) shows the new tag.
#   3. If a production host runs the plugin, plan the upgrade as a
#      separate change — this workflow only publishes the image.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.8.0). Must already exist on the remote."
        required: true

# Top-level token is read-only; write scopes are granted per-job below
# (Scorecard Token-Permissions: a workflow-wide write scope leaks into
# every job, including ones that only need to pull).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write       # GHCR push + image-signature/attestation upload
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # actions/attest-build-provenance attestations

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest_tag: ${{ steps.tag.outputs.latest_tag }}
      latest_arm_tag: ${{ steps.tag.outputs.latest_arm_tag }}
      # Whether the Hub push STEP RAN, recorded by the step itself.
      # verify-install needs to know whether there is a Hub image to
      # install, and re-evaluating the secrets expression there would
      # answer a different question -- "are credentials present now",
      # not "was anything published". A skipped step contributes no
      # output, so this is empty rather than 'true' precisely when
      # nothing was pushed.
      hub_pushed: ${{ steps.hub-push.outputs.pushed }}

    env:
      # GHCR is always pushed. Hub repo only pushed when secrets are set.
      # Hub uses the shorter `net-dhcp` name (matching upstream's
      # convention there); GHCR keeps `docker-net-dhcp` to align with
      # the existing tag history.
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
      HUB_NAME: claymore666/net-dhcp
      # Materialize the Docker Hub secrets-presence check at job level
      # so steps can gate on env (allowed) rather than on the secrets
      # context directly (rejected at parse time inside step-level
      # `if:` expressions). Resolves to the literal string "true" or
      # "false" — compare with `== 'true'` downstream.
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      # OUR copy of the resolver, checked out before the tag the input
      # names. The workflow's own ref is the trusted one; validating a
      # dispatch input with code from the tree that input chose would be
      # no validation at all (#593, #738).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ITS OWN PATH, and that is load-bearing. actions/checkout does
          # NOT clear the sparse config a previous checkout left in the
          # workspace, so a second checkout at the same path — one that
          # passes no `sparse-checkout` of its own — inherits it and
          # populates exactly this one file. That shipped: dev @ 9245f09
          # deployed docs from a tree containing a single shell script
          # and died on a `docs/requirements.txt` that was present in
          # git the whole time.
          #
          # A separate path makes the two trees separate things, which
          # is what the comment above already says they are. The main
          # checkout cleans `.resolver` away on its way in; by then the
          # resolver has already done its work.
          path: .resolver
          sparse-checkout: scripts/resolve-dispatch-ref.sh
          sparse-checkout-cone-mode: false

      # The dispatch input reaches the shell as DATA, through env, and is
      # never expanded into the script text (#737). `${{ }}` is
      # substituted before bash parses the line, so a value carrying a
      # quote and a semicolon becomes commands — and this job is the
      # worst place in the tree for that: it holds packages: write,
      # id-token: write (keyless Sigstore — code running here can sign an
      # arbitrary artifact as this repository's OIDC identity),
      # attestations: write, and both registry tokens. Validating the
      # value on the next line does not help when the shell has already
      # parsed it. The same treatment the tree already applies in
      # coverage-presence.yml, pages.yml, release-backmerge.yml and
      # throughout test.yaml.
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          # One shape rule, in one place. resolve-dispatch-ref.sh emits
          # `refs/tags/vX.Y.Z[-rcN]` or refuses, so the checkouts below
          # take a fully qualified ref and an arbitrary SHA is not
          # rejected here, it is unexpressible (#738).
          #
          # The old pattern was unanchored — no `$` — so `v1.2.3junk`
          # and `v1.2.3.4` passed it, then failed the bare-version test
          # below and were silently classified as pre-releases:
          # `:latest` untouched, a DRAFT GitHub Release, and a run that
          # looks like it succeeded. A typo'd release tag became a
          # release nobody could see. It now stops here.
          REF="$(bash .resolver/scripts/resolve-dispatch-ref.sh "$TAG")"
          # The resolver also accepts `dev`, which the docs site
          # publishes and a release must never build from.
          case "$REF" in
            refs/tags/*) ;;
            *) echo "::error::'$TAG' resolved to '$REF'; a release must be a tag." >&2
               exit 1 ;;
          esac
          # Pre-release guard: a suffixed tag (vX.Y.Z-rc1 etc.) runs the
          # full publishing chain — build, dual-registry push of the rc
          # tag, description sync, verify-install — but must NOT move
          # `:latest` or overwrite any bare release tag. This makes rc
          # tags a zero-impact end-to-end dry-run of this workflow
          # before the real vX.Y.Z tag (see docs/release-runbook.md).
          #
          # An rc does not SKIP the promotion — it aims it somewhere
          # harmless. Skipping made the promote path the one part of
          # this workflow an rc could not exercise, so the ordering
          # fixed in #736 would have first executed on a real tag.
          # Pointing it at `latest-rc` runs the identical steps, in the
          # identical job, against tags no install command names.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
            LATEST=latest
            LATEST_ARM=latest-arm64
            echo "Releasing tag: $TAG"
          else
            PRERELEASE=true
            LATEST=latest-rc
            LATEST_ARM=latest-rc-arm64
            echo "Pre-release tag: $TAG — promoting :latest-rc, :latest is not moved"
          fi
          {
            echo "tag=$TAG"
            echo "ref=$REF"
            echo "prerelease=$PRERELEASE"
            echo "latest_tag=$LATEST"
            echo "latest_arm_tag=$LATEST_ARM"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          # Full history so RELEASE_NOTES.md credits / "since vX" greps
          # behave the same as on a developer checkout.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: hub-login
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Absent Hub credentials mean different things in different
      # repositories: a documented skip on a fork, a broken release on
      # this one. The decision lives in a script so that BOTH branches
      # can be driven -- the failing one fires only on a repository we
      # cannot impersonate, so an inline `if:` here would ship a
      # conditional that has never taken its failing path (#638 class).
      - name: Both registries, or say why not
        env:
          REPO: ${{ github.repository }}
        run: bash scripts/check-release-registries.sh

      # Push to GHCR. `make push` chains create → push, so the plugin
      # is built fresh and published with the resolved tag. The Make
      # default PLUGIN_NAME already points at GHCR — passing it
      # explicitly here keeps the workflow self-documenting.
      #
      # This job publishes the VERSION TAG ONLY. The floating tag is
      # moved by the `promote-latest` job, after this build is signed,
      # attested and proven installable (#736) — see the comment there.
      #
      # `:latest` is published by RETAGGING the version tag's pushed
      # manifest, not by a second build (#267). A separate `make push`
      # re-ran `docker plugin create`, which re-tars the rootfs
      # non-reproducibly — so the old `:latest` got its own digest,
      # distinct from `:vX.Y.Z` AND uncovered by the cosign signature
      # (cosign signs by digest). `crane tag` points the floating tag at
      # the exact manifest `:vX.Y.Z` already has, so the two share one
      # digest and the single signature made below covers both — which
      # is why promotion can happen after signing without needing a
      # second signature.
      - name: Push to GHCR
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: make PLUGIN_NAME="${GHCR_NAME}" PLUGIN_TAG="${TAG}" push

      # The reference digests in docs/verifying-releases.md must describe
      # the binaries this tag actually publishes (#502).
      #
      # Placed here deliberately: `make push` above has just built
      # plugin/, so this is the earliest point the binaries exist. Since
      # #736 every failure in this job is ahead of the floating tag, not
      # just this one — a failure leaves a published `:vX.Y.Z` with
      # `:latest` untouched, recoverable by fixing the doc and re-running,
      # with nothing user-visible pointing at a release that was never
      # announced.
      #
      # It fails the release rather than warning, and it fails on an rc
      # too. That is the point: the rc dry-run is where a documentation
      # error should stop the train, not the real tag. An rc compares
      # against its base version (v1.6.0-rc1 -> v1.6.0) because it builds
      # from the same source and therefore carries the same digests.
      #
      # The digests can only be known after a tag builds, so the first rc
      # of a new version is EXPECTED to fail here and print the block to
      # paste into the doc. That is runbook step 10b becoming enforced
      # rather than remembered.
      - name: Check the documented reference digests against this build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash scripts/check-reference-digests.sh \
            "${TAG}" \
            plugin/rootfs/usr/sbin/net-dhcp \
            plugin/rootfs/usr/lib/net-dhcp/dhcp-handler

      # Same plugin to Docker Hub when credentials are present. Make
      # rebuilds the rootfs with the Hub-prefixed name; the underlying
      # Docker image layer cache is reused so this is cheap.
      - name: Push to Docker Hub
        id: hub-push
        if: env.HAS_HUB_CREDS == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          make PLUGIN_NAME="${HUB_NAME}" PLUGIN_TAG="${TAG}" push
          # Written AFTER the push, so it records a push that happened
          # rather than a step that started.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Refresh the Docker Hub long description from the repo's README
      # so the Hub page never drifts from what's on GitHub. Short
      # description is owned here too — change it in this file when you
      # want it to change. Idempotent: the action diffs and only PATCHes
      # when content changed. Skipped if Hub credentials aren't set.
      #
      # Auth note: DOCKERHUB_TOKEN must be a Personal Access Token with
      # Read & Write scope on this repo (not just Read & Write image
      # push) — Docker Hub gates description-update behind admin scope.
      # If this step 401s/403s, regenerate the token; image-push tokens
      # alone won't do.
      #
      # continue-on-error: the long description is auxiliary metadata —
      # the published plugin (both registries) is what users pull, and
      # the runbook already treats the whole Hub path as optional
      # (GHCR alone still publishes). A description-sync auth failure
      # (e.g. a rotated / under-scoped token) must NOT fail the release
      # job or block verify-install. v1.0.0-rc1 caught exactly this:
      # Hub 403 on PATCH.
      #
      # WHAT THAT COSTS — stated here because this comment claimed the
      # opposite until 2026-08-22, when it said the failure "surfaces
      # as a red step to fix out-of-band":
      #
      # NOTHING REPORTS IT. The step goes red inside a job that stays
      # GREEN, and that is the entire signal. It carries no `id:`, so
      # no later step can read `steps.<id>.outcome` to mention it even
      # if one wanted to; the job's `$GITHUB_STEP_SUMMARY` — the
      # channel people actually read — never hears about it; and this
      # is the only `continue-on-error` in the whole workflow tree, so
      # there is no convention elsewhere to lean on either.
      #
      # The description therefore stays stale until somebody opens this
      # job's log and scrolls to a green run. It does re-sync on the
      # next release, but only because the step runs again — not
      # because anyone was told to restore the token.
      # docs/release-runbook.md carries the out-of-band fix: dispatch
      # an rc tag, which re-runs this step against the same Hub
      # repository without touching a bare release tag or `:latest`.
      - name: Sync Docker Hub description from README
        if: env.HAS_HUB_CREDS == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.HUB_NAME }}
          short-description: "DHCP-leased IPs for Docker containers (bridge/macvlan/ipvlan). Fork of devplayer0/docker-net-dhcp."
          readme-filepath: ./README.md

      # Sign a release artifact and hand it to the github-release job.
      # Scorecard's Signed-Releases check inspects artifacts attached to
      # the GitHub Release — signing the registry images alone does not
      # satisfy it (#163). `make push` above already built plugin/
      # (rootfs + config.json), the exact tree `docker plugin create`
      # consumed, so packaging that reconstructs the published plugin.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The installer's major is not cosign's: cosign-installer v4 ships
      # cosign v3, and nothing in the pin says so. Docs telling users which
      # cosign to verify with are therefore documentation about a version
      # nobody asserts — which is how v1.5.0 shipped a bundle that the
      # documented command could not read on v2 (#522).
      #
      # Record what actually signed this release, and hard-fail if the
      # installer starts shipping a major the docs do not describe. Better
      # here, before anything is signed, than in a user's terminal with an
      # error that implicates the artifact.
      - name: Record and gate the cosign version
        run: |
          set -euo pipefail
          want=$(sed -n 's/^COSIGN_MAJOR=\([0-9][0-9]*\).*/\1/p' \
                   scripts/check-release-tooling.sh | head -1)
          got=$(cosign version 2>/dev/null \
                  | sed -n 's/.*GitVersion:[[:space:]]*v\{0,1\}\([0-9][0-9.]*\).*/\1/p' \
                  | head -1)
          echo "cosign ${got:-unknown} (docs and preflight expect major ${want})"
          {
            echo "### Signing toolchain"
            echo
            echo "- cosign \`${got:-unknown}\` — expected major \`${want}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$got" ]; then
            echo "::error::could not read the cosign version" >&2
            exit 1
          fi
          if [ "${got%%.*}" != "$want" ]; then
            echo "::error::cosign major ${got%%.*} installed, but the docs and" \
                 "scripts/check-release-tooling.sh describe major ${want}." \
                 "Update both before releasing — see #522." >&2
            exit 1
          fi

      # Sign the published plugin images by digest (#173). docker plugins
      # are OCI artifacts, so cosign signs them like any image once we
      # resolve the registry manifest digest — `docker buildx imagetools
      # inspect` reads it despite the plugin media type. The floating tag
      # is retagged onto this same manifest later, in `promote-latest`
      # (#267, #736), so the two share one digest and this one signature
      # per registry covers both. The GHCR digest is exported for the
      # provenance step below.
      - name: Sign published images (cosign keyless)
        id: signimg
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          GHCR_DIGEST=$(docker buildx imagetools inspect "${GHCR_NAME}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "ghcr_digest=${GHCR_DIGEST}" >> "$GITHUB_OUTPUT"
          cosign sign --yes "${GHCR_NAME}@${GHCR_DIGEST}"
          echo "Signed ${GHCR_NAME}@${GHCR_DIGEST}"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            HUB_DIGEST=$(docker buildx imagetools inspect "${HUB_NAME}:${TAG}" --format '{{.Manifest.Digest}}')
            cosign sign --yes "${HUB_NAME}@${HUB_DIGEST}"
            echo "Signed ${HUB_NAME}@${HUB_DIGEST}"
          fi

      # SBOM over the plugin rootfs make already built (#174). syft emits
      # SPDX and CycloneDX in one pass; both are attached to the release
      # and folded into the signed checksum manifest below.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          set -euo pipefail
          syft scan dir:plugin/rootfs \
            -o "spdx-json=sbom.spdx.json" \
            -o "cyclonedx-json=sbom.cdx.json"
          ls -l sbom.spdx.json sbom.cdx.json

      - name: Package and sign release artifact
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ART="net-dhcp-plugin-${TAG}-linux-amd64.tar.gz"
          tar -czf "$ART" -C plugin .
          # Manifest covers the tarball AND the SBOMs, so the single
          # keyless signature below attests all release assets at once.
          sha256sum "$ART" sbom.spdx.json sbom.cdx.json > checksums.txt
          # Keyless (Fulcio/OIDC) signature over the checksum manifest,
          # emitted as a Sigstore bundle (cosign v3 default; the v2
          # --output-signature/--output-certificate pair was removed —
          # the bundle carries signature + short-lived cert in one public
          # file, verified against the Actions OIDC issuer).
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            "checksums.txt"
          echo "Signed release artifacts:"
          cat checksums.txt

      # SLSA build provenance (#173): GitHub-native attestations that bind
      # each artifact to this workflow + commit, verifiable with
      # `gh attestation verify`. One call for the file artifacts (by path)
      # and one for the published GHCR image (by digest, pushed to the
      # registry alongside the image).
      - name: Attest release-artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            net-dhcp-plugin-*.tar.gz
            sbom.spdx.json
            sbom.cdx.json

      # GHCR ONLY, AND NOBODY RECORDED WHY. cosign signs both registries
      # a few lines above; this attests one. The asymmetry has been here
      # since the step was added (823608b, #173/#174) -- that commit
      # message states "the GHCR image (by digest, pushed to the
      # registry)" as a description, never as a decision, and no issue
      # or comment gives a reason. So this is not documented-deliberate;
      # it is undocumented, which is how an asymmetry in a supply-chain
      # control gets "tidied up" later in whichever direction the tidier
      # guesses.
      #
      # The plausible reason is `push-to-registry: true`: the attestation
      # is stored as an OCI referrer, and Docker Hub's referrers support
      # is weaker than GHCR's. Plausible is not measured.
      #
      # WHAT WOULD SETTLE IT: add the same step for HUB_NAME, gated on
      # HAS_HUB_CREDS, and run one rc. Either it pushes -- and the
      # asymmetry was accidental and should go -- or it fails on the
      # referrer push, and that failure is the reason, recorded here
      # where the next reader is standing. Until one of those has
      # happened, users pulling from Hub have a cosign signature and no
      # provenance attestation, and that is a real difference between
      # the two registries rather than a cosmetic one.
      - name: Attest image provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ steps.signimg.outputs.ghcr_digest }}
          push-to-registry: true

      - name: Upload signed artifacts for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: |
            net-dhcp-plugin-*.tar.gz
            sbom.spdx.json
            sbom.cdx.json
            checksums.txt
            checksums.txt.sigstore.json
          retention-days: 7
          if-no-files-found: error

      # Convenience: print the install incantations operators will use,
      # straight into the workflow summary so the release page links
      # them prominently.
      - name: Workflow summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LATEST: ${{ steps.tag.outputs.latest_tag }}
        run: |
          {
            echo "## Published ${TAG}"
            echo
            echo "Version tag only. \`${LATEST}\` is moved by"
            echo "the \`promote-latest\` job, after verify-install (#736)."
            echo
            echo "### Install from GHCR"
            echo '```'
            echo "docker plugin install ${GHCR_NAME}:${TAG}"
            echo '```'
            if [ "${HAS_HUB_CREDS}" = "true" ]; then
              echo "### Install from Docker Hub"
              echo '```'
              echo "docker plugin install ${HUB_NAME}:${TAG}"
              echo '```'
            else
              echo "_Docker Hub push skipped — set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets to enable._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The arm64 build of the same tag (#507). A SEPARATE per-arch tag
  # (`vX.Y.Z-arm64`, `latest-arm64`), not a manifest list: `docker plugin
  # install` cannot resolve manifest lists at all — measured, not
  # assumed — so per-arch tags are the only shipping shape for plugins.
  # Bare tags stay amd64; nothing changes for existing users.
  #
  # Built NATIVELY on GitHub's arm64 hosted runners (free for public
  # repositories). The same `make push` as amd64: the Makefile's build
  # is arch-agnostic and follows the host, so no qemu and no cross
  # toolchain — emulation is also pointless here, since the plugin
  # cannot even run under qemu-user (#507 discussion, dhcpcd/netlink).
  #
  # needs: release — deliberate ordering, not parallelism lost. The
  # amd64 job owns everything arch-independent (release notes, Hub
  # description, cosign-docs gate, checksum manifest naming), and a
  # broken amd64 release should stop the train before any arm64 tag is
  # published pointing at a half-released version.
  release-arm64:
    needs: release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      # Same reasoning as the release job's hub_pushed: the arm64 Hub
      # image is what verify-install-arm64 would pull, and only the step
      # that pushed it can say whether it exists.
      hub_pushed: ${{ steps.hub-push-arm.outputs.pushed }}
    permissions:
      contents: read
      packages: write       # GHCR push + image-signature upload
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # actions/attest-build-provenance attestations

    env:
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
      HUB_NAME: claymore666/net-dhcp
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      TAG: ${{ needs.release.outputs.tag }}
      ARM_TAG: ${{ needs.release.outputs.tag }}-arm64

    steps:
      # The Dockerfile derives nothing from TARGETARCH here — the build
      # follows the host daemon — so a mis-scheduled job (label typo,
      # runner-pool surprise) would silently publish an amd64 binary
      # under the arm64 tag. Assert the host before building anything.
      - name: Assert architecture
        run: |
          [ "$(uname -m)" = "aarch64" ] || { echo "::error::expected aarch64, got $(uname -m)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to GHCR
        run: make PLUGIN_NAME="${GHCR_NAME}" PLUGIN_TAG="${ARM_TAG}" push

      # Belt to the assert's braces: the binary that was actually packed
      # into the rootfs must be arm64. `go version -m` is not available
      # for a stripped file; readelf reads the header regardless.
      - name: Assert published binary architecture
        run: |
          m=$(readelf -h plugin/rootfs/usr/sbin/net-dhcp | awk -F: '/Machine/{gsub(/^[ \t]+/,"",$2); print $2}')
          echo "net-dhcp machine: $m"
          case "$m" in *AArch64*) ;; *) echo "::error::rootfs binary is not arm64: $m"; exit 1;; esac

      # Same gate as amd64, against the arm64-labelled digest block in
      # docs/verifying-releases.md (#502). Same expected-fail flow: the
      # first rc of a new version prints the block to paste.
      - name: Check the documented reference digests against this build
        run: |
          bash scripts/check-reference-digests.sh \
            "${TAG}" \
            plugin/rootfs/usr/sbin/net-dhcp \
            plugin/rootfs/usr/lib/net-dhcp/dhcp-handler \
            arm64

      - name: Push to Docker Hub
        id: hub-push-arm
        if: env.HAS_HUB_CREDS == 'true'
        run: |
          make PLUGIN_NAME="${HUB_NAME}" PLUGIN_TAG="${ARM_TAG}" push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images (cosign keyless)
        id: signimg
        run: |
          set -euo pipefail
          GHCR_DIGEST=$(docker buildx imagetools inspect "${GHCR_NAME}:${ARM_TAG}" --format '{{.Manifest.Digest}}')
          echo "ghcr_digest=${GHCR_DIGEST}" >> "$GITHUB_OUTPUT"
          cosign sign --yes "${GHCR_NAME}@${GHCR_DIGEST}"
          echo "Signed ${GHCR_NAME}@${GHCR_DIGEST}"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            HUB_DIGEST=$(docker buildx imagetools inspect "${HUB_NAME}:${ARM_TAG}" --format '{{.Manifest.Digest}}')
            cosign sign --yes "${HUB_NAME}@${HUB_DIGEST}"
            echo "Signed ${HUB_NAME}@${HUB_DIGEST}"
          fi

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Arch-suffixed filenames throughout: these land on the SAME
      # GitHub Release as the amd64 set, and `sbom.spdx.json` twice on
      # one page is a coin toss for the reader.
      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          set -euo pipefail
          syft scan dir:plugin/rootfs \
            -o "spdx-json=sbom-arm64.spdx.json" \
            -o "cyclonedx-json=sbom-arm64.cdx.json"
          ls -l sbom-arm64.spdx.json sbom-arm64.cdx.json

      - name: Package and sign release artifact
        run: |
          set -euo pipefail
          ART="net-dhcp-plugin-${TAG}-linux-arm64.tar.gz"
          tar -czf "$ART" -C plugin .
          sha256sum "$ART" sbom-arm64.spdx.json sbom-arm64.cdx.json > checksums-arm64.txt
          cosign sign-blob --yes \
            --bundle checksums-arm64.txt.sigstore.json \
            "checksums-arm64.txt"
          echo "Signed release artifacts:"
          cat checksums-arm64.txt

      - name: Attest release-artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            net-dhcp-plugin-*-linux-arm64.tar.gz
            sbom-arm64.spdx.json
            sbom-arm64.cdx.json

      # Same GHCR-only asymmetry as the amd64 job, same absent reason --
      # see the note there. Recorded in both places on purpose: a
      # comment on one of two identical steps is a comment somebody
      # deletes as a duplicate.
      - name: Attest image provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ steps.signimg.outputs.ghcr_digest }}
          push-to-registry: true

      - name: Upload signed artifacts for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-arm64
          path: |
            net-dhcp-plugin-*-linux-arm64.tar.gz
            sbom-arm64.spdx.json
            sbom-arm64.cdx.json
            checksums-arm64.txt
            checksums-arm64.txt.sigstore.json
          retention-days: 7
          if-no-files-found: error

  # Post-publish verification: install the artifact users will actually
  # pull, from a clean GitHub-hosted runner. "We pushed bytes" is not
  # "the deliverable works" — a plugin that 500s on install or fails to
  # enable must turn the release run red, not surface in a user issue
  # (#127). Exercised before each real release by the runbook's
  # workflow_dispatch dry-run against the previous tag.
  verify-install:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GHCR needs a token to pull; the Docker Hub repository is public
      # and needs no GitHub permission at all. The Hub login below is
      # for rate limits, not access.
      packages: read   # pulls the just-published plugin from GHCR
    env:
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install released plugin from GHCR
        run: |
          REF="${GHCR_NAME}:${TAG}"
          # The published plugin bind-mounts STATE_DIR, and the daemon
          # does not create a missing bind source (#440). verify-install
          # must do exactly what the docs tell an operator to do.
          sudo mkdir -p /var/lib/net-dhcp
          # Nothing else gets an mkdir here. This runner is the only
          # machine that installs onto a daemon which has never created a
          # network sandbox, and that is the whole value of the job: it
          # is how v1.6.0-rc2 caught a bind source the daemon creates
          # lazily (#588), which every developer box and the integration
          # runner had long since created by running a container.
          # Creating a missing path here would turn the one host that can
          # see that class of bug into another host that cannot, and ship
          # it to users instead. Fix the manifest.
          docker plugin install --grant-all-permissions "$REF"
          docker plugin ls

      - name: Assert plugin is enabled
        run: |
          REF="${GHCR_NAME}:${TAG}"
          ENABLED="$(docker plugin inspect -f '{{.Enabled}}' "$REF")"
          if [ "$ENABLED" != "true" ]; then
            echo "Plugin installed but not enabled (Enabled=$ENABLED)"
            docker plugin inspect "$REF"
            exit 1
          fi
          echo "Plugin ${REF} installs and enables cleanly." >> "$GITHUB_STEP_SUMMARY"

  # The same post-publish proof for the arm64 tag, on an arm64 host.
  # Install mechanics only — enable proves the binary starts. Functional
  # proof on real hardware is the rc-time integration-arm64 run (#531);
  # a hosted VM cannot replace it, but it can catch a 500 on install.
  verify-install-arm64:
    needs: [release, release-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
      TAG: ${{ needs.release.outputs.tag }}-arm64
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install released arm64 plugin from GHCR
        run: |
          REF="${GHCR_NAME}:${TAG}"
          # Same rule as verify-install: nothing but the documented
          # STATE_DIR mkdir. This host's value is that it has never run
          # a container (#588).
          sudo mkdir -p /var/lib/net-dhcp
          docker plugin install --grant-all-permissions "$REF"
          docker plugin ls

      - name: Assert plugin is enabled
        run: |
          REF="${GHCR_NAME}:${TAG}"
          ENABLED="$(docker plugin inspect -f '{{.Enabled}}' "$REF")"
          if [ "$ENABLED" != "true" ]; then
            echo "Plugin installed but not enabled (Enabled=$ENABLED)"
            docker plugin inspect "$REF"
            exit 1
          fi
          echo "Plugin ${REF} installs and enables cleanly." >> "$GITHUB_STEP_SUMMARY"

  # Docker Hub is the other half of the same deliverable, and until #776
  # only one of the two was install-tested. #507 shipped manifest lists
  # that were uninstallable — a defect every push step reports success
  # on — so proving one of the two places users install from left the
  # other covered by nothing at all.
  #
  # ITS OWN JOB, ON ITS OWN RUNNER, AND THAT IS THE POINT. The first
  # shape of this check was a second install appended to verify-install.
  # It would have run on a daemon that had already installed and enabled
  # a plugin, after this workflow's own `sudo mkdir -p /var/lib/net-dhcp`
  # — so the property the install jobs exist for, a daemon that has never
  # created a network sandbox (#588, caught at v1.6.0-rc2), was already
  # spent before the Hub install started. `docker plugin disable && rm`
  # does not give it back: it removes the plugin's state, not the host
  # directory and not whatever else the daemon created lazily. The Hub
  # install would then have covered the #507 class only, under a comment
  # claiming the #588 rule — a comment a reader would believe. A second
  # hosted runner costs nothing scarce here (both verify jobs are
  # GitHub-hosted; the self-hosted pool is untouched) and buys back the
  # clean-daemon property for the Hub half as well.
  #
  # It also makes a Hub failure name Hub, instead of arriving after a
  # GHCR teardown in a job whose title says GHCR.
  #
  # NO JOB-LEVEL `if`. The gate is on the steps, so that the "not
  # verified" record below still runs and still lands in the summary.
  # A skipped job writes nothing at all, which would restore exactly the
  # invisibility this pair of jobs exists to remove: a GHCR-only run
  # would once again be indistinguishable from a both-registries one.
  verify-install-hub:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # No `packages: read`: nothing here touches GHCR. The Hub
      # repository is public and needs no GitHub permission at all — the
      # login below is for rate limits, not access.
    env:
      HUB_NAME: claymore666/net-dhcp
      TAG: ${{ needs.release.outputs.tag }}
      HUB_PUSHED: ${{ needs.release.outputs.hub_pushed }}
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # The image is public, so this needs no credentials to PULL. The
      # login only spends the authenticated rate limit instead of the
      # anonymous one, and is skipped when there are no credentials.
      - name: Log in to Docker Hub
        if: env.HUB_PUSHED == 'true' && env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install released plugin from Docker Hub
        if: env.HUB_PUSHED == 'true'
        run: |
          set -euo pipefail
          REF="${HUB_NAME}:${TAG}"
          # The documented operator step, and nothing else. Same rule as
          # verify-install: this runner has never created a network
          # sandbox, and creating any other missing path here would turn
          # the one host that can see that class of bug into another host
          # that cannot. Fix the manifest.
          sudo mkdir -p /var/lib/net-dhcp
          docker plugin install --grant-all-permissions "$REF"
          docker plugin ls

      - name: Assert plugin is enabled
        if: env.HUB_PUSHED == 'true'
        run: |
          set -euo pipefail
          REF="${HUB_NAME}:${TAG}"
          ENABLED="$(docker plugin inspect -f '{{.Enabled}}' "$REF")"
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Plugin installed from Docker Hub but not enabled (Enabled=$ENABLED)"
            docker plugin inspect "$REF"
            exit 1
          fi
          echo "Plugin ${REF} installs and enables cleanly." >> "$GITHUB_STEP_SUMMARY"

      # A skip that says so, for the reason given above the job.
      - name: Record that Docker Hub was not verified
        if: env.HUB_PUSHED != 'true'
        run: |
          echo "::warning::Docker Hub install NOT verified: no Hub image was published by this run."
          echo "⚠️ Docker Hub install **not verified** — nothing was pushed there by this run." >> "$GITHUB_STEP_SUMMARY"

  # The Hub half for arm64, on an arm64 host. Same reasoning as
  # verify-install-hub throughout, including why it is its own job.
  verify-install-hub-arm64:
    needs: [release, release-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUB_NAME: claymore666/net-dhcp
      TAG: ${{ needs.release.outputs.tag }}-arm64
      # From release-arm64, not from release: the arm64 Hub image is a
      # separate push and a separate tag, and the amd64 job's answer says
      # nothing about whether this one exists.
      #
      # INDEX SYNTAX, NOT A DOT — because it is unambiguous under every
      # reading, and costs nothing. It is the first hyphenated `needs.`
      # dereference this file would have; here is what is actually known
      # about the alternative, and what is not:
      #
      #   MEASURED: actionlint (v1.7.12) passes BOTH forms, and its check
      #   is live rather than absent — given `needs: [release]` and a
      #   reference to `needs.release-nosuchjob.outputs.x` it reports
      #   `property "release-nosuchjob" is not defined`, naming the whole
      #   hyphenated token as ONE property. So it does not distinguish
      #   the two forms, and a green from it settles nothing here.
      #
      #   MEASURED, adjacent context: a hyphenated dereference RESOLVES
      #   on GitHub in the `inputs.` context. A workflow_dispatch of
      #   missing-runs.yml with grace-minutes=7 ran
      #   `${{ inputs.grace-minutes || '20' }}` and the script echoed a
      #   7m grace, not the 20m default.
      #
      #   NOT MEASURED: the `needs.` context on GitHub. Settling it would
      #   mean landing a two-job workflow on the default branch purely to
      #   ask, and nobody has. Do not assume it matches `inputs.` and do
      #   not assume it differs.
      #
      # The bracket form is therefore not a workaround for a known
      # defect. It is the form that is correct whichever way the
      # unmeasured question turns out.
      HUB_PUSHED: ${{ needs['release-arm64'].outputs.hub_pushed }}
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Log in to Docker Hub
        if: env.HUB_PUSHED == 'true' && env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install released arm64 plugin from Docker Hub
        if: env.HUB_PUSHED == 'true'
        run: |
          set -euo pipefail
          REF="${HUB_NAME}:${TAG}"
          sudo mkdir -p /var/lib/net-dhcp
          docker plugin install --grant-all-permissions "$REF"
          docker plugin ls

      - name: Assert plugin is enabled
        if: env.HUB_PUSHED == 'true'
        run: |
          set -euo pipefail
          REF="${HUB_NAME}:${TAG}"
          ENABLED="$(docker plugin inspect -f '{{.Enabled}}' "$REF")"
          if [ "$ENABLED" != "true" ]; then
            echo "::error::arm64 plugin installed from Docker Hub but not enabled (Enabled=$ENABLED)"
            docker plugin inspect "$REF"
            exit 1
          fi
          echo "Plugin ${REF} installs and enables cleanly." >> "$GITHUB_STEP_SUMMARY"

      - name: Record that Docker Hub was not verified
        if: env.HUB_PUSHED != 'true'
        run: |
          echo "::warning::Docker Hub arm64 install NOT verified: no Hub image was published by this run."
          echo "⚠️ Docker Hub arm64 install **not verified** — nothing was pushed there by this run." >> "$GITHUB_STEP_SUMMARY"

  # Move the floating tag — LAST, and only onto bytes that are signed,
  # attested, and proven to install (#736).
  #
  # ORDER IS THE WHOLE POINT. Until this job existed, `crane tag latest`
  # ran inside `release`, over a hundred lines ahead of `cosign sign` and
  # a whole job ahead of verify-install. Every failure in between left
  # `:latest` publicly resolving to an image that was unsigned,
  # unattested, or never proven installable. That is not hypothetical:
  # the v1.7.0-rc2 run failed in release-arm64 after `make push` had
  # already published, and on a bare tag that same failure ships exactly
  # that state to users.
  #
  # It matters more here than the usual "publish last" hygiene, because
  # this workflow has no rollback. Re-dispatching a bare `vX.Y.Z`
  # rebuilds the plugin, and `docker plugin create` re-tars the rootfs
  # non-reproducibly, so the rebuilt tag necessarily carries a NEW digest
  # and orphans the signature and attestation of the first one. A bad
  # promotion therefore cannot be undone, only overwritten with something
  # equally new. Ordering is the fix; a recovery step is not available.
  #
  # AN RC EXERCISES THIS JOB. `latest_tag` resolves to `latest-rc` on a
  # suffixed tag instead of the job being skipped, so the rc dry-run runs
  # the same job, the same steps, and the same digest assertion against a
  # tag no documented install command names. The old
  # `if: prerelease != 'true'` skip made promotion the one part of this
  # workflow an rc could not reach — which meant a change to the promote
  # ordering would first execute on a real tag, with no rollback behind
  # it. The rc-immutability assertion below proves `:latest` itself is
  # still untouched, and proves it from the registry rather than from
  # this file.
  #
  # Both arches promote here. They were separate before only because the
  # retag sat in whichever job had just pushed; nothing about `crane tag`
  # needs an arm64 host.
  # KEEP THIS `needs:` ON ONE LINE. scripts/check-latest-promotion.sh reads
  # a job's dependency list from the single line the key sits on, so a
  # wrapped flow sequence makes it under-read and report that promotion is
  # not behind gates it IS behind. That is a confusing red, not a silent
  # green -- which is why this is a comment and not a change to the
  # checker -- but the red names the wrong problem and costs an evening.
  promote-latest:
    needs: [release, release-arm64, verify-install, verify-install-arm64, verify-install-hub, verify-install-hub-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write   # retagging in GHCR is a registry write

    env:
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
      HUB_NAME: claymore666/net-dhcp
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      TAG: ${{ needs.release.outputs.tag }}
      ARM_TAG: ${{ needs.release.outputs.tag }}-arm64
      LATEST: ${{ needs.release.outputs.latest_tag }}
      LATEST_ARM: ${{ needs.release.outputs.latest_arm_tag }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}

    steps:
      # Checked out for go.mod — the toolchain version is pinned by the
      # released tree rather than by a literal in this file — and for
      # the tag list the recency guard below needs.
      #
      # fetch-depth: 0 is load-bearing, not tidiness. The default fetch
      # brings one commit and NO tags, and a guard that cannot see the
      # newer tag would report that none exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          fetch-depth: 0

      # Refuse before anything is touched. `crane tag ...:$TAG $LATEST`
      # has no idea what the floating tag already points at, so
      # `gh workflow run release.yml -f tag=v1.6.0` would move `:latest`
      # BACK to v1.6.0 on both registries — and this workflow has no
      # rollback, because rebuilding the plugin re-tars the rootfs
      # non-reproducibly and orphans the previous signature.
      #
      # That dispatch was not a hypothetical: until 2026-08-22
      # docs/release-runbook.md OFFERED it as the recovery procedure for
      # a failed release, in the same file that forbids moving
      # `:latest` backwards. This is the executable end of that
      # postmortem. The runbook has since been changed to send that
      # reader to an rc dry-run instead; the sentence is dated rather
      # than deleted because the history is the justification, and the
      # dispatch box still accepts any tag.
      #
      # It REFUSES rather than skips. A skip during an incident is not
      # noticed, and an incident is exactly when this fires.
      - name: Refuse to promote a floating tag backwards
        run: bash scripts/assert-newest-release-tag.sh "${TAG}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # crane retags onto the version manifest's EXACT digest (#267) —
      # `docker buildx imagetools create` re-wraps a plugin manifest in a
      # new index and changes the digest; crane preserves it, which is
      # what lets the version tag's signature cover the floating tag.
      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Read `:latest` BEFORE touching anything, so the pre-release
      # assertion at the end of this job compares registry state against
      # registry state rather than against an assumption about which
      # steps ran. `absent` is recorded explicitly: a repository with no
      # `:latest` yet must assert "still absent", not silently compare
      # two empty strings.
      - name: Record what :latest resolves to before promotion
        id: before
        run: |
          set -uo pipefail
          g=$(crane digest "${GHCR_NAME}:latest" 2>/dev/null) || g="absent"
          echo "ghcr=${g}" >> "$GITHUB_OUTPUT"
          echo "GHCR :latest before = ${g}"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            h=$(crane digest "${HUB_NAME}:latest" 2>/dev/null) || h="absent"
            echo "hub=${h}" >> "$GITHUB_OUTPUT"
            echo "Hub  :latest before = ${h}"
          fi

      - name: Promote the GHCR floating tags
        run: |
          set -euo pipefail
          crane tag "${GHCR_NAME}:${TAG}" "${LATEST}"
          crane tag "${GHCR_NAME}:${ARM_TAG}" "${LATEST_ARM}"
          echo "GHCR ${LATEST} -> ${TAG}, ${LATEST_ARM} -> ${ARM_TAG}"

      - name: Promote the Docker Hub floating tags
        if: env.HAS_HUB_CREDS == 'true'
        run: |
          set -euo pipefail
          crane tag "${HUB_NAME}:${TAG}" "${LATEST}"
          crane tag "${HUB_NAME}:${ARM_TAG}" "${LATEST_ARM}"
          echo "Hub ${LATEST} -> ${TAG}, ${LATEST_ARM} -> ${ARM_TAG}"

      # Guard against #267 ever regressing: the floating tag must resolve
      # to the exact digest the version tag — and therefore the cosign
      # signature — carries. Hard-fail otherwise. Every pair is compared
      # before failing, so one run reports every mismatch instead of
      # hiding the second behind the first.
      - name: Verify the floating tags resolve to the signed digests
        run: |
          set -uo pipefail
          fail=0
          cmp_tag() {
            local reg="$1" ver="$2" float="$3" v l
            v=$(crane digest "${reg}:${ver}") || { echo "::error::cannot read ${reg}:${ver}"; fail=1; return; }
            l=$(crane digest "${reg}:${float}") || { echo "::error::cannot read ${reg}:${float}"; fail=1; return; }
            if [ "$v" = "$l" ]; then
              echo "OK  ${reg}:${float} == :${ver}  ($v)"
            else
              echo "::error::${reg}:${float} ($l) != :${ver} ($v)"
              fail=1
            fi
          }
          cmp_tag "${GHCR_NAME}" "${TAG}" "${LATEST}"
          cmp_tag "${GHCR_NAME}" "${ARM_TAG}" "${LATEST_ARM}"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            cmp_tag "${HUB_NAME}" "${TAG}" "${LATEST}"
            cmp_tag "${HUB_NAME}" "${ARM_TAG}" "${LATEST_ARM}"
          fi
          [ "$fail" -eq 0 ]

      # The rc contract, asserted from the registry: a pre-release run
      # may exercise every step above, but `:latest` must be exactly what
      # it was when this job started. Without this, redirecting the rc to
      # `latest-rc` would rest on reading the `latest_tag` expression
      # correctly — and a typo there ships an rc to every user pulling
      # `:latest`.
      - name: Assert a pre-release did not move :latest
        if: needs.release.outputs.prerelease == 'true'
        env:
          BEFORE_GHCR: ${{ steps.before.outputs.ghcr }}
          BEFORE_HUB: ${{ steps.before.outputs.hub }}
        run: |
          set -uo pipefail
          fail=0
          check() {
            local reg="$1" before="$2" now
            now=$(crane digest "${reg}:latest" 2>/dev/null) || now="absent"
            if [ "$now" = "$before" ]; then
              echo "OK  ${reg}:latest unchanged by this pre-release (${now})"
            else
              echo "::error::pre-release moved ${reg}:latest — was ${before}, now ${now}"
              fail=1
            fi
          }
          check "${GHCR_NAME}" "${BEFORE_GHCR}"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            check "${HUB_NAME}" "${BEFORE_HUB}"
          fi
          [ "$fail" -eq 0 ]

      - name: Workflow summary
        if: always()
        run: |
          {
            if [ "${PRERELEASE}" = "true" ]; then
              echo "## Promoted \`${LATEST}\` / \`${LATEST_ARM}\` (pre-release dry-run)"
              echo
              echo "\`:latest\` was not moved — asserted against the registry."
            else
              echo "## Promoted \`${LATEST}\` / \`${LATEST_ARM}\` -> ${TAG}"
              echo
              echo "Each registry now serves \`:${TAG}\` (pin) and \`:latest\` (tip)."
              echo
              echo "### Install from GHCR"
              echo '```'
              echo "docker plugin install ${GHCR_NAME}:latest"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Cut the GitHub Release with the signed artifacts attached. Gated on
  # verify-install so a plugin that doesn't install/enable never gets an
  # advertised Releases page pointing users at it — the same ordering
  # the runbook's manual step 9 followed (cut the release only after the
  # workflow, incl. verify-install, is green). Satisfies Scorecard
  # Signed-Releases: every tag (incl. rc dry-runs) produces a Release
  # carrying the cosign-signed checksum manifest (#163).
  # One line here too -- not because the checker reads this job, but
  # because a reformatter reaching for these two identical lines will
  # take both, and only one of them says why it must not be wrapped.
  github-release:
    needs: [release, release-arm64, verify-install, verify-install-arm64, verify-install-hub, verify-install-hub-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub Release and upload assets
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
      # The attached artifacts, declared once. Both the notes step (which
      # names them for readers, since GitHub lazy-loads the assets list)
      # and the upload step read this, so the list on the page cannot
      # drift from the list actually uploaded (#469).
      RELEASE_FILES: >-
        net-dhcp-plugin-${{ needs.release.outputs.tag }}-linux-amd64.tar.gz
        net-dhcp-plugin-${{ needs.release.outputs.tag }}-linux-arm64.tar.gz
        sbom.spdx.json
        sbom.cdx.json
        sbom-arm64.spdx.json
        sbom-arm64.cdx.json
        checksums.txt
        checksums.txt.sigstore.json
        checksums-arm64.txt
        checksums-arm64.txt.sigstore.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-release

      - name: Download signed arm64 artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-release-arm64

      - name: Assemble release notes
        run: |
          set -euo pipefail
          # A release page is a landing page — for a link preview, a search
          # engine, and anything summarising the project cold (#469). So the
          # body is assembled as: self-locating line, then the hand-written
          # notes, then what you can download, then a link out to the
          # verification docs.

          # 1. The lead line. GitHub uses the first ~200 characters of the
          #    body as og:description, which is what Slack/Discord/forum
          #    previews show. Before this it was whatever the notes happened
          #    to open with — for v1.4.0, a sentence about the integration
          #    suite's wall clock, with the project unnamed.
          cat > notes.md <<EOF
          **docker-net-dhcp ${TAG}** — a Docker network plugin that leases
          container IPs from your LAN's real DHCP server instead of Docker's
          own IPAM. Bridge, macvlan and ipvlan modes.

          EOF

          # 2. Per-version section from RELEASE_NOTES.md (the extraction the
          #    runbook documents). Exact-match the header so version dots
          #    aren't treated as regex. Empty for rc/suffixed tags that have
          #    no notes section — fall back to a short body so the dry-run
          #    still produces a release.
          awk -v hdr="## ${TAG}" '$0==hdr{flag=1; next} /^## v/{flag=0} flag' \
            RELEASE_NOTES.md > section.md || true
          if [ ! -s section.md ]; then
            echo "Pre-release / dry-run build for \`${TAG}\`." > section.md
          fi
          # The rest of the body is written in one group: the notes
          # section, then (3) the artifact names — GitHub lazy-loads the
          # assets list, so the filenames appear nowhere in the fetched
          # HTML and "what can I download, for which architecture" had no
          # answer on the page. Generated from the same list that gets
          # uploaded, so it cannot drift from what is actually attached.
          {
            cat section.md
            echo
            echo "## Downloads"
            echo
            echo "\`linux/amd64\` and \`linux/arm64\`. Plugin images: \`ghcr.io/claymore666/docker-net-dhcp:${TAG}\` (amd64) and \`:${TAG}-arm64\` (mirrored to Docker Hub as \`claymore666/net-dhcp\`). Plugins cannot use manifest lists, so the arch is in the tag."
            echo
            echo "| file | what it is |"
            echo "| --- | --- |"
            for f in $RELEASE_FILES; do
              case "$f" in
                *-linux-amd64.tar.gz)     what="plugin rootfs + \`config.json\` (amd64)" ;;
                *-linux-arm64.tar.gz)     what="plugin rootfs + \`config.json\` (arm64)" ;;
                checksums.txt)            what="SHA-256 of the amd64 files" ;;
                checksums-arm64.txt)      what="SHA-256 of the arm64 files" ;;
                checksums.txt.sigstore.json) what="cosign bundle signing \`checksums.txt\`" ;;
                checksums-arm64.txt.sigstore.json) what="cosign bundle signing \`checksums-arm64.txt\`" ;;
                sbom.spdx.json)           what="SBOM, SPDX (amd64)" ;;
                sbom.cdx.json)            what="SBOM, CycloneDX (amd64)" ;;
                sbom-arm64.spdx.json)     what="SBOM, SPDX (arm64)" ;;
                sbom-arm64.cdx.json)      what="SBOM, CycloneDX (arm64)" ;;
                *)                        what="release artifact" ;;
              esac
              echo "| \`${f}\` | ${what} |"
            done

            # 4. Link the verification instructions instead of repeating
            #    them. The full block used to be appended verbatim to every
            #    release: ~1200 characters, over half the body of a small
            #    release and 96% of every rc. Anything that read the
            #    releases page and truncated saw `cosign verify-blob`
            #    several times and the changelog once.
            echo
            echo "## Verifying this release"
            echo
            echo "Signed and attested with Sigstore: the image carries a cosign signature and SLSA build provenance, and \`checksums.txt\` is signed so one signature covers every attached file."
            echo
            echo "Copy-pasteable commands: **<https://claymore666.github.io/docker-net-dhcp/verifying-releases/>**"
          } >> notes.md

      - name: Create or update the GitHub Release with signed artifacts
        run: |
          set -euo pipefail
          # rc builds are published as DRAFTS (#469). They still exercise the
          # real publish path — which is the entire point of the dry-run, so
          # skipping `gh release create` for them would defeat it — but a
          # draft stays out of the public releases list. Before this, every
          # vX.Y.Z sat next to its vX.Y.Z-rc1 and page one of the list was
          # ten entries of which five were boilerplate dry-run builds.
          # Nothing downstream depends on an rc release being public:
          # verify-install installs from the registry, not from release
          # assets, and runs before this job.
          if [ "${{ needs.release.outputs.prerelease }}" = "true" ]; then
            PRE="--prerelease=true --draft=true"
          else
            PRE="--prerelease=false --draft=false"
          fi
          FILES="$RELEASE_FILES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-dispatch of an existing tag: refresh assets + metadata.
            # shellcheck disable=SC2086
            gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
            # shellcheck disable=SC2086
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md $PRE
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $FILES \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag $PRE
          fi
          echo "GitHub Release $TAG published with signed artifacts." >> "$GITHUB_STEP_SUMMARY"
