name: Release

# Build and publish the plugin image on a vX.Y.Z tag push. Pushes to
# GHCR (always — built-in token) and Docker Hub (when the credentials
# secrets are configured). Dual-pushing keeps every release reachable
# from both registries; the README points operators at GHCR but Docker
# Hub is where most plugin discovery still happens.
#
# Trigger shapes:
#   - `git tag v0.8.0 && git push --tags` → automatic
#   - `git tag v1.0.0-rc1 && git push --tags` → automatic, pre-release
#     mode: full chain runs but `:latest` is NOT moved — the zero-impact
#     end-to-end dry-run to do before every real release tag
#   - GitHub UI → "Run workflow" → enter tag → manual re-run of an
#     existing tag (NOTE: a bare vX.Y.Z here rebuilds and re-points
#     that tag AND `:latest` — prefer the rc-tag dry-run)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   - DOCKERHUB_USERNAME — Docker Hub login (e.g. `claymore666`)
#   - DOCKERHUB_TOKEN    — Docker Hub access token (NOT password)
# If absent, the Hub step skips with a warning instead of failing.
#
# Maintainer post-release checklist (this workflow does not handle it):
#   1. Fast-forward dev to main so the release commit lands on dev too:
#        git checkout dev && git merge --ff-only main && git push origin dev
#      Otherwise the next feature branched from dev starts at the
#      previous version's README/docs and the next release PR has to
#      re-bump them. Forgotten once after v0.9.0.
#   2. Verify GHCR (and Docker Hub, if configured) shows the new tag.
#   3. If a production host runs the plugin, plan the upgrade as a
#      separate change — this workflow only publishes the image.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.8.0). Must already exist on the remote."
        required: true

# Top-level token is read-only; write scopes are granted per-job below
# (Scorecard Token-Permissions: a workflow-wide write scope leaks into
# every job, including ones that only need to pull).
permissions:
  contents: read

jobs:
  # This workflow was NOT vulnerable to #593: `Resolve release tag`
  # refuses anything that is not vX.Y.Z — `refs/pull/N/head` included —
  # and it refuses it before the checkout. The guard is here so that the
  # answer to "what may a dispatched ref be" has ONE authority in this
  # repository, instead of a correct hand-rolled regex here, another in
  # pages.yml, and whatever the next workflow's author writes. The
  # alternative was an exemption list in the checker, and an exemption
  # list is a documented hole that the next person walks through —
  # which is roughly how #593 happened.
  #
  # ITS OWN JOB, not a step in `release`. The guard needs the script,
  # the script needs a checkout, and `release`'s own checkout is of the
  # resolved tag at `fetch-depth: 0` — sequencing a second, trusted
  # checkout in front of it would perturb the one workflow whose failure
  # mode is a broken release. Thirty seconds of a thirty-minute chain is
  # the cheaper side of that trade. Everything else here reaches the tag
  # through `needs: release`, so gating this one job gates the workflow.
  dispatch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted: no `ref:` of its own, so a dispatched ref cannot supply
      # the validator that judges it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject a dispatch ref that is not ours
        run: bash scripts/check-dispatch-ref.sh --validate "${{ inputs.tag }}"

  release:
    needs: dispatch-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write       # GHCR push + image-signature/attestation upload
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # actions/attest-build-provenance attestations

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}

    env:
      # GHCR is always pushed. Hub repo only pushed when secrets are set.
      # Hub uses the shorter `net-dhcp` name (matching upstream's
      # convention there); GHCR keeps `docker-net-dhcp` to align with
      # the existing tag history.
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
      HUB_NAME: claymore666/net-dhcp
      # Materialize the Docker Hub secrets-presence check at job level
      # so steps can gate on env (allowed) rather than on the secrets
      # context directly (rejected at parse time inside step-level
      # `if:` expressions). Resolves to the literal string "true" or
      # "false" — compare with `== 'true'` downstream.
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag $TAG does not look like vX.Y.Z; refusing." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Pre-release guard: a suffixed tag (vX.Y.Z-rc1 etc.) runs the
          # full publishing chain — build, dual-registry push of the rc
          # tag, description sync, verify-install — but must NOT move
          # `:latest` or overwrite any bare release tag. This makes rc
          # tags a zero-impact end-to-end dry-run of this workflow
          # before the real vX.Y.Z tag (see docs/release-runbook.md).
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Releasing tag: $TAG"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag: $TAG — :latest will not be moved"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # Full history so RELEASE_NOTES.md credits / "since vX" greps
          # behave the same as on a developer checkout.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # crane retags `:latest` onto the version manifest's exact digest
      # (#267) — `docker buildx imagetools create` re-wraps a plugin
      # manifest in a new index, changing the digest; crane preserves it.
      # Go is already set up above, so install pinned from source.
      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: hub-login
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Warn if Docker Hub credentials missing
        if: env.HAS_HUB_CREDS != 'true'
        run: |
          echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets not set — skipping Docker Hub push. GHCR push proceeds normally."

      # Push to GHCR. `make push` chains create → push, so the plugin
      # is built fresh and published with the resolved tag. The Make
      # default PLUGIN_NAME already points at GHCR — passing it
      # explicitly here keeps the workflow self-documenting.
      #
      # `:latest` is published by RETAGGING the version tag's pushed
      # manifest, not by a second build (#267). A separate `make push`
      # re-ran `docker plugin create`, which re-tars the rootfs
      # non-reproducibly — so the old `:latest` got its own digest,
      # distinct from `:vX.Y.Z` AND uncovered by the cosign signature
      # (cosign signs by digest). `imagetools create --tag` points
      # `:latest` at the exact manifest `:vX.Y.Z` already has, so the two
      # share one digest and the single signature below covers both.
      # `:latest` is guarded: pre-release tags never move it (and this
      # also stops a dispatch of an OLD tag from silently regressing what
      # `:latest` points at — only bare vX.Y.Z tags may move it).
      - name: Push to GHCR
        run: make PLUGIN_NAME="${GHCR_NAME}" PLUGIN_TAG="${{ steps.tag.outputs.tag }}" push

      # The reference digests in docs/verifying-releases.md must describe
      # the binaries this tag actually publishes (#502).
      #
      # Placed here deliberately: `make push` above has just built
      # plugin/, so this is the earliest point the binaries exist, and it
      # is still BEFORE `:latest` moves. A failure therefore leaves a
      # published `:vX.Y.Z` with `:latest` untouched — recoverable by
      # fixing the doc and re-running, with nothing user-visible pointing
      # at a release that was never announced.
      #
      # It fails the release rather than warning, and it fails on an rc
      # too. That is the point: the rc dry-run is where a documentation
      # error should stop the train, not the real tag. An rc compares
      # against its base version (v1.6.0-rc1 -> v1.6.0) because it builds
      # from the same source and therefore carries the same digests.
      #
      # The digests can only be known after a tag builds, so the first rc
      # of a new version is EXPECTED to fail here and print the block to
      # paste into the doc. That is runbook step 10b becoming enforced
      # rather than remembered.
      - name: Check the documented reference digests against this build
        run: |
          bash scripts/check-reference-digests.sh \
            "${{ steps.tag.outputs.tag }}" \
            plugin/rootfs/usr/sbin/net-dhcp \
            plugin/rootfs/usr/lib/net-dhcp/dhcp-handler

      # ---------------------------------------------------------------
      # Per-architecture tags (#507).
      #
      # WHY TAGS AND NOT A MANIFEST LIST. A Docker plugin cannot be
      # installed from an index, by any Docker version:
      # Manager.Privileges() runs before the pull and matches single
      # manifests only, so the walk stops at the index and install fails
      # with `did not find plugin config for specified reference` — for
      # every architecture, including the one you are on, and
      # `docker plugin install` has no `--platform` to steer it.
      # Verified identical on Docker 26.1.5 and 28.5.2. So wiring
      # `push-multiarch` onto `:vX.Y.Z` would not add arm64, it would
      # make the release uninstallable for the amd64 users who already
      # pull that tag. The fork's own upstream published
      # `:release-linux-amd64` and appears to have hit the same wall.
      #
      # WHAT THE BARE TAGS MEAN, PERMANENTLY. `:vX.Y.Z` and `:latest`
      # stay amd64. That is backward compatibility, not a preference:
      # they are what every existing install already names.
      #
      # ORDER MATTERS. This runs AFTER the reference-digest check and
      # BEFORE `:latest` moves, for the same reason that check sits where
      # it does — a failure here leaves a published `:vX.Y.Z` with
      # `:latest` untouched, pointing at the previous release.
      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # The default `docker` buildx driver refuses multi-platform builds;
      # `docker-container` is the one that can. Nothing else in this
      # workflow needs it, so it is created here rather than at the top.
      #
      # `use: false` IS LOAD BEARING. This builder must not become the
      # current one: `docker build` routes through buildx, a
      # docker-container builder does not load images into the local
      # store, and `make push` — which the Docker Hub step below still
      # runs — does `docker create` against the tag it just built. Making
      # this the default would break that step with a missing image, well
      # after the GHCR release had already published. The multi-arch build
      # names this builder explicitly via BUILDX_BUILDER instead.
      - name: Set up buildx (docker-container driver)
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container
          use: false

      # scripts/requirements.txt declares exactly the two dependencies
      # push_multiarch_plugin.py imports (python-dxf, docker-image-py).
      # Until now nothing installed it (#535); the release path is the
      # first thing that needs it.
      - name: Install the plugin-push dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      # Builds both platforms — buildx only creates the per-platform
      # subdirectories push_multiarch_plugin.py reads when it is given
      # more than one — then publishes ONLY arm64, with no index.
      #
      # amd64 is deliberately not published from this build. It is
      # retagged off `:vX.Y.Z` in the next step instead, so
      # `:vX.Y.Z-linux-amd64` is the same digest as `:vX.Y.Z` and is
      # already covered by its signature. Pushing a second amd64 build
      # here would produce a different digest for the same release —
      # `docker plugin create` and this script tar the rootfs
      # differently — and two digests claiming to be the same thing is a
      # verification hazard, not a convenience.
      #
      # The arm64 build runs under QEMU. That is fine for BUILDING (pure
      # Go plus two apk packages); it is not fine for TESTING, because
      # qemu-user does not translate the NETLINK_GENERIC socket dhcpcd
      # opens, so an emulated plugin cannot take a lease at all. arm64 is
      # functionally verified in a full-system VM, and its timing
      # behaviour stays unverified until native hardware (#531).
      - name: Push per-arch plugin tags to GHCR
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make PLUGIN_NAME="${GHCR_NAME}" \
               PLUGIN_TAG="${{ steps.tag.outputs.tag }}" \
               PUSH_PLATFORMS=linux/arm64 \
               BUILDX_BUILDER="${{ steps.buildx.outputs.name }}" \
               push-per-arch

      - name: Alias the amd64 per-arch tag to the published GHCR digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: crane tag "${GHCR_NAME}:${TAG}" "${TAG}-linux-amd64"

      # The guard for the whole scheme. If an edit ever points a tag a
      # user installs at an index, EVERY `docker plugin install` of this
      # release fails — including amd64's, which worked before the change.
      # `make push-multiarch` still exists and still writes an index, so
      # that is one Make target away at all times and is asserted rather
      # than remembered.
      #
      # Here, before `:latest` moves, for the reference-digest step's
      # reason: a failure leaves a published `:vX.Y.Z` with `:latest`
      # still pointing at the previous release, which is recoverable and
      # invisible to users.
      #
      # GHCR only. It is the primary registry, Hub mirrors the same
      # artifacts by the same mechanism, and the Hub tags do not exist
      # yet at this point in the job.
      - name: Assert the installable tags are single manifests, not indexes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          LIST='application/vnd.docker.distribution.manifest.list.v2+json'
          INDEX='application/vnd.oci.image.index.v1+json'
          rc=0
          echo "Media types of the tags users install:"
          for ref in "${GHCR_NAME}:${TAG}" \
                     "${GHCR_NAME}:${TAG}-linux-amd64" \
                     "${GHCR_NAME}:${TAG}-linux-arm64-v8"; do
            mt=$(crane manifest "$ref" | jq -r '.mediaType // "unset"')
            if [ "$mt" = "$LIST" ] || [ "$mt" = "$INDEX" ]; then
              echo "::error::${ref} is a manifest list (${mt}). A Docker plugin cannot be installed from an index, so this release would be uninstallable on every architecture — see #507." >&2
              rc=1
            else
              echo "  ${ref} -> ${mt}"
            fi
          done
          exit "$rc"

      - name: Tag :latest to the published GHCR digest
        if: steps.tag.outputs.prerelease != 'true'
        run: crane tag "${GHCR_NAME}:${{ steps.tag.outputs.tag }}" latest

      # Same plugin to Docker Hub when credentials are present. Make
      # rebuilds the rootfs with the Hub-prefixed name; the underlying
      # Docker image layer cache is reused so this is cheap.
      - name: Push to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        run: make PLUGIN_NAME="${HUB_NAME}" PLUGIN_TAG="${{ steps.tag.outputs.tag }}" push

      # The Hub half of the per-arch tags (#507). It has to sit after the
      # Hub push above, because the amd64 alias is a retag of the Hub
      # `:vX.Y.Z` that step publishes.
      - name: Push per-arch plugin tags to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          make PLUGIN_NAME="${HUB_NAME}" \
               PLUGIN_TAG="${{ steps.tag.outputs.tag }}" \
               PUSH_PLATFORMS=linux/arm64 \
               BUILDX_BUILDER="${{ steps.buildx.outputs.name }}" \
               push-per-arch

      - name: Alias the amd64 per-arch tag to the published Docker Hub digest
        if: env.HAS_HUB_CREDS == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: crane tag "${HUB_NAME}:${TAG}" "${TAG}-linux-amd64"

      - name: Tag :latest to the published Docker Hub digest
        if: env.HAS_HUB_CREDS == 'true' && steps.tag.outputs.prerelease != 'true'
        run: crane tag "${HUB_NAME}:${{ steps.tag.outputs.tag }}" latest

      # Guard against #267 ever regressing: a real release must leave
      # `:latest` resolving to the exact digest the version tag (and the
      # cosign signature) carries. Hard-fail the release otherwise.
      - name: Verify :latest resolves to the signed version digest
        if: steps.tag.outputs.prerelease != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          v=$(crane digest "${GHCR_NAME}:${TAG}")
          l=$(crane digest "${GHCR_NAME}:latest")
          [ "$v" = "$l" ] || { echo "::error::GHCR :latest ($l) != :${TAG} ($v)"; exit 1; }
          echo "GHCR  :latest == :${TAG}  ($v)"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            hv=$(crane digest "${HUB_NAME}:${TAG}")
            hl=$(crane digest "${HUB_NAME}:latest")
            [ "$hv" = "$hl" ] || { echo "::error::Hub :latest ($hl) != :${TAG} ($hv)"; exit 1; }
            echo "Hub   :latest == :${TAG}  ($hv)"
          fi

      # Refresh the Docker Hub long description from the repo's README
      # so the Hub page never drifts from what's on GitHub. Short
      # description is owned here too — change it in this file when you
      # want it to change. Idempotent: the action diffs and only PATCHes
      # when content changed. Skipped if Hub credentials aren't set.
      #
      # Auth note: DOCKERHUB_TOKEN must be a Personal Access Token with
      # Read & Write scope on this repo (not just Read & Write image
      # push) — Docker Hub gates description-update behind admin scope.
      # If this step 401s/403s, regenerate the token; image-push tokens
      # alone won't do.
      #
      # continue-on-error: the long description is auxiliary metadata —
      # the published plugin (both registries) is what users pull, and
      # the runbook already treats the whole Hub path as optional
      # (GHCR alone still publishes). A description-sync auth failure
      # (e.g. a rotated / under-scoped token) must NOT fail the release
      # job or block verify-install; it surfaces as a red step to fix
      # out-of-band and re-syncs on the next release once the token is
      # restored. v1.0.0-rc1 caught exactly this: Hub 403 on PATCH.
      - name: Sync Docker Hub description from README
        if: env.HAS_HUB_CREDS == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.HUB_NAME }}
          short-description: "DHCP-leased IPs for Docker containers (bridge/macvlan/ipvlan). Fork of devplayer0/docker-net-dhcp."
          readme-filepath: ./README.md

      # Sign a release artifact and hand it to the github-release job.
      # Scorecard's Signed-Releases check inspects artifacts attached to
      # the GitHub Release — signing the registry images alone does not
      # satisfy it (#163). `make push` above already built plugin/
      # (rootfs + config.json), the exact tree `docker plugin create`
      # consumed, so packaging that reconstructs the published plugin.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The installer's major is not cosign's: cosign-installer v4 ships
      # cosign v3, and nothing in the pin says so. Docs telling users which
      # cosign to verify with are therefore documentation about a version
      # nobody asserts — which is how v1.5.0 shipped a bundle that the
      # documented command could not read on v2 (#522).
      #
      # Record what actually signed this release, and hard-fail if the
      # installer starts shipping a major the docs do not describe. Better
      # here, before anything is signed, than in a user's terminal with an
      # error that implicates the artifact.
      - name: Record and gate the cosign version
        run: |
          set -euo pipefail
          want=$(sed -n 's/^COSIGN_MAJOR=\([0-9][0-9]*\).*/\1/p' \
                   scripts/check-release-tooling.sh | head -1)
          got=$(cosign version 2>/dev/null \
                  | sed -n 's/.*GitVersion:[[:space:]]*v\{0,1\}\([0-9][0-9.]*\).*/\1/p' \
                  | head -1)
          echo "cosign ${got:-unknown} (docs and preflight expect major ${want})"
          {
            echo "### Signing toolchain"
            echo
            echo "- cosign \`${got:-unknown}\` — expected major \`${want}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$got" ]; then
            echo "::error::could not read the cosign version" >&2
            exit 1
          fi
          if [ "${got%%.*}" != "$want" ]; then
            echo "::error::cosign major ${got%%.*} installed, but the docs and" \
                 "scripts/check-release-tooling.sh describe major ${want}." \
                 "Update both before releasing — see #522." >&2
            exit 1
          fi

      # Sign the published plugin images by digest (#173). docker plugins
      # are OCI artifacts, so cosign signs them like any image once we
      # resolve the registry manifest digest — `docker buildx imagetools
      # inspect` reads it despite the plugin media type. Because `:latest`
      # is retagged to the version manifest above (#267), the two share one
      # digest, so this one signature per registry covers both. The GHCR
      # digest is exported for the provenance step below.
      - name: Sign published images (cosign keyless)
        id: signimg
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          GHCR_DIGEST=$(docker buildx imagetools inspect "${GHCR_NAME}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "ghcr_digest=${GHCR_DIGEST}" >> "$GITHUB_OUTPUT"
          cosign sign --yes "${GHCR_NAME}@${GHCR_DIGEST}"
          echo "Signed ${GHCR_NAME}@${GHCR_DIGEST}"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            HUB_DIGEST=$(docker buildx imagetools inspect "${HUB_NAME}:${TAG}" --format '{{.Manifest.Digest}}')
            cosign sign --yes "${HUB_NAME}@${HUB_DIGEST}"
            echo "Signed ${HUB_NAME}@${HUB_DIGEST}"
          fi

      # The arm64 manifest needs its own signature (#507). cosign signs by
      # DIGEST, so the signature above covers `:vX.Y.Z`, `:latest` and
      # `:vX.Y.Z-linux-amd64` — all one digest by construction — and says
      # nothing whatsoever about arm64. Leaving it out would ship an
      # architecture that docs/verifying-releases.md tells users to verify
      # and that cannot be verified.
      - name: Sign the arm64 per-arch manifest (cosign keyless)
        id: signarm
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          D=$(crane digest "${GHCR_NAME}:${TAG}-linux-arm64-v8")
          echo "arm64_digest=${D}" >> "$GITHUB_OUTPUT"
          cosign sign --yes "${GHCR_NAME}@${D}"
          echo "Signed ${GHCR_NAME}@${D} (linux/arm64)"
          if [ "${HAS_HUB_CREDS}" = "true" ]; then
            HD=$(crane digest "${HUB_NAME}:${TAG}-linux-arm64-v8")
            cosign sign --yes "${HUB_NAME}@${HD}"
            echo "Signed ${HUB_NAME}@${HD} (linux/arm64)"
          fi

      # SBOM over the plugin rootfs make already built (#174). syft emits
      # SPDX and CycloneDX in one pass; both are attached to the release
      # and folded into the signed checksum manifest below.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          set -euo pipefail
          syft scan dir:plugin/rootfs \
            -o "spdx-json=sbom.spdx.json" \
            -o "cyclonedx-json=sbom.cdx.json"
          ls -l sbom.spdx.json sbom.cdx.json

      - name: Package and sign release artifact
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ART="net-dhcp-plugin-${TAG}-linux-amd64.tar.gz"
          tar -czf "$ART" -C plugin .
          # Manifest covers the tarball AND the SBOMs, so the single
          # keyless signature below attests all release assets at once.
          sha256sum "$ART" sbom.spdx.json sbom.cdx.json > checksums.txt
          # Keyless (Fulcio/OIDC) signature over the checksum manifest,
          # emitted as a Sigstore bundle (cosign v3 default; the v2
          # --output-signature/--output-certificate pair was removed —
          # the bundle carries signature + short-lived cert in one public
          # file, verified against the Actions OIDC issuer).
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            "checksums.txt"
          echo "Signed release artifacts:"
          cat checksums.txt

      # SLSA build provenance (#173): GitHub-native attestations that bind
      # each artifact to this workflow + commit, verifiable with
      # `gh attestation verify`. One call for the file artifacts (by path)
      # and one for the published GHCR image (by digest, pushed to the
      # registry alongside the image).
      - name: Attest release-artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            net-dhcp-plugin-*.tar.gz
            sbom.spdx.json
            sbom.cdx.json

      - name: Attest image provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ steps.signimg.outputs.ghcr_digest }}
          push-to-registry: true

      # arm64 is a separate digest, so it needs its own attestation for
      # the same reason it needs its own signature (#507). Without this,
      # `gh attestation verify oci://...:VERSION-linux-arm64-v8` fails —
      # and docs/verifying-releases.md tells arm64 users to run it.
      - name: Attest image provenance (GHCR, arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ steps.signarm.outputs.arm64_digest }}
          push-to-registry: true

      - name: Upload signed artifacts for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: |
            net-dhcp-plugin-*.tar.gz
            sbom.spdx.json
            sbom.cdx.json
            checksums.txt
            checksums.txt.sigstore.json
          retention-days: 7
          if-no-files-found: error

      # Convenience: print the install incantations operators will use,
      # straight into the workflow summary so the release page links
      # them prominently.
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Released ${{ steps.tag.outputs.tag }}"
            echo
            if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
              echo "**Pre-release dry-run** — \`:latest\` was not moved."
            else
              echo "Each registry receives both \`:${{ steps.tag.outputs.tag }}\` (pin) and \`:latest\` (tip)."
            fi
            echo
            echo "### Install from GHCR"
            echo '```'
            echo "docker plugin install ${GHCR_NAME}:${{ steps.tag.outputs.tag }}"
            echo "docker plugin install ${GHCR_NAME}:latest"
            echo '```'
            if [ "${HAS_HUB_CREDS}" = "true" ]; then
              echo "### Install from Docker Hub"
              echo '```'
              echo "docker plugin install ${HUB_NAME}:${{ steps.tag.outputs.tag }}"
              echo "docker plugin install ${HUB_NAME}:latest"
              echo '```'
            else
              echo "_Docker Hub push skipped — set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets to enable._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-publish verification: install the artifact users will actually
  # pull, from a clean GitHub-hosted runner. "We pushed bytes" is not
  # "the deliverable works" — a plugin that 500s on install or fails to
  # enable must turn the release run red, not surface in a user issue
  # (#127). Exercised before each real release by the runbook's
  # workflow_dispatch dry-run against the previous tag.
  verify-install:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read   # pulls the just-published plugin from GHCR
    env:
      GHCR_NAME: ghcr.io/claymore666/docker-net-dhcp
    steps:
      - name: Install released plugin from GHCR
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          REF="${GHCR_NAME}:${TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The published plugin bind-mounts STATE_DIR, and the daemon
          # does not create a missing bind source (#440). verify-install
          # must do exactly what the docs tell an operator to do.
          sudo mkdir -p /var/lib/net-dhcp
          # Nothing else gets an mkdir here. This runner is the only
          # machine that installs onto a daemon which has never created a
          # network sandbox, and that is the whole value of the job: it
          # is how v1.6.0-rc2 caught a bind source the daemon creates
          # lazily (#588), which every developer box and the integration
          # runner had long since created by running a container.
          # Creating a missing path here would turn the one host that can
          # see that class of bug into another host that cannot, and ship
          # it to users instead. Fix the manifest.
          docker plugin install --grant-all-permissions "$REF"
          docker plugin ls

      - name: Assert plugin is enabled
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          REF="${GHCR_NAME}:${TAG}"
          ENABLED="$(docker plugin inspect -f '{{.Enabled}}' "$REF")"
          if [ "$ENABLED" != "true" ]; then
            echo "Plugin installed but not enabled (Enabled=$ENABLED)"
            docker plugin inspect "$REF"
            exit 1
          fi
          echo "Plugin ${REF} installs and enables cleanly." >> "$GITHUB_STEP_SUMMARY"

      # The per-arch tags are a second publishing path, and an unexercised
      # publishing path is one that breaks quietly (#507). This is the
      # half that can be checked from an amd64 runner.
      #
      # WHY THE ARM64 TAG IS NOT INSTALLED HERE. Not caution — it would
      # tell us nothing true. Docker does NO architecture validation at
      # plugin install (the plugin config carries no os/arch field to
      # validate against), so the arm64 plugin would install happily and
      # then fail to enable because its binaries cannot exec. That red
      # would be indistinguishable from a genuinely broken build. Running
      # it under emulation is not the answer either: qemu-user does not
      # translate the NETLINK_GENERIC socket dhcpcd opens, so an emulated
      # plugin cannot take a lease at all. arm64 is verified in a
      # full-system VM, and on native hardware in #531.
      - name: Assert the per-arch tags resolve
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          LIST='application/vnd.docker.distribution.manifest.list.v2+json'
          INDEX='application/vnd.oci.image.index.v1+json'
          for arch in linux-amd64 linux-arm64-v8; do
            REF="${GHCR_NAME}:${TAG}-${arch}"
            mt=$(docker manifest inspect "$REF" | jq -r '.mediaType // "unset"')
            if [ "$mt" = "$LIST" ] || [ "$mt" = "$INDEX" ]; then
              echo "::error::${REF} is a manifest list (${mt}) — a plugin cannot be installed from an index (#507)." >&2
              exit 1
            fi
            echo "  ${REF} -> ${mt}"
          done
          # A distinct ROOTFS LAYER is the evidence that the arm64 tag is
          # a genuinely different build rather than the amd64 manifest
          # aliased under an arm64 name — the mistake that would ship an
          # amd64 binary to every Pi and pass every other check here.
          #
          # The layer, not the config: both manifests reference the same
          # config.json blob by design, so comparing configs would compare
          # something that is supposed to match.
          b=$(docker manifest inspect "${GHCR_NAME}:${TAG}-linux-arm64-v8" | jq -r '.layers[0].digest')
          c=$(docker manifest inspect "${GHCR_NAME}:${TAG}-linux-amd64" | jq -r '.layers[0].digest')
          if [ -z "$b" ] || [ "$b" = "null" ] || [ -z "$c" ] || [ "$c" = "null" ]; then
            echo "::error::could not read a rootfs layer digest from both per-arch manifests" >&2
            exit 1
          fi
          if [ "$b" = "$c" ]; then
            echo "::error::${TAG}-linux-arm64-v8 and ${TAG}-linux-amd64 share a rootfs layer (${b}) — the arm64 tag is not an arm64 build (#507)." >&2
            exit 1
          fi
          echo "arm64 rootfs layer ${b} differs from amd64's ${c}, as it must."

      # The amd64 per-arch tag is the one an amd64 host would install, so
      # it is the one this runner can prove end to end. It is a retag of
      # the same digest as `:vX.Y.Z`, so what this actually catches is a
      # broken or missing alias — a 404 for anyone following the arch
      # table in the docs.
      #
      # The bare tag's plugin is removed first: two enabled plugins from
      # one release is not a state any user is in, and not one worth
      # discovering a quirk of.
      - name: Install the amd64 per-arch tag from a clean slate
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          docker plugin disable -f "${GHCR_NAME}:${TAG}"
          docker plugin rm -f "${GHCR_NAME}:${TAG}"
          REF="${GHCR_NAME}:${TAG}-linux-amd64"
          docker plugin install --grant-all-permissions "$REF"
          ENABLED="$(docker plugin inspect -f '{{.Enabled}}' "$REF")"
          if [ "$ENABLED" != "true" ]; then
            echo "::error::${REF} installed but not enabled (Enabled=$ENABLED)" >&2
            docker plugin inspect "$REF"
            exit 1
          fi
          echo "Per-arch tag ${REF} installs and enables cleanly." >> "$GITHUB_STEP_SUMMARY"

  # Cut the GitHub Release with the signed artifacts attached. Gated on
  # verify-install so a plugin that doesn't install/enable never gets an
  # advertised Releases page pointing users at it — the same ordering
  # the runbook's manual step 9 followed (cut the release only after the
  # workflow, incl. verify-install, is green). Satisfies Scorecard
  # Signed-Releases: every tag (incl. rc dry-runs) produces a Release
  # carrying the cosign-signed checksum manifest (#163).
  github-release:
    needs: [release, verify-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub Release and upload assets
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
      # The attached artifacts, declared once. Both the notes step (which
      # names them for readers, since GitHub lazy-loads the assets list)
      # and the upload step read this, so the list on the page cannot
      # drift from the list actually uploaded (#469).
      RELEASE_FILES: >-
        net-dhcp-plugin-${{ needs.release.outputs.tag }}-linux-amd64.tar.gz
        sbom.spdx.json
        sbom.cdx.json
        checksums.txt
        checksums.txt.sigstore.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Download signed artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-release

      - name: Assemble release notes
        run: |
          set -euo pipefail
          # A release page is a landing page — for a link preview, a search
          # engine, and anything summarising the project cold (#469). So the
          # body is assembled as: self-locating line, then the hand-written
          # notes, then what you can download, then a link out to the
          # verification docs.

          # 1. The lead line. GitHub uses the first ~200 characters of the
          #    body as og:description, which is what Slack/Discord/forum
          #    previews show. Before this it was whatever the notes happened
          #    to open with — for v1.4.0, a sentence about the integration
          #    suite's wall clock, with the project unnamed.
          cat > notes.md <<EOF
          **docker-net-dhcp ${TAG}** — a Docker network plugin that leases
          container IPs from your LAN's real DHCP server instead of Docker's
          own IPAM. Bridge, macvlan and ipvlan modes.

          EOF

          # 2. Per-version section from RELEASE_NOTES.md (the extraction the
          #    runbook documents). Exact-match the header so version dots
          #    aren't treated as regex. Empty for rc/suffixed tags that have
          #    no notes section — fall back to a short body so the dry-run
          #    still produces a release.
          awk -v hdr="## ${TAG}" '$0==hdr{flag=1; next} /^## v/{flag=0} flag' \
            RELEASE_NOTES.md > section.md || true
          if [ ! -s section.md ]; then
            echo "Pre-release / dry-run build for \`${TAG}\`." > section.md
          fi
          # The rest of the body is written in one group: the notes
          # section, then (3) the artifact names — GitHub lazy-loads the
          # assets list, so the filenames appear nowhere in the fetched
          # HTML and "what can I download, for which architecture" had no
          # answer on the page. Generated from the same list that gets
          # uploaded, so it cannot drift from what is actually attached.
          {
            cat section.md
            echo
            echo "## Downloads"
            echo
            echo "\`linux/amd64\`. Plugin image: \`ghcr.io/claymore666/docker-net-dhcp:${TAG}\` (mirrored to Docker Hub as \`claymore666/net-dhcp\`)."
            echo
            echo "| file | what it is |"
            echo "| --- | --- |"
            for f in $RELEASE_FILES; do
              case "$f" in
                *.tar.gz)                 what="plugin rootfs + \`config.json\`" ;;
                checksums.txt)            what="SHA-256 of every attached file" ;;
                checksums.txt.sigstore.json) what="cosign bundle signing \`checksums.txt\`" ;;
                sbom.spdx.json)           what="SBOM, SPDX" ;;
                sbom.cdx.json)            what="SBOM, CycloneDX" ;;
                *)                        what="release artifact" ;;
              esac
              echo "| \`${f}\` | ${what} |"
            done

            # 4. Link the verification instructions instead of repeating
            #    them. The full block used to be appended verbatim to every
            #    release: ~1200 characters, over half the body of a small
            #    release and 96% of every rc. Anything that read the
            #    releases page and truncated saw `cosign verify-blob`
            #    several times and the changelog once.
            echo
            echo "## Verifying this release"
            echo
            echo "Signed and attested with Sigstore: the image carries a cosign signature and SLSA build provenance, and \`checksums.txt\` is signed so one signature covers every attached file."
            echo
            echo "Copy-pasteable commands: **<https://claymore666.github.io/docker-net-dhcp/verifying-releases/>**"
          } >> notes.md

      - name: Create or update the GitHub Release with signed artifacts
        run: |
          set -euo pipefail
          # rc builds are published as DRAFTS (#469). They still exercise the
          # real publish path — which is the entire point of the dry-run, so
          # skipping `gh release create` for them would defeat it — but a
          # draft stays out of the public releases list. Before this, every
          # vX.Y.Z sat next to its vX.Y.Z-rc1 and page one of the list was
          # ten entries of which five were boilerplate dry-run builds.
          # Nothing downstream depends on an rc release being public:
          # verify-install installs from the registry, not from release
          # assets, and runs before this job.
          if [ "${{ needs.release.outputs.prerelease }}" = "true" ]; then
            PRE="--prerelease=true --draft=true"
          else
            PRE="--prerelease=false --draft=false"
          fi
          FILES="$RELEASE_FILES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-dispatch of an existing tag: refresh assets + metadata.
            # shellcheck disable=SC2086
            gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
            # shellcheck disable=SC2086
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md $PRE
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $FILES \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag $PRE
          fi
          echo "GitHub Release $TAG published with signed artifacts." >> "$GITHUB_STEP_SUMMARY"
