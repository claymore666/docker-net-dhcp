name: Starter tasks

# Do the "good first issue" claims still match the tracker (#537, #851)?
#
# README.md's Contributing section and .bestpractices.json's `small_tasks`
# answer both assert live tracker state, and they decay in BOTH directions.
# While the answer is Met they assert the label has open issues and that the
# ones the justification names are still available — and the moment the
# seeded tasks are picked up, the SUCCESS case, the filter returns an empty
# page and both artifacts start lying with nothing going red. That happened,
# for four days (#851).
#
# Once the answer is honestly Unmet the same silence runs the other way: the
# day somebody files a genuine starter task the project is under-claiming a
# criterion it now meets, and only this check says so. That reverse red is
# what makes "we will flip it back" enforced rather than remembered.
#
# WHY THIS IS NOT IN test.yaml. The claim can become false without anybody
# touching the tree, so gating a pull request on it would fail an unrelated
# PR because somebody closed an issue, and would fail on a tracker API blip
# too. The half that IS a property of the tree — the README and the badge
# justification pointing at the same label — runs there instead, and this
# workflow covers only what needs the API: the label's open count, and whether
# the repository still offers the route the Unmet answer sends newcomers to.
#
# A red schedule is easier to ignore than a red PR; that is the accepted
# cost of not charging it to an unrelated contributor. The check exits 2
# rather than 1 when it cannot see, so "the API was down" is distinguishable
# from "the promise is broken" in the run log.
#
# TWO QUESTIONS, TWO DIFFERENT ANSWERS (#839).
#
# WHICH COPY OF THIS FILE RUNS: `main`'s. A cron only ever fires from the
# default branch, so the `on:` block, the permissions and the step list
# below are whatever shipped in the last release. An edit to this file
# takes effect at the next release, not at merge.
#
# WHICH TREE IT JUDGES AGAINST: `dev`'s — the checkout below pins it.
# The subject is the TRACKER, which advances when work merges to `dev`.
# The claims being checked live in README.md and .bestpractices.json, so
# when a PR in `dev` re-points the starter-task filter at a different
# label, `main`'s two files still name the old one: judged against `main`
# the run reports a broken promise that `dev` has already fixed, every
# day until the release ships. The tree-only half of the same claim —
# that the README and the badge agree with each other — runs per PR as
# `--static`, where `main` is not involved at all.
#
# So an edit to README.md, .bestpractices.json or
# scripts/check-good-first-issues.sh takes effect the moment it reaches
# `dev`. An edit to this file does not.
on:
  schedule:
    # Daily. The claim changes at human pace — an issue gets picked up, not
    # a commit pushed — so hourly would only add noise.
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  # The Unmet answer tells a newcomer to ask in Discussions, and the check
  # confirms that route is still offered — a repository setting can withdraw
  # it without anybody touching the tree, which is exactly the kind of silent
  # decay this schedule exists for.
  discussions: read

jobs:
  starter-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned (#839). Without a ref the schedule judges the tracker
          # against `main`'s README.md and .bestpractices.json, which lag
          # `dev` for the whole release window. Same fix as
          # issue-state-labels.yml (#490).
          ref: dev

      - name: The starter-task claims still hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-good-first-issues.sh --live
