name: Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # Weekly run so govulncheck surfaces CVEs that publish between
  # commits — new vulnerabilities don't wait for our next push (#127).
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exact patch, never a `'1.26'` range — see #525. Every Go pin in
      # this tree names the same patch release and
      # scripts/check-go-pins.sh fails the build when they drift apart.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      # Drifted go.mod/go.sum slips through silently until someone
      # builds from a clean checkout. -diff reports without rewriting.
      - name: go.mod tidy check
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt -l found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

      # Native fuzzing over the untrusted DHCP-response parsers (#162):
      # BuildEvent's env-var path (DHCP-server-controlled) and the
      # handler-pipe JSON decoder. Time-boxed so regressions surface
      # per-PR without a long-running job; the committed seed corpora
      # also run unconditionally in the race step above. Scorecard's
      # Fuzzing check is satisfied by the presence of these targets.
      #
      # The budget is in EXECUTIONS, not wall clock, and that is the fix
      # for #324 rather than a preference. A duration makes the fuzzing
      # coordinator install a deadline context; when it expires the
      # coordinator wakes on the parent's Done channel and calls
      # stop(ctx.Err()). The suppression that should turn that into a
      # clean stop compares the error against the CHILD context's Err(),
      # and context.cancelCtx closes its own Done channel BEFORE it
      # propagates cancellation to its children. Lose that race and the
      # child still reads nil, DeadlineExceeded survives, and the run
      # fails with a bare "context deadline exceeded" and no crashing
      # input. With a count, opts.Timeout stays zero, the deadline
      # context is never created, and the branch is unreachable.
      #
      # -parallel 2 stays, but note it was NOT the fix: #350 capped the
      # workers on the theory that the coordinator lacked CPU, and the
      # same failure returned on dev on 2026-08-14 with the runner
      # executing a healthy 22k execs/sec.
      #
      # A count also makes every runner do the same amount of fuzzing.
      # Under 20s the contended runs managed ~110k execs against ~10M
      # locally — the gate was quietly testing far less exactly when it
      # was least able to. -timeout bounds the one thing a count does
      # not: a pathologically slow runner, which is a real signal.
      #
      # scripts/check-fuzz-budget.sh keeps this shape from regressing.
      - name: Fuzz (short)
        run: |
          for target in FuzzBuildEvent FuzzEventUnmarshal; do
            echo "::group::${target}"
            go test ./pkg/dhcp/ -run '^$' -fuzz "^${target}$" -fuzztime 200000x -parallel 2 -timeout 5m
            echo "::endgroup::"
          done

      # The CI gate scripts are code too — their table-driven tests run
      # here so a broken ratchet/vuln gate fails like any unit test.
      #
      # DISCOVERED, not listed (#542). This was 28 hand-maintained
      # `bash scripts/test-...sh` lines with nothing reconciling them
      # against the directory: add a gate with its self-test, forget the
      # line, and the self-test never ran — no error, no warning, and
      # `scripts/` looked fully covered while the gate it protects
      # rotted. The logic lives in a script rather than here so it can
      # have a self-test of its own, like every other gate in this repo.
      # test-integration-shard.sh asserts the shard partition is identical
      # under C and under a comma-decimal locale (#554). The hosted image
      # ships only C/C.UTF-8/POSIX/en_US, none of which format 1.5 as
      # "1,5", so without this the case has nothing to compare against.
      #
      # It deliberately FAILS rather than skips in that situation: an
      # uninstalled locale silently falls back to C, so a skip would have
      # been indistinguishable from a pass while exercising nothing —
      # which is the exact bug class the case exists to catch. Generating
      # the locale here is what keeps it honest, and it costs ~2s.
      - name: Provide a comma-decimal locale for the shard self-test
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -qi '^de_DE' || {
            echo "::error title=Locale not generated::de_DE.UTF-8 is still absent after locale-gen" >&2
            exit 1
          }

      - name: Gate script self-tests
        run: bash scripts/run-gate-selftests.sh

      # Every driver-option key the code parses must be documented in
      # docs/reference.md — an undocumented option turns CI red (#132).
      - name: Option-docs drift check
        run: bash scripts/check-option-docs.sh

      # Only the half that needs no network (#537). The README's starter-task
      # filter and the badge justification's must point at the same label, so
      # a rename cannot leave one of them matching nothing. That is a property
      # of the tree, so this commit is the only thing that can break it.
      #
      # Whether the label still HAS open issues is a claim about live tracker
      # state and deliberately does NOT run here: an unrelated PR must not go
      # red because somebody closed the last starter issue. That half runs on
      # a schedule — see starter-tasks.yml.
      - name: Starter-task links agree
        run: bash scripts/check-good-first-issues.sh --static

      # The companion check (#345): every health counter and settable
      # env var must be documented too, and none of them — nor any
      # driver option — may be documented a second time on another page.
      # Duplicated tables are how the macvlan page's counter list went a
      # release stale without anyone noticing.
      - name: Docs-drift check
        run: bash scripts/check-docs-drift.sh

      # Presence is not agreement (#638). check-docs-drift proves every
      # counter is documented; this proves the three places that say
      # WHICH ones flip `healthy` still say the same thing, and that the
      # code computes that many. The `healthy` row listed three for two
      # releases while the column beside it and the code both said four.
      - name: Health-contract check
        run: bash scripts/check-health-contract.sh

      # Every published-image pin in README/docs must agree on one
      # version — catches a partial release bump (#251). Bump them with
      # scripts/bump-version.sh vX.Y.Z.
      - name: Version-pin consistency check
        run: bash scripts/check-version-pins.sh

      # The same invariant for the Go toolchain (#525): every pin names
      # the same patch release, and none of them is a range. A `'1.26'`
      # in setup-go resolves out of the hosted tool cache, so it let us
      # scan on one Go and ship users another — go1.26.5 went out in
      # v1.5.0 with five stdlib findings nobody had chosen to accept.
      - name: Go pin consistency check
        run: bash scripts/check-go-pins.sh

      # config.json and config-cover.json must agree on privilege
      # fields — a capability landing in only one means coverage runs
      # test a different plugin than the one that ships (#317's
      # CAP_SYS_PTRACE did exactly that on the v1.3.3 release PR).
      - name: Plugin-manifest parity check
        run: bash scripts/check-manifest-parity.sh

      # The issue labeller's rule map (#393). A pattern that has stopped
      # matching costs nothing visible at runtime — issues just fall
      # through to the model pass — so the fixture is the only thing
      # that notices.
      - name: Issue label map check
        run: bash scripts/check-issue-label-map.sh

      # Every FROM in the tree must name its base by digest (#633).
      # Three of four Dockerfiles already did, including the sibling that
      # pins the same base as the one that did not — so the convention
      # was universal and unenforced, and only an advisory external scan
      # noticed. Dependabot cannot bump a digest that was never written.
      - name: Dockerfile digest-pin check
        run: bash scripts/check-dockerfile-pins.sh

      # Under pipefail a `grep -q` kills its producer with SIGPIPE the
      # moment it matches, so the pipeline reports failure on success —
      # timing-dependent, therefore invisible locally and on a re-run.
      # check-python-deps shipped that way and reported that nothing
      # installs a file two workflow lines install. Same class as #297.
      - name: Pipefail-consumer check
        run: bash scripts/check-pipefail-consumers.sh

      # A gate self-test that builds a git fixture must pin that repo's
      # own identity and signing config. Inheriting the developer's
      # means `git commit` blocks on a hardware-key touch that never
      # comes: `make check` hangs with no output rather than failing.
      # Hosted CI has no signing config, so this was green here and
      # stuck in a working checkout.
      - name: Git-fixture hygiene check
        run: bash scripts/check-selftest-fixtures.sh

      # A declared Python dependency has to be reachable from something
      # (#535). scripts/requirements.txt named two distributions for a
      # manifest-list helper whose callers were removed with #507:
      # nothing installed the file, nothing imported the module, and
      # both read as live build tooling for months. A reader chasing
      # #507 concluded the deps were undeclared — they were declared,
      # and nothing pointed at them.
      - name: Python dependency-reachability check
        run: bash scripts/check-python-deps.sh

      # Every tracked source file must carry the copyright line and
      # SPDX-License-Identifier (#454). A file added without them breaks
      # no build and fails no test, so this gate is the only thing that
      # would ever notice. It also pins the expression: GPL-3.0-only,
      # not -or-later, which this fork has no standing to grant.
      # Fix locally with: bash scripts/check-license-headers.sh --fix
      - name: License-header check
        run: bash scripts/check-license-headers.sh

      # Plugin.mu and the tombstone lock must never be held together:
      # taking them in opposite orders on two paths deadlocks the plugin,
      # and a deadlocked network driver takes every `docker run` on the
      # host with it. That rule lived in a comment on the mutex
      # declaration — not on the call sites where the mistake is made —
      # for most of this project's life (#643).
      - name: Lock discipline
        run: bash scripts/check-lock-discipline.sh

      # The arm64 host's NFS-outage watchdog is wired across four files
      # and both ways of getting it wrong are silent: systemd keeping
      # /dev/watchdog (nothing pets, host unprotected) and systemd
      # releasing it with nothing enabled to take over (a healthy host
      # resets a minute after boot). Nothing in CI builds the netboot
      # image, so without this the breakage surfaces at the next
      # reprovision of that host instead of here (#632).
      - name: Pi watchdog wiring
        run: bash scripts/check-pi-watchdog-wiring.sh

      # A parent NIC registers one rx_handler, so it is a macvlan port
      # or an ipvlan port and never both. Every child link attached to a
      # parent has to be serialised by Plugin.lockParent or it can be
      # refused with EBUSY — reaching the user as a `docker run` that
      # fails because of an unrelated container (#549, #486).
      #
      # addChildLink takes a *parentGuard, so the compiler proves a
      # guard is present at every parent-attached LinkAdd. It cannot
      # prove the guard is REAL — the zero value is valid Go — nor stop
      # a direct netlink.LinkAdd. This gate covers both of those: every
      # LinkAdd in pkg/ must be justified in
      # .github/linkadd-accounting.txt, and a parentGuard built outside
      # parent_gate.go fails the build. Bridge networks legitimately
      # need the direct call, so the bypass cannot be banned; what this
      # stops is taking it without anyone deciding to (#571).
      - name: Parent-gate accounting check
        run: bash scripts/check-parent-gate-accounting.sh

      # Documentation that is a standing operator PRECONDITION rather
      # than a description of the current version. The other docs gates
      # reconcile prose against a code fact — counters, settings,
      # driver-opts, image pins — and text with no code fact to check
      # against fell between all of them. The STATE_DIR install block
      # is the first entry: it names v1.5.0, so it reads as changelog
      # prose a release documentation pass should clean up, and
      # deleting it makes `docker plugin install` fail with no error
      # anywhere that names the cause (#579).
      - name: Doc-invariant check
        run: bash scripts/check-doc-invariants.sh

      # The two integration lanes build the plugin into different
      # directories, and a test that spells one of them is green on
      # every PR and red once per release (#583). harness.BuiltPluginDir
      # is the one place they are named; this keeps it that way.
      - name: Build-directory reference check
        run: bash scripts/check-build-dir-refs.sh

      # An unreadable path under .claude/ must not break the build
      # context (#530). This one is structurally invisible to the rest
      # of CI: checkouts are fresh, so .claude/ does not exist, and the
      # integration and coverage jobs run as root, for which the
      # permission does not apply. It is only reachable in a long-lived
      # working checkout by a non-root user — where development happens.
      - name: Build-context check
        run: bash scripts/check-build-context.sh

      # Every job that builds an image on the shared self-hosted pool
      # must authenticate to Docker Hub before it pulls (#562). Pulled
      # anonymously, base images are billed to a per-address quota the
      # whole pool shares; when it is spent the build dies with
      # `toomanyrequests` fifteen seconds in, no test binary runs, and
      # the red is indistinguishable from a sharded test failure.
      #
      # Hosted, so it costs no pool slot to assert a property of the
      # pool — this reads workflow text and needs no runner of that
      # kind. It is also the only place the property is checked at all:
      # the failure it prevents depends on unrelated traffic from the
      # same address, so a run can pass for weeks with the login absent.
      - name: Registry-login check
        run: bash scripts/check-registry-login.sh

      # Every page that prints a cosign command must state which cosign
      # major it needs (#522). Verifying a signature is the one moment a
      # user is deciding whether to trust the artifact, and cosign v2's
      # failure against a v3 bundle blames the release, not the toolchain.
      # The required major lives in scripts/check-release-tooling.sh; this
      # keeps the user-facing pages following it.
      - name: Cosign-version docs check
        run: bash scripts/check-cosign-docs.sh

      # Every job taking a workflow_dispatch `ref` input must sit behind
      # the job that validates it (#593). A fork's pull-request head is
      # fetchable from this repository and a dispatch context carries
      # the repository secrets, so an unvalidated ref checks outside
      # code out as root on the self-hosted pool, with the registry
      # credential in the job.
      #
      # The rule already existed as a SECURITY comment in
      # integration.yml and a second route walked around it, which is
      # why the coverage is asserted here rather than remembered. It
      # reads workflow text, so it costs no pool slot.
      - name: Dispatch-ref guard coverage
        run: bash scripts/check-dispatch-ref-guard.sh

      # The local lane must not test less than this job does (#636).
      # scripts/local-lane.sh is what `make check` runs before a push;
      # the moment it lists fewer gates than the steps above, it exits 0
      # having skipped one and the developer reads that as green. Same
      # shape as #542, one level up — so the lane ships with a gate
      # reconciling it against this file rather than on trust. A gate
      # that cannot run on a workstation is declared out of lane with a
      # reason; it is never simply absent.
      - name: Local-lane coverage
        run: bash scripts/check-local-lane.sh

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Run staticcheck
        run: staticcheck ./...

  # Lints all workflow files (+ shellcheck on run: blocks). A workflow
  # parse error doesn't fail loudly on GitHub — it produces zero-job
  # "failed" runs and silently disables tag triggers (bit us in v0.8.0).
  # scripts/test-actionlint.sh additionally asserts the linter still
  # catches that exact bug class, so a toothless actionlint upgrade
  # turns this job red instead of passing silently (#127).
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      # actionlint shells out to shellcheck for `run:` blocks. The agent
      # itself is pinned (above), but the runner-supplied shellcheck is
      # not — a hosted-image bump silently changes what the gate reports
      # and can redden unrelated PRs (#183). Pin it so the gate is
      # deterministic; bump deliberately alongside actionlint.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: actionlint -color
      - name: Verify actionlint catches known-bad patterns
        run: bash scripts/test-actionlint.sh actionlint

      # The gate scripts themselves. Until now shellcheck ran here only
      # as actionlint's subprocess, on `run:` blocks embedded in workflow
      # files — so scripts/*.sh, which is every check-*.sh gate and every
      # self-test, was linted by nothing at all. The pinned binary was
      # already installed two steps up; the gap was one step wide.
      #
      # It matters more here than in ordinary code. A gate that
      # misbehaves does not fail loudly, it passes quietly, and this
      # repository keeps rediscovering that shape (#418, #487, #542,
      # #598). The scripts meant to catch it were the unchecked ones.
      #
      # -S warning, not -S style: style is clean on the newest scripts
      # and noisy on the older ones, and a level nobody can hold gets
      # bypassed. Raise it deliberately if that changes.
      #
      # Suppressions carry a reason inline. A repo-wide exclude list
      # would recreate exactly the blind spot this closes.
      #
      # ci/runner-image/*.sh is in scope for the same reason and was
      # found by the same argument (#632): it is the shell that decides
      # whether every self-hosted job's environment comes up at all —
      # nested daemon, cgroup posture, proxy wiring, and now the arm64
      # runner's own registration — and nothing linted it either.
      # test/arm64-netboot/*.sh joins for the third application of the
      # same argument (#632): patch-target.sh is what installs the arm64
      # host's watchdog and its systemd hand-off, so a defect there is a
      # host that boots unprotected — and nothing was linting it either.
      - name: Shellcheck the gate, runner-image and netboot scripts
        run: shellcheck -S warning scripts/*.sh ci/runner-image/*.sh test/arm64-netboot/*.sh

  # This fork is published as the maintainer's own work, so no commit
  # or PR may credit an AI assistant. The rule predates the repo's CI
  # and still reached a public branch twice — enforcing it mechanically
  # is the only version that holds on a bad day.
  #
  # pull_request only: the gate needs a base..head range and the PR
  # description, neither of which a push event supplies.
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate walks base..head; a shallow clone cannot resolve it.
          fetch-depth: 0
      - name: Check commits and PR body for AI attribution
        env:
          # Through env, never inlined into run: — a PR description is
          # attacker-controlled text, and interpolating it directly
          # would paste it into the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check-no-ai-attribution.sh \
            "$BASE_SHA..$HEAD_SHA" "$RUNNER_TEMP/pr-body.md"
      # Same event, same range, same reason it is mechanical rather
      # than remembered: "never weaken a failing test" was written into
      # CLAUDE.md and an opt-out helper still reached dev and hid #402
      # and #408 for months. Any finding is waived by an issue
      # reference, so this blocks silence, not the edit (#413).
      - name: Check the diff for a weakened test
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check-test-weakening.sh \
            "$BASE_SHA..$HEAD_SHA" "$RUNNER_TEMP/pr-body.md"

  # Reachable-vulnerability scan. Known-and-reviewed findings without a
  # published fix live in .github/vuln-allowlist.txt; anything else
  # fails. The gate also warns when an allowlist entry stops being
  # reported, so stale acceptances get removed (#127).
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep this toolchain in sync with the Dockerfile's golang base
      # image — stdlib findings are evaluated against the scan
      # toolchain, which should represent what ships in the plugin.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan
        run: |
          govulncheck ./... > vulns.txt || true
          cat vulns.txt
          # No conclusiveness check here on purpose: the gate below owns
          # that invariant, so it holds for every caller of the script
          # rather than only for this workflow.
      - name: Gate against allowlist
        run: bash scripts/govulncheck-gate.sh vulns.txt .github/vuln-allowlist.txt

  # The release job is the only thing that packages the plugin as an
  # unprivileged user on a machine where /var/lib/net-dhcp does not
  # exist — and it only runs on a tag. v1.5.0-rc1 died there on a bare
  # `mkdir /var/lib/net-dhcp` in the `create` recipe (#517).
  #
  # Nothing caught it because `mkdir -p` on an existing directory
  # succeeds whoever owns it: integration and coverage run as root,
  # the hosted cross-check and verify-install `sudo mkdir` first, and
  # the docs tell operators to do the same. Every caller satisfied the
  # precondition before reaching it, so the recipe could not fail.
  #
  # This job is that path's proxy on every PR: same unprivileged user,
  # same absent directory, everything the release does except the push.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A check whose precondition is already satisfied reports success
      # without testing anything — the exact way this bug survived. Fail
      # loudly rather than pass vacuously.
      - name: Assert this runner can actually fail the check
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "Running as root: an unprivileged mkdir failure cannot occur here."
            exit 1
          fi
          if [ -e /var/lib/net-dhcp ]; then
            echo "/var/lib/net-dhcp already exists: mkdir -p would succeed regardless."
            exit 1
          fi
          echo "uid=$(id -u), /var/lib/net-dhcp absent — the release job's conditions."
      - name: Package the plugin the way the release job does
        run: make create
      # Packaging must not have required the host state directory. If
      # this appears, something put the mkdir back on the package path.
      - name: Assert packaging created no host state directory
        run: |
          if [ -e /var/lib/net-dhcp ]; then
            echo "make create created /var/lib/net-dhcp — the bind source belongs to enable, not create (#517)."
            exit 1
          fi
          echo "Packaging touched no host state directory."
