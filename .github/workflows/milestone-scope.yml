name: Milestone scope

# Would the next release close work that is not done?
#
# docs/release-runbook.md step 6 builds the release PR's `Closes` list
# from MILESTONE MEMBERSHIP — "a `Closes #N` line for every issue in the
# milestone" — and merging that PR closes every issue it names. So
# milestone membership is the input to an irreversible batch close, not
# a planning convenience, and a `backlog` issue sitting in a milestone
# gets closed as delivered.
#
# The taxonomy already forbids that pairing. Nothing enforced it, and
# when this was written four open `backlog` issues were carrying
# milestones — including one in v1.7.0 that a by-hand audit of v1.6.0
# had missed entirely, which is the whole argument for a gate over a
# paragraph.
#
# WHY THIS IS NOT IN test.yaml. The claim can become false without
# anybody touching the tree: somebody sets a milestone in the web UI and
# the next unrelated PR goes red, charging the cost to whoever pushed
# next. It would fail on a tracker API blip too. Same reasoning, and the
# same accepted cost, as the Starter tasks workflow.
#
# A RED RUN IS A PROMPT TO LOOK, NOT PROOF. The tracker's issue-list
# index lags the issue itself by up to about a minute, so a run that
# fires just after somebody fixes a label can still report it. Confirm
# with `gh issue view <N> --json labels` before acting; the next run is
# clean on its own. The script's header explains why that is left alone
# rather than retried around.
#
# A red schedule is easier to ignore than a red PR. That is affordable
# here specifically because the risk window is long — a milestone is
# wrong for days or weeks before a release PR exists — so a daily check
# still catches it with room to spare. The check exits 2 rather than 1
# when it cannot see, so "the API was down" stays distinguishable from
# "the milestone is wrong" in the run log.
#
# TWO QUESTIONS, TWO DIFFERENT ANSWERS (#839).
#
# WHICH COPY OF THIS FILE RUNS: `main`'s. A cron only ever fires from the
# default branch, so the `on:` block, the permissions and the step list
# below are whatever shipped in the last release. An edit to this file
# takes effect at the next release, not at merge.
#
# WHICH TREE IT JUDGES AGAINST: `dev`'s — the checkout below pins it.
# The subject is the TRACKER, which advances when work merges to `dev`,
# so the rule that judges it should be the one `dev` states. There is no
# separate declaration file here — the forbidden pairing is stated in
# scripts/check-milestone-scope.sh — and that is exactly why the pin
# matters: without it a correction to that rule is inert until the next
# release, while the tracker it describes has already moved.
#
# So an edit to scripts/check-milestone-scope.sh takes effect the moment
# it reaches `dev`. An edit to this file does not.
on:
  schedule:
    # Daily. Milestones change at human pace, and the thing this
    # protects (a release PR) is a deliberate act somebody schedules.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  milestone-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned (#839). Without a ref the schedule runs `main`'s copy
          # of the rule against a tracker that already reflects `dev`.
          # Same fix as issue-state-labels.yml (#490).
          ref: dev

      - name: No backlog issue carries a milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-milestone-scope.sh
