name: Capability matrix

# What each capability in config.json buys, measured (#690): the tree's
# plugin installed with the full set and with each capability removed in
# turn, one hosted cell each, eight scenarios per cell judged on outside
# evidence by scripts/capability-cell.sh. A cell records; only the
# reconcile job judges, against the table in docs/reference.md.
# `push` on the measurement's own files because a dispatch-only workflow is
# unreachable until it is on the default branch (.github/dispatch-pending.txt).
on:
  push:
    paths:
      - 'config.json'
      - '.github/workflows/capability-matrix.yml'
      - '.github/actions/install-plugin/action.yml'
      - 'scripts/capability-cell.sh'
      - 'scripts/capability-matrix.sh'
  workflow_dispatch:

concurrency:
  group: capability-matrix-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cells:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          set -euo pipefail
          list="$(bash scripts/capability-matrix.sh --cells-json)"
          echo "cells: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  cell:
    needs: cells
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_HUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      CELL: ${{ matrix.cell }}
      PLUGIN_REF: ghcr.io/claymore666/docker-net-dhcp:capability
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.cells.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: env.HAS_HUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install the DHCP server
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dnsmasq-base

      - name: Build the plugin
        run: make PLUGIN_NAME=ghcr.io/claymore666/docker-net-dhcp PLUGIN_TAG=capability plugin

      - name: Remove the cell's capability from the manifest
        id: strip
        run: |
          set -euo pipefail
          if [ "$CELL" != none ]; then
            bash scripts/capability-matrix.sh --strip "$CELL" plugin/config.json > config.cell.json
            mv config.cell.json plugin/config.json
          fi
          echo "caps=$(jq -c .linux.capabilities plugin/config.json)" >> "$GITHUB_OUTPUT"

      # A cell whose enable is refused is a measurement, not a failed job (#690).
      - name: Install the plugin
        id: install
        continue-on-error: true
        uses: ./.github/actions/install-plugin
        with:
          ref: ${{ env.PLUGIN_REF }}
          dir: plugin

      - name: Run the cell
        continue-on-error: true
        shell: bash
        env:
          WANT_CAPS: ${{ steps.strip.outputs.caps }}
        run: |
          set -o pipefail
          sudo bash scripts/capability-cell.sh "$CELL" "$PLUGIN_REF" "$WANT_CAPS" 2>&1 | tee cell.log

      - name: Record the row
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rows
          touch cell.log
          grep '^CAP_MATRIX_ROW ' cell.log > "rows/${CELL}.row" || {
            echo "::error::the cell produced no verdict line for ${CELL}"
            printf 'CAP_MATRIX_ROW removed=%s result=no-verdict\n' "$CELL" > "rows/${CELL}.row"
          }
          cat "rows/${CELL}.row" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the row
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-row-${{ matrix.cell }}
          path: |
            rows/
            cell.log
          retention-days: 30

      - name: Tear down the plugin
        if: always()
        uses: ./.github/actions/teardown-plugin
        with:
          ref: ${{ env.PLUGIN_REF }}

  reconcile:
    needs: [cells, cell]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: capability-row-*
          path: downloaded

      # On dev and main an unmeasured "?" in the table is red; on a branch it
      # is a warning naming the value to commit (#690).
      - name: Reconcile the cells against docs/reference.md
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          set -o pipefail
          strict=()
          case "$REF" in refs/heads/dev|refs/heads/main) strict=(--strict) ;; esac
          bash scripts/capability-matrix.sh --reconcile "${strict[@]}" downloaded | tee -a "$GITHUB_STEP_SUMMARY"
