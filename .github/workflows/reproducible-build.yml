name: Reproducible build

# Build the same commit twice, on two cold builders, and require the
# binaries to be byte-identical (#456).
#
# The property already held — it was measured before this workflow
# existed, and a rebuild of the v1.4.0 tag reproduced the binaries
# inside the published release tarball exactly. What did not exist was
# anything that would notice the day it stopped. Determinism here rests
# on digest-pinned base images, version-pinned apk packages, a fixed
# in-container build path and no timestamp or build-host stamping; any
# of those can be undone by a change that looks entirely reasonable and
# breaks nothing else in CI.
#
# THE VERSION AND THE COMMIT *ARE* STAMPED IN, since 2.0 (`-ldflags -X`,
# O-4), and this workflow passes both as build arguments so it exercises
# the shape release.yml builds in. They are inputs, so identical inputs
# still give identical bytes; what they mean is that "the same source"
# is not sufficient to name a binary — the same source built for a
# different commit is a different, equally deterministic binary. That
# is why no per-release digest list lives in this repository and why
# the published digests are produced by the release build itself, into
# the signed checksums manifest. See docs/verifying-releases.md and
# scripts/check-release-digest-fixed-point.sh.
#
# Both builds get the SAME two values (this workflow is about
# determinism, not about identity), and they are non-default values on
# purpose: passing a real tag and a real commit is the shape release.yml
# builds in, and that is the shape worth exercising.
#
# WHAT THIS WORKFLOW CANNOT SEE, stated because the reason above used to
# claim it could: whether the Dockerfile still threads the two arguments
# into the binary at all. Both builds get the same pair and
# check-reproducible-build.sh compares out-a against out-b, so a
# Dockerfile that had stopped passing them through reproduces perfectly
# here — with the arguments or without them. That question is claim D of
# scripts/check-release-digest-fixed-point.sh, which reconciles the -X
# keys the Dockerfile spells against the Makefile's evaluated
# GO_LDFLAGS and fails when the two diverge.
#
# WHY A SEPARATE BUILDER PER BUILD, and not just `--no-cache`. The
# Dockerfile mounts BuildKit caches for the Go module and build caches.
# `--no-cache` invalidates layers; it does not empty those mounts. Two
# builds on one builder would therefore share compiler output, which is
# the thing under test. A fresh `docker-container` builder starts with
# nothing — the same state a third party reproducing a release is in.
#
# WHEN IT RUNS. Not on every PR: two cold builds are several minutes of
# runner time and reproducibility does not drift from a change to a test
# file. It runs on pull requests that touch the things determinism
# actually depends on, weekly so an upstream base-image change is caught
# without waiting for someone to touch the Dockerfile, and on demand.

on:
  pull_request:
    branches: [main, dev, '2.*']
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/reproducible-build.yml'
      - 'scripts/check-reproducible-build.sh'
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        id: builder_a
        with:
          driver: docker-container

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        id: builder_b
        with:
          driver: docker-container

      # --target builder: the binaries are what must be reproducible.
      # The runtime stage adds an Alpine layer whose own image digest is
      # pinned, so comparing it would test Docker's tar layout rather
      # than our build.
      - name: Build A
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: builder
          no-cache: true
          builder: ${{ steps.builder_a.outputs.name }}
          build-args: |
            VERSION=repro-fixed
            COMMIT=${{ github.sha }}
          outputs: type=local,dest=out-a

      - name: Build B
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: builder
          no-cache: true
          builder: ${{ steps.builder_b.outputs.name }}
          build-args: |
            VERSION=repro-fixed
            COMMIT=${{ github.sha }}
          outputs: type=local,dest=out-b

      - name: Compare
        run: bash scripts/check-reproducible-build.sh out-a out-b
