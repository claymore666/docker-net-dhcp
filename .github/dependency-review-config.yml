# Config for the Dependency Review gate (.github/workflows/dependency-review.yml).
#
# Posture mirrors the govulncheck gate: fail a PR that introduces a new
# high-or-critical advisory. The allow-ghsas list below is the
# advisory-level counterpart of .github/vuln-allowlist.txt and follows
# the same rules:
#   - Every entry needs a justification and a review date. No bare IDs.
#   - Entries are only for findings with no fixed release available on
#     the module path we depend on. The moment a fix ships, the bump
#     lands and the entry is removed.
#   - The documented call-site review is the arbiter: an entry is only
#     acceptable while the vulnerable code paths are not invoked by the
#     plugin (this repo's only docker/docker call-sites are the client
#     APIs listed below). Once the Go vuln DB imports an advisory,
#     govulncheck reports it through module-init symbol traces
#     regardless of actual invocation, so a govulncheck report alone
#     does not void an acceptance — but it does require a matching,
#     justified entry in .github/vuln-allowlist.txt. The lists stay in
#     sync for advisories at or above fail-on-severity; lower-severity
#     advisories live only in vuln-allowlist.txt (this gate never acts
#     on them).

fail-on-severity: high

# No comment-summary-in-pr here on purpose (#398). Posting the summary
# as a PR comment needs pull-requests: write, and the workflow grants
# contents: read only. The action downgrades the resulting 403 to a
# warning, so the setting had been silently doing nothing. Widening the
# token on a public repository buys nothing here: a failure is already
# visible as a red required check, and the full report is written to the
# job summary either way.

# THIS LIST HAD DRIFTED FROM vuln-allowlist.txt (#741). It carried
# three GHSAs and asserted, right here, that all three were "accepted
# with the same justification in .github/vuln-allowlist.txt". Two of
# them were not, and had not been for weeks:
#
#   GHSA-x86f-5xw2-fm2r (= GO-2026-5746) removed 2026-07-28 — govulncheck
#     stopped reporting it as reachable from our call graph, which is
#     that file's documented trigger for dropping an entry;
#   GHSA-rg2x-37c3-w2rh (= GO-2026-5617) removed 2026-08-14 in #525 —
#     "an entry that accepts nothing is an entry nobody will re-review".
#
# So this gate, which runs at fail-on-severity: high, would have waved
# through a PR reintroducing either one — after this project's own
# reachability review had concluded they should no longer be accepted.
# Both files state the sync rule in their headers and neither enforced
# it. This is the "allowlist nobody prunes" failure both of them warn
# about, reached by the route neither anticipated: the pruning DID
# happen, in one file. scripts/check-allowlist-parity.sh now compares
# them, through the declared mapping in .github/ghsa-go-map.txt.
#
# The surviving entry is daemon-side Moby, in github.com/docker/docker.
# This plugin uses that module only as a CLIENT library; its sole
# call-sites are NetworkList, NetworkInspect and ContainerInspect. It
# never invokes the AuthZ handler where this one lives. govulncheck
# reports it via init-chain traces, and it is accepted with the same
# justification in .github/vuln-allowlist.txt (#291/#292). No fix is
# available: the github.com/docker/docker module is frozen at v28.5.2;
# the successor github.com/moby/moby/v2 migration is tracked in #178,
# at which point the acceptance is re-evaluated. Reviewed 2026-06-14
# (#193); re-reviewed 2026-07-03 (#291); reconciled 2026-08-22 (#741).
#
# Not listed (below fail-on-severity, so this gate never acts on them):
# GHSA-pxq6-2prw-chj9 (= GO-2026-4883, medium, live in
# vuln-allowlist.txt) and GHSA-vp62-88p7-qqf5 (= GO-2026-5668, medium,
# `docker cp` symlink-swap empty-file race, removed from
# vuln-allowlist.txt on 2026-08-14 alongside GO-2026-5617).
allow-ghsas:
  # AuthZ plugin bypass on oversized request bodies (= GO-2026-4887,
  # also in vuln-allowlist.txt for the govulncheck gate).
  - GHSA-x744-4wpc-v9h2
